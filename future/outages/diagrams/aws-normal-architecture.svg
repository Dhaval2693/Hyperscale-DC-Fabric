<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
<style>
  .bg   { fill:#0f172a; }
  .card { fill:#1e293b; stroke:#334155; stroke-width:1; }
  .ttl  { fill:#f1f5f9; font-family:system-ui,sans-serif; font-size:14px; font-weight:700; text-anchor:middle; }
  .sub  { fill:#94a3b8; font-family:system-ui,sans-serif; font-size:10px; text-anchor:middle; }
  .nl   { fill:#f1f5f9; font-family:system-ui,sans-serif; font-size:10px; font-weight:700; text-anchor:middle; }
  .sl   { fill:#94a3b8; font-family:system-ui,sans-serif; font-size:9px; text-anchor:middle; }
  .ll   { font-family:system-ui,sans-serif; font-size:10px; font-weight:600; }
  .mono { font-family:monospace; font-size:9px; text-anchor:middle; }

  /* Layer colours */
  .n-user  { fill:#1e293b; stroke:#475569; stroke-width:1.5; }
  .n-edge  { fill:#6366f1; fill-opacity:.15; stroke:#6366f1; stroke-width:1.5; }
  .n-fe    { fill:#8b5cf6; fill-opacity:.15; stroke:#8b5cf6; stroke-width:1.5; }
  .n-net   { fill:#334155; fill-opacity:.6;  stroke:#475569; stroke-width:1.5; }
  .n-dns   { fill:#f59e0b; fill-opacity:.15; stroke:#f59e0b; stroke-width:2; }
  .n-svc   { fill:#10b981; fill-opacity:.12; stroke:#10b981; stroke-width:1.5; }
  .n-ctrl  { fill:#06b6d4; fill-opacity:.12; stroke:#06b6d4; stroke-width:1.5; }

  /* Arrows */
  .arr-ext  { stroke:#6366f1; stroke-width:1.5; fill:none; marker-end:url(#ah-ext); }
  .arr-int  { stroke:#10b981; stroke-width:1.5; fill:none; stroke-dasharray:5,3; marker-end:url(#ah-int); }
  .arr-dns  { stroke:#f59e0b; stroke-width:2;   fill:none; stroke-dasharray:4,3; marker-end:url(#ah-dns); }
  .arr-ctrl { stroke:#06b6d4; stroke-width:1.5; fill:none; stroke-dasharray:4,3; marker-end:url(#ah-ctrl); }

  /* Flowing packet animation */
  .pk-ext  { fill:#6366f1; }
  .pk-int  { fill:#10b981; }
  .pk-dns  { fill:#f59e0b; }
  .pk-ctrl { fill:#06b6d4; }

  @keyframes pulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
  .healthy { animation: pulse 2.5s infinite ease-in-out; }
</style>
<defs>
  <marker id="ah-ext"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6366f1"/></marker>
  <marker id="ah-int"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/></marker>
  <marker id="ah-dns"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
  <marker id="ah-ctrl" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#06b6d4"/></marker>
</defs>

<rect width="860" height="480" rx="10" class="bg"/>
<text x="430" y="24" class="ttl" style="font-size:15px">AWS US-EAST-1 — Normal Architecture</text>
<text x="430" y="40" class="sub">Under normal operation: four planes isolated, DNS healthy, services reachable.</text>

<!-- ── EXTERNAL USERS ── -->
<rect x="12" y="55" width="82" height="120" rx="7" class="n-user"/>
<text x="53" y="74" class="nl" style="fill:#94a3b8">USERS</text>
<text x="53" y="90" class="sl">External</text>
<text x="53" y="103" class="sl">API calls</text>
<text x="53" y="116" class="sl">DNS queries</text>
<text x="53" y="129" class="sl">Console</text>
<text x="53" y="142" class="sl">access</text>

<!-- ── EDGE LAYER ── -->
<rect x="110" y="55" width="120" height="120" rx="7" class="n-edge"/>
<text x="170" y="74" class="nl" style="fill:#818cf8">EDGE</text>
<rect x="120" y="82" width="100" height="22" rx="4" fill="#6366f120" stroke="#6366f150" stroke-width="1"/>
<text x="170" y="97" class="sl" style="fill:#a5b4fc">Route 53 (ext. DNS)</text>
<rect x="120" y="110" width="100" height="22" rx="4" fill="#6366f120" stroke="#6366f150" stroke-width="1"/>
<text x="170" y="125" class="sl" style="fill:#a5b4fc">CloudFront / CDN</text>
<rect x="120" y="138" width="100" height="22" rx="4" fill="#6366f120" stroke="#6366f150" stroke-width="1"/>
<text x="170" y="153" class="sl" style="fill:#a5b4fc">FE Fleet (API GW)</text>

<!-- ── INTERNAL NETWORK ── -->
<rect x="248" y="55" width="110" height="280" rx="7" class="n-net"/>
<text x="303" y="76" class="nl" style="fill:#94a3b8">INTERNAL</text>
<text x="303" y="89" class="nl" style="fill:#94a3b8">NETWORK</text>
<rect x="258" y="100" width="90" height="30" rx="4" fill="#47556930" stroke="#47556960" stroke-width="1"/>
<text x="303" y="119" class="sl">Shared path</text>
<text x="303" y="140" class="sl" style="fill:#64748b">All internal</text>
<text x="303" y="153" class="sl" style="fill:#64748b">traffic routes</text>
<text x="303" y="166" class="sl" style="fill:#64748b">through here</text>
<text x="303" y="200" class="sl" style="fill:#64748b">• Service mesh</text>
<text x="303" y="215" class="sl" style="fill:#64748b">• DNS queries</text>
<text x="303" y="230" class="sl" style="fill:#64748b">• Control plane</text>
<text x="303" y="245" class="sl" style="fill:#64748b">• Health checks</text>
<text x="303" y="280" class="mono" style="fill:#f59e0b;font-size:10px">⚠ shared</text>
<text x="303" y="295" class="sl" style="fill:#64748b">no isolation</text>
<text x="303" y="308" class="sl" style="fill:#64748b">between planes</text>

<!-- ── INTERNAL DNS ── -->
<rect x="376" y="55" width="130" height="120" rx="7" class="n-dns"/>
<text x="441" y="74" class="nl" style="fill:#fbbf24">INTERNAL DNS</text>
<text x="441" y="88" class="sl" style="fill:#fde68a">Critical shared resource</text>
<rect x="386" y="96" width="110" height="18" rx="3" fill="#f59e0b15" stroke="#f59e0b40" stroke-width="1"/>
<text x="441" y="109" class="sl" style="fill:#fde68a">DNS Resolver cluster A</text>
<rect x="386" y="118" width="110" height="18" rx="3" fill="#f59e0b15" stroke="#f59e0b40" stroke-width="1"/>
<text x="441" y="131" class="sl" style="fill:#fde68a">DNS Resolver cluster B</text>
<rect x="386" y="140" width="110" height="18" rx="3" fill="#f59e0b15" stroke="#f59e0b40" stroke-width="1"/>
<text x="441" y="153" class="sl" style="fill:#fde68a">DNS Resolver cluster C</text>
<text x="441" y="170" class="mono" style="fill:#10b981" class="healthy">● HEALTHY  &lt;5ms</text>

<!-- ── AWS SERVICES ── -->
<rect x="524" y="55" width="140" height="280" rx="7" class="n-svc"/>
<text x="594" y="74" class="nl" style="fill:#34d399">AWS SERVICES</text>
<rect x="534" y="82"  width="120" height="22" rx="4" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
<text x="594" y="97"  class="sl" style="fill:#6ee7b7">EC2 + IMDS</text>
<rect x="534" y="108" width="120" height="22" rx="4" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
<text x="594" y="123" class="sl" style="fill:#6ee7b7">S3 Object Storage</text>
<rect x="534" y="134" width="120" height="22" rx="4" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
<text x="594" y="149" class="sl" style="fill:#6ee7b7">Lambda Functions</text>
<rect x="534" y="160" width="120" height="22" rx="4" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
<text x="594" y="175" class="sl" style="fill:#6ee7b7">SQS / SES / SNS</text>
<rect x="534" y="186" width="120" height="22" rx="4" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
<text x="594" y="201" class="sl" style="fill:#6ee7b7">AWS Console</text>
<rect x="534" y="212" width="120" height="22" rx="4" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
<text x="594" y="227" class="sl" style="fill:#6ee7b7">Amazon Connect</text>
<rect x="534" y="238" width="120" height="22" rx="4" fill="#10b98115" stroke="#10b98140" stroke-width="1"/>
<text x="594" y="253" class="sl" style="fill:#6ee7b7">DynamoDB</text>
<text x="594" y="285" class="mono" style="fill:#10b981">● ALL HEALTHY</text>
<text x="594" y="300" class="sl">Serving normally</text>
<text x="594" y="313" class="sl">via internal DNS</text>

<!-- ── CONTROL PLANE ── -->
<rect x="376" y="220" width="270" height="80" rx="7" class="n-ctrl"/>
<text x="511" y="240" class="nl" style="fill:#22d3ee">CONTROL PLANE / CAPACITY MANAGEMENT</text>
<text x="511" y="256" class="sl" style="fill:#a5f3fc">Automated capacity expansion • Fleet health • Deployment automation</text>
<text x="511" y="272" class="sl" style="fill:#a5f3fc">Runs operational tasks — traffic also routes via the shared internal network</text>
<text x="511" y="288" class="mono" style="fill:#10b981">● IDLE — no active operations</text>

<!-- ── THIRD-PARTY APPS ── -->
<rect x="682" y="55" width="168" height="120" rx="7" class="n-user" style="stroke:#475569"/>
<text x="766" y="74" class="nl" style="fill:#94a3b8">THIRD-PARTY</text>
<text x="766" y="90" class="sl">Netflix, Disney+</text>
<text x="766" y="104" class="sl">Slack, Flickr</text>
<text x="766" y="118" class="sl">Tinder, Twitch</text>
<text x="766" y="132" class="sl">+ hundreds more</text>
<text x="766" y="150" class="mono" style="fill:#10b981">● SERVING USERS</text>

<!-- ── CONNECTIONS ── -->
<!-- User → Edge -->
<line x1="94"  y1="100" x2="110" y2="100" class="arr-ext"/>
<!-- Edge → Internal Network (API traffic) -->
<line x1="230" y1="140" x2="248" y2="140" class="arr-int"/>
<!-- Internal Network → DNS (queries) -->
<line x1="358" y1="100" x2="376" y2="100" class="arr-dns"/>
<!-- DNS → Internal Network (responses) -->
<line x1="376" y1="120" x2="358" y2="120" class="arr-dns" style="stroke-dasharray:3,3; stroke-opacity:.5"/>
<!-- Internal Network → Services -->
<line x1="358" y1="160" x2="524" y2="160" class="arr-int"/>
<!-- Services → Third-party -->
<line x1="664" y1="120" x2="682" y2="120" class="arr-int" style="stroke:#10b981"/>
<!-- Control plane → Internal Network -->
<line x1="376" y1="265" x2="358" y2="265" class="arr-ctrl"/>

<!-- Animated packets flowing normally -->
<!-- User → Edge: ext packets -->
<path id="p-ue" d="M94,100 L110,100" fill="none" opacity="0"/>
<path id="p-en" d="M230,140 L248,140" fill="none" opacity="0"/>
<path id="p-nd" d="M358,100 L376,100" fill="none" opacity="0"/>
<path id="p-ns" d="M358,160 L524,160" fill="none" opacity="0"/>
<path id="p-st" d="M664,120 L682,120" fill="none" opacity="0"/>

<circle r="4" class="pk-ext"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0s"><mpath href="#p-ue"/></animateMotion></circle>
<circle r="4" class="pk-ext"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.5s"><mpath href="#p-ue"/></animateMotion></circle>
<circle r="4" class="pk-int"><animateMotion dur="1.2s" repeatCount="indefinite" begin="0.2s"><mpath href="#p-en"/></animateMotion></circle>
<circle r="4" class="pk-dns"><animateMotion dur="1.0s" repeatCount="indefinite" begin="0s"><mpath href="#p-nd"/></animateMotion></circle>
<circle r="4" class="pk-dns"><animateMotion dur="1.0s" repeatCount="indefinite" begin="0.4s"><mpath href="#p-nd"/></animateMotion></circle>
<circle r="4" class="pk-int"><animateMotion dur="1.2s" repeatCount="indefinite" begin="0s"><mpath href="#p-ns"/></animateMotion></circle>
<circle r="4" class="pk-int"><animateMotion dur="1.2s" repeatCount="indefinite" begin="0.6s"><mpath href="#p-ns"/></animateMotion></circle>
<circle r="4" class="pk-int"><animateMotion dur="1.0s" repeatCount="indefinite" begin="0.3s"><mpath href="#p-st"/></animateMotion></circle>

<!-- ── BOTTOM LEGEND ── -->
<rect x="12" y="360" width="836" height="108" rx="7" class="card"/>
<text x="430" y="378" class="ttl" style="font-size:12px">The Four Planes — and the Hidden Risk</text>
<text x="430" y="394" class="sub" style="font-size:11px;fill:#f1f5f9">Under normal operation, all four planes share the internal network without issue — traffic volumes are low enough that congestion never occurs.</text>
<text x="430" y="410" class="sub" style="font-size:11px">The architectural risk is invisible under normal load: the control plane (capacity automation) shares the same internal network path as the DNS resolvers every service depends on.</text>
<text x="430" y="426" class="sub" style="font-size:11px;fill:#f1f5f9">This means a control-plane event that generates unusual traffic can degrade DNS — and degraded DNS can make every single internal service unable to communicate.</text>
<text x="430" y="442" class="sub" style="font-size:11px">There is no circuit breaker between these planes. There is no capacity reservation for DNS traffic. The shared path is the single undiscovered point of failure.</text>
<rect x="24"  y="458" width="200" height="6" rx="3" fill="#6366f1" opacity=".7"/>
<text x="128" y="474" class="sl" style="fill:#818cf8">External (user-facing) traffic</text>
<rect x="240" y="458" width="200" height="6" rx="3" fill="#10b981" opacity=".7"/>
<text x="344" y="474" class="sl" style="fill:#6ee7b7">Internal service mesh traffic</text>
<rect x="456" y="458" width="200" height="6" rx="3" fill="#f59e0b" opacity=".7" stroke-dasharray="5,3"/>
<text x="560" y="474" class="sl" style="fill:#fde68a">DNS query/response traffic</text>
<rect x="672" y="458" width="164" height="6" rx="3" fill="#06b6d4" opacity=".7"/>
<text x="754" y="474" class="sl" style="fill:#a5f3fc">Control-plane traffic</text>
</svg>
