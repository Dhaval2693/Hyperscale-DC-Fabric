<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="650" height="425" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Four switches arranged in a square, each sending a pause to the next around the ring, so none can drain and the traffic class is frozen.">
  <title>A pause cycle no one can break</title>
  <defs><marker id="lossless-deadlock-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <rect x="0.5" y="0.5" width="519" height="339" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="260" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">A PAUSE CYCLE NO ONE CAN BREAK</text>
  <g transform="translate(0,30)">
    <g><rect x="70" y="40" width="110" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="125" y="68.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Switch A</text></g>
    <g><rect x="340" y="40" width="110" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="395" y="68.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Switch B</text></g>
    <g><rect x="340" y="180" width="110" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="395" y="208.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Switch C</text></g>
    <g><rect x="70" y="180" width="110" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="125" y="208.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Switch D</text></g>
    <path d="M180,58 H336" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#lossless-deadlock-ah-hot)"/>
    <path d="M396,90 V176" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#lossless-deadlock-ah-hot)"/>
    <path d="M340,210 H184" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#lossless-deadlock-ah-hot)"/>
    <path d="M124,180 V94" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#lossless-deadlock-ah-hot)"/>
    <text x="258" y="50" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>PAUSE</text>
    <text x="408" y="133" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>PAUSE</text>
    <text x="258" y="222" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>PAUSE</text>
    <text x="112" y="133" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>PAUSE</text>
    <text x="260" y="135" fill="#dc2626" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="700">frozen</text>
  </g>
  <text x="260" y="308" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="260" dy="0">Each switch has paused the one feeding it and is itself paused by the next. The wait forms</tspan><tspan x="260" dy="14">a ring, so no buffer ever drains and the class freezes. This is PFC deadlock.</tspan></text>
</svg>
