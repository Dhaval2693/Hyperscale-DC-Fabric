<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 414" width="700" height="518" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A vertical stack of layers from GPU at the top down to the fabric and the collective library, each labelled with the problem that bites at that layer.">
  <title>Where performance gets lost, layer by layer</title>
  <rect x="0.5" y="0.5" width="559" height="413" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">WHERE PERFORMANCE GETS LOST, LAYER BY LAYER</text>
  <g transform="translate(0,30)">
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0333;0.0556;1" dur="9s" repeatCount="indefinite"/><g><rect x="60" y="30" width="230" height="32" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="175" y="49" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g><text x="310" y="50" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">stalls when data is late</text></g>
    <line x1="175" y1="62" x2="175" y2="68" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0889;0.1111;1" dur="9s" repeatCount="indefinite"/><g><rect x="60" y="70" width="230" height="32" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="175" y="89" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">PCIe / NVLink</text></g><text x="310" y="90" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">scale-up link saturates</text></g>
    <line x1="175" y1="102" x2="175" y2="108" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1444;0.1667;1" dur="9s" repeatCount="indefinite"/><g><rect x="60" y="110" width="230" height="32" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="175" y="129" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">NIC</text></g><text x="310" y="130" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">queue pairs, posting overhead</text></g>
    <line x1="175" y1="142" x2="175" y2="148" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.2222;1" dur="9s" repeatCount="indefinite"/><g><rect x="60" y="150" width="230" height="32" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="175" y="169" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">link</text></g><text x="310" y="170" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">drops, pauses, marking</text></g>
    <line x1="175" y1="182" x2="175" y2="188" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2556;0.2778;1" dur="9s" repeatCount="indefinite"/><g><rect x="60" y="190" width="230" height="32" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="175" y="209" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">switch / fabric</text></g><text x="310" y="210" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">congestion, incast, routing</text></g>
    <line x1="175" y1="222" x2="175" y2="228" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3111;0.3333;1" dur="9s" repeatCount="indefinite"/><g><rect x="60" y="230" width="230" height="32" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="175" y="249" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">collective library (NCCL)</text></g><text x="310" y="250" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">wrong algorithm or topology</text></g>
    <line x1="175" y1="262" x2="175" y2="268" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3667;0.3889;1" dur="9s" repeatCount="indefinite"/><g><rect x="60" y="270" width="230" height="32" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="175" y="289" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">framework</text></g><text x="310" y="290" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">poor compute/comm overlap</text></g>
    <text x="280" y="315" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">articles 11-14 walk down this stack</text>
  </g>
  <text x="280" y="368" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">A result crosses this stack on its way between GPUs. Each layer has a typical failure, and each is</tspan><tspan x="280" dy="14">the subject of a later article: verbs and queue pairs, collectives and NCCL, measurement, and the</tspan><tspan x="280" dy="14">transport under it all.</tspan></text>
</svg>
