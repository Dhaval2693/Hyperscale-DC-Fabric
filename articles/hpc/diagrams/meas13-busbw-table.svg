<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 384" width="725" height="480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A table of nccl-tests columns with one row highlighted; an arrow points at the busbw column with the formula busbw equals algbw times 2(n-1)/n.">
  <title>Reading an all_reduce_perf row: busbw is the comparable number</title>
  <rect x="0.5" y="0.5" width="579" height="383" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">READING AN ALL_REDUCE_PERF ROW: BUSBW IS THE COMPARABLE NUMBER</text>
  <g transform="translate(0,30)">
    <text x="70" y="56" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">size</text>
    <text x="170" y="56" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">time</text>
    <text x="270" y="56" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">algbw</text>
    <text x="380" y="56" fill="#d97706" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">busbw</text>
    <text x="500" y="56" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">#wrong</text>
    <line x1="50" y1="66" x2="540" y2="66" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text x="70" y="92" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">8 B</text>
    <text x="170" y="92" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">9.1 us</text>
    <text x="270" y="92" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0.00</text>
    <text x="380" y="92" fill="#d97706" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">0.00</text>
    <text x="500" y="92" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="70" y="126" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1 MB</text>
    <text x="170" y="126" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">42 us</text>
    <text x="270" y="126" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">24.9</text>
    <text x="380" y="126" fill="#d97706" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">46.7</text>
    <text x="500" y="126" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <text x="70" y="160" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">128 MB</text>
    <text x="170" y="160" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">2.1 ms</text>
    <text x="270" y="160" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">63.1</text>
    <text x="380" y="160" fill="#d97706" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">118</text>
    <text x="500" y="160" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <rect x="52" y="174" width="486" height="28" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="70" y="194" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1 GB</text>
    <text x="170" y="194" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">15 ms</text>
    <text x="270" y="194" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">69.8</text>
    <text x="380" y="194" fill="#d97706" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">131</text>
    <text x="500" y="194" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0</text>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2222;0.2444;1" dur="9s" repeatCount="indefinite"/><text x="300" y="256" fill="#d97706" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">busbw = algbw x 2(n-1)/n</text><text x="300" y="274" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">compare busbw to the NIC's line rate, not algbw</text></g>
  </g>
  <text x="290" y="338" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">nccl-tests prints size, time, algorithm bandwidth and bus bandwidth per message size. busbw folds in</tspan><tspan x="290" dy="14">the 2(n-1)/n collective factor, so it is what you compare against the hardware's peak. #wrong must be</tspan><tspan x="290" dy="14">zero.</tspan></text>
</svg>
