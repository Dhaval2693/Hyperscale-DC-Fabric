<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="725" height="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="The sentence 'explain how a jet engine works' splits into seven tokens, ex, plain, how, a, jet, engine and works, each shown above its vocabulary number.">
  <title>Text becomes a list of numbered tokens</title>
  <rect x="0.5" y="0.5" width="579" height="279" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">TEXT BECOMES A LIST OF NUMBERED TOKENS</text>
  <g transform="translate(0,30)">
    <text x="290" y="30" fill="#334155" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">&quot;explain how a jet engine works&quot;</text>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0444;0.0778;1" dur="9s" repeatCount="indefinite"/><g><rect x="38" y="66" width="52" height="30" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="64" y="84.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ex</text></g><g><rect x="38" y="108" width="52" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="64" y="124.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">490</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1111;0.1444;1" dur="9s" repeatCount="indefinite"/><g><rect x="100" y="66" width="62" height="30" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="131" y="84.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">plain</text></g><g><rect x="100" y="108" width="62" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="131" y="124.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">26330</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1778;0.2111;1" dur="9s" repeatCount="indefinite"/><g><rect x="172" y="66" width="62" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="203" y="84.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">␣how</text></g><g><rect x="172" y="108" width="62" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="203" y="124.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1495</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2444;0.2778;1" dur="9s" repeatCount="indefinite"/><g><rect x="244" y="66" width="52" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="270" y="84.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">␣a</text></g><g><rect x="244" y="108" width="52" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="270" y="124.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">261</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3111;0.3444;1" dur="9s" repeatCount="indefinite"/><g><rect x="306" y="66" width="62" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="337" y="84.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">␣jet</text></g><g><rect x="306" y="108" width="62" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="337" y="124.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">26158</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3778;0.4111;1" dur="9s" repeatCount="indefinite"/><g><rect x="378" y="66" width="82" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="419" y="84.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">␣engine</text></g><g><rect x="378" y="108" width="82" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="419" y="124.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">6018</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4444;0.4778;1" dur="9s" repeatCount="indefinite"/><g><rect x="470" y="66" width="72" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="506" y="84.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">␣works</text></g><g><rect x="470" y="108" width="72" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="506" y="124.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">5882</text></g></g>
    <text x="290" y="160" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">one word can be several tokens; each token is one number</text>
    <text x="290" y="178" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">o200k_base vocabulary: about 200,000 entries</text>
  </g>
  <text x="290" y="248" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">OpenAI's o200k_base tokenizer turns the sentence into seven numbered fragments. 'explain' at the very</tspan><tspan x="290" dy="14">start splits into 'ex' + 'plain'; the other tokens carry the space before the word (shown as ␣).</tspan></text>
</svg>
