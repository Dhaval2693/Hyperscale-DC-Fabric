<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 394" width="700" height="492" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A five-rung ladder from a single link at the bottom to the real workload at the top, each rung lighting up in turn from bottom to top.">
  <title>Measure bottom-up, one rung at a time</title>
  <defs><marker id="meas13-measurement-ladder-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="393" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">MEASURE BOTTOM-UP, ONE RUNG AT A TIME</text>
  <g transform="translate(0,30)">
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.06;1" dur="10s" repeatCount="indefinite"/><g><rect x="150" y="250" width="260" height="34" rx="6" fill="#ebedf0" stroke="#64748b" stroke-width="1.5"/><text x="280" y="264.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1  single link</text><text x="280" y="276.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">FEC, errors, link speed</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.22;1" dur="10s" repeatCount="indefinite"/><g><rect x="150" y="202" width="260" height="34" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="216.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">2  NIC pair</text><text x="280" y="228.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">perftest / fabtests</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.38;1" dur="10s" repeatCount="indefinite"/><g><rect x="150" y="154" width="260" height="34" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="168.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">3  collective, 2 nodes</text><text x="280" y="180.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">nccl-tests small</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.54;1" dur="10s" repeatCount="indefinite"/><g><rect x="150" y="106" width="260" height="34" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="280" y="120.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">4  collective, full scale</text><text x="280" y="132.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">nccl-tests at N nodes</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.7;1" dur="10s" repeatCount="indefinite"/><g><rect x="150" y="58" width="260" height="34" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="280" y="72.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">5  real workload</text><text x="280" y="84.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">step time, tokens/s, MFU</text></g></g>
    <line x1="120" y1="284" x2="120" y2="58" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#meas13-measurement-ladder-ah-link)"/>
    <text x="60" y="150" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">you climb</text>
    <text x="60" y="164" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">this way</text>
  </g>
  <text x="280" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Start at the physical link and climb: a single link, a NIC-to-NIC pair, a collective on two nodes,</tspan><tspan x="280" dy="14">the collective at full scale, then the real job. Trust a rung only once the rung below it is</tspan><tspan x="280" dy="14">clean.</tspan></text>
</svg>
