<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="725" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top: a two-sided SEND where both CPUs act. Bottom: a one-sided WRITE where only the initiator's CPU acts and the target CPU stays idle.">
  <title>Two-sided needs both CPUs; one-sided needs only yours</title>
  <rect x="0.5" y="0.5" width="579" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">TWO-SIDED NEEDS BOTH CPUS; ONE-SIDED NEEDS ONLY YOURS</text>
  <g transform="translate(0,30)">
    <text x="14" y="26" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">TWO-SIDED (SEND/RECV)</text>
    <g><rect x="60" y="42" width="90" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="105" y="65" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">CPU A</text></g>
    <g><rect x="430" y="42" width="90" height="40" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="475" y="65" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">CPU B</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0625;0.4375;0.4625;1" dur="8s" repeatCount="indefinite"/><text x="485" y="36" fill="#7c3aed" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="end">posts RECV, then handles it</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;270 0;270 0" keyTimes="0;0.075;0.325;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.0938;0.3063;0.325;1" dur="8s" repeatCount="indefinite"/><g><rect x="150" y="50" width="40" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="170" y="64.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">msg</text></g></g>
    <text x="290" y="100" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">both CPUs take part</text>
    <text x="14" y="150" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ONE-SIDED (RDMA WRITE/READ)</text>
    <g><rect x="60" y="166" width="90" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="105" y="189" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">CPU A</text></g>
    <g><rect x="430" y="166" width="90" height="44" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="475" y="185.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">memory B</text><text x="475" y="196.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">CPU B idle</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;270 0;270 0" keyTimes="0;0.075;0.325;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.0938;0.3063;0.325;1" dur="8s" repeatCount="indefinite"/><g><rect x="150" y="174" width="40" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="170" y="188.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">data</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.375;1" dur="8s" repeatCount="indefinite"/><text x="290" y="230" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">CPU B never wakes up</text></g>
  </g>
  <text x="290" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">SEND/RECV is a handshake: the receiver must post a buffer first, so its CPU takes part. RDMA WRITE and</tspan><tspan x="290" dy="14">READ touch the peer's registered memory directly, with the peer's CPU never involved.</tspan></text>
</svg>
