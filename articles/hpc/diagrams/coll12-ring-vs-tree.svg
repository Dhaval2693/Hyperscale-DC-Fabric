  <text x="300" y="308" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">A ring passes data hand to hand around all ranks. A tree reduces up pairs so the hop count grows with the</tspan><tspan x="300" dy="14">logarithm of the ranks. In-network reduction sums inside the switch, so each rank sends once.</tspan></text>
