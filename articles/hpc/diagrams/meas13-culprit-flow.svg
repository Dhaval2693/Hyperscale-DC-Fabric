<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 344" width="725" height="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A four-box cycle: symptom to check to fix to re-measure and back to symptom, with a flow arrow travelling around the loop.">
  <title>Each culprit is a symptom, a check, and a fix</title>
  <defs><marker id="meas13-culprit-flow-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="meas13-culprit-flow-ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect x="0.5" y="0.5" width="579" height="343" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">EACH CULPRIT IS A SYMPTOM, A CHECK, AND A FIX</text>
  <g transform="translate(0,30)">
    <g><rect x="60" y="100" width="140" height="56" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="130" y="119.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">symptom</text><text x="130" y="131.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">busbw low,</text><text x="130" y="143" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">retx rising</text></g>
    <g><rect x="220" y="100" width="140" height="56" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="290" y="119.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">check</text><text x="290" y="131.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">GPUDirect?</text><text x="290" y="143" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">NUMA? PCIe?</text></g>
    <g><rect x="380" y="100" width="140" height="56" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="450" y="119.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">fix</text><text x="450" y="131.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">pin affinity,</text><text x="450" y="143" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">reseat, set MTU</text></g>
    <g><rect x="220" y="30" width="140" height="56" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="290" y="49.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">re-measure</text><text x="290" y="61.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">run the rung</text><text x="290" y="73" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">again</text></g>
    <line x1="200" y1="128" x2="220" y2="128" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#meas13-culprit-flow-ah-link)"/>
    <line x1="360" y1="128" x2="380" y2="128" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#meas13-culprit-flow-ah-link)"/>
    <path d="M450 100 C450 58 360 58 360 58" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#meas13-culprit-flow-ah-ok)"/>
    <path d="M220 58 C130 58 130 100 130 100" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#meas13-culprit-flow-ah-ok)"/>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;300 0;300 0" keyTimes="0;0.0625;0.4375;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0625;0.0813;0.4188;0.4375;1" dur="8s" repeatCount="indefinite"/><circle cx="205" cy="128" r="5" fill="#dc2626"/></g>
  </g>
  <text x="290" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">Triage runs as a loop: a symptom points to a check, the check points to a fix, and you re-measure to</tspan><tspan x="290" dy="14">confirm. GPUDirect off, wrong NUMA affinity, a down-trained PCIe link and MTU mismatch all fit this</tspan><tspan x="290" dy="14">shape.</tspan></text>
</svg>
