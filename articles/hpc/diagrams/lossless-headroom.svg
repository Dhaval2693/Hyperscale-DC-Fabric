<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="700" height="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A sender and a switch; after XOFF a pause frame travels back along the cable, and packets already in flight keep arriving and fill the reserved headroom.">
  <title>Why a lossless queue keeps bytes in reserve</title>
  <rect x="0.5" y="0.5" width="559" height="289" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">WHY A LOSSLESS QUEUE KEEPS BYTES IN RESERVE</text>
  <g transform="translate(0,30)">
    <g><rect x="20" y="80" width="90" height="50" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="65" y="108.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Sender</text></g>
    <rect x="410" y="44" width="140" height="150" rx="6" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="480" y="62" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Switch</text>
    <path d="M110,96 H410" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-300 0;-300 0" keyTimes="0;0.125;0.375;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.1437;0.3563;0.375;1" dur="8s" repeatCount="indefinite"/><g><rect x="352" y="86" width="56" height="20" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="380" y="99" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">PAUSE</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;290 0;290 0" keyTimes="0;0.15;0.375;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1687;0.3563;0.375;1" dur="8s" repeatCount="indefinite"/><rect x="120" y="90" width="20" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;290 0;290 0" keyTimes="0;0.1875;0.4125;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1875;0.2062;0.3937;0.4125;1" dur="8s" repeatCount="indefinite"/><rect x="120" y="90" width="20" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;290 0;290 0" keyTimes="0;0.225;0.45;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.225;0.2437;0.4312;0.45;1" dur="8s" repeatCount="indefinite"/><rect x="120" y="90" width="20" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;290 0;290 0" keyTimes="0;0.2625;0.4875;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2625;0.2812;0.4687;0.4875;1" dur="8s" repeatCount="indefinite"/><rect x="120" y="90" width="20" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/></g>
    <rect x="432" y="78" width="34" height="104" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="432" y1="112" x2="466" y2="112" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
    <g transform="translate(434,180)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.1;1 0.1;1 1;1 1;1 0.1;1 0.1" keyTimes="0;0.025;0.375;0.5;0.55;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-66" width="30" height="66" rx="3" fill="#ebedf0" stroke="#64748b" stroke-width="1.5"/></g></g>
    <g transform="translate(434,112)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.05;1 0.05;1 1;1 1;1 0.05;1 0.05" keyTimes="0;0.275;0.425;0.5625;0.6125;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-32" width="30" height="32" rx="3" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/></g></g>
    <text x="474" y="96" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">headroom</text>
    <text x="474" y="150" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">normal fill</text>
    <text x="260" y="150" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="260" dy="0">bytes still in flight</tspan><tspan x="260" dy="13">must land somewhere</tspan></text>
  </g>
  <text x="280" y="258" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">The PAUSE takes time to travel the cable and be acted on. Every byte already on the wire during</tspan><tspan x="280" dy="14">that window must land somewhere, so the queue reserves headroom above XOFF to catch them.</tspan></text>
</svg>
