<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" font-family="monospace">
  <text x="220" y="16" fill="#64748b" font-size="11" text-anchor="middle">Data’s path through the kernel (every message, both ways)</text>
  <rect x="10" y="46" width="70" height="34" rx="5" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="45" y="67" fill="#334155" font-size="11" text-anchor="middle">App mem</text>
  <rect x="110" y="46" width="70" height="34" rx="5" fill="#dc262622" stroke="#dc2626" stroke-width="1.5"/>
  <text x="145" y="62" fill="#334155" font-size="11" text-anchor="middle">Kernel</text>
  <text x="145" y="74" fill="#64748b" font-size="10" text-anchor="middle">copy</text>
  <rect x="210" y="46" width="54" height="34" rx="5" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="237" y="67" fill="#334155" font-size="11" text-anchor="middle">NIC</text>
  <rect x="294" y="46" width="70" height="34" rx="5" fill="#dc262622" stroke="#dc2626" stroke-width="1.5"/>
  <text x="329" y="62" fill="#334155" font-size="11" text-anchor="middle">Kernel</text>
  <text x="329" y="74" fill="#64748b" font-size="10" text-anchor="middle">copy</text>
  <rect x="376" y="46" width="60" height="34" rx="5" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="406" y="67" fill="#334155" font-size="11" text-anchor="middle">App</text>
  <path d="M80,63 L110,63" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M180,63 L210,63" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M264,63 L294,63" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M364,63 L376,63" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <text x="220.0" y="118" fill="#64748b" font-size="10.5" font-family="sans-serif" text-anchor="middle">
  <tspan x="220.0" dy="0">Each message is copied into and out of kernel buffers on both ends.</tspan>
  <tspan x="220.0" dy="14">The next article’s technology — RDMA — deletes the two red copy steps.</tspan>
  </text>
