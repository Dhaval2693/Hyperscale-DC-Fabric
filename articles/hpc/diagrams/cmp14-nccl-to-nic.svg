<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="725" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="NCCL at the top branching down two paths: a verbs path to a RoCE/IB NIC, and an aws-ofi-nccl plus libfabric path to an EFA device.">
  <title>NCCL reaches RoCE through verbs and EFA through a libfabric plugin</title>
  <defs><marker id="cmp14-nccl-to-nic-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="cmp14-nccl-to-nic-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="cmp14-nccl-to-nic-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="579" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">NCCL REACHES ROCE THROUGH VERBS AND EFA THROUGH A LIBFABRIC PLUGIN</text>
  <g transform="translate(0,30)">
    <g><rect x="230" y="20" width="120" height="34" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="290" y="40.6" fill="#334155" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">NCCL</text></g>
    <g><rect x="70" y="96" width="150" height="32" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="145" y="115" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">verbs transport</text></g>
    <g><rect x="70" y="166" width="150" height="34" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="145" y="186" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">RoCE / IB NIC</text></g>
    <path d="M265 54 C230 70 160 76 150 96" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-nccl-to-nic-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M145 128 V166" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-nccl-to-nic-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><rect x="360" y="96" width="160" height="32" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="440" y="115" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">aws-ofi-nccl plugin</text></g>
    <g><rect x="360" y="146" width="160" height="28" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="440" y="163" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">libfabric (OFI)</text></g>
    <g><rect x="360" y="192" width="160" height="32" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="440" y="211" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">EFA device (SRD)</text></g>
    <path d="M320 54 C360 70 430 76 440 96" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-nccl-to-nic-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M440 128 V146" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-nccl-to-nic-ah-warn)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M440 174 V192" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-nccl-to-nic-ah-warn)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  </g>
  <text x="290" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">NCCL talks to a RoCE or InfiniBand NIC through its built-in verbs transport. For EFA it loads the aws-</tspan><tspan x="290" dy="14">ofi-nccl plugin, which speaks libfabric to the EFA device.</tspan></text>
</svg>
