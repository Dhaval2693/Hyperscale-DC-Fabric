<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="775" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A horizontal timeline with milestones from 2019 through 2026 appearing one after another from left to right.">
  <title>Where the fabric is going, 2019 to 2026</title>
  <rect x="0.5" y="0.5" width="619" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="310" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">WHERE THE FABRIC IS GOING, 2019 TO 2026</text>
  <g transform="translate(0,30)">
    <line x1="40" y1="120" x2="590" y2="120" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="70" cy="120" r="5" fill="#7c3aed"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.03;0.05;1" dur="10s" repeatCount="indefinite"/><line x1="70" y1="120" x2="70" y2="92" fill="none" stroke="#7c3aed" stroke-width="1.5"/><text x="70" y="84" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2019</text><text x="70" y="70" fill="#7c3aed" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">EFA/SRD</text><text x="70" y="56" fill="#94a3b8" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">general availability</text></g>
    <circle cx="150" cy="120" r="5" fill="#7c3aed"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.17;1" dur="10s" repeatCount="indefinite"/><line x1="150" y1="120" x2="150" y2="148" fill="none" stroke="#7c3aed" stroke-width="1.5"/><text x="150" y="162" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2020</text><text x="150" y="176" fill="#7c3aed" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">SRD paper</text><text x="150" y="190" fill="#94a3b8" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">IEEE Micro</text></g>
    <circle cx="240" cy="120" r="5" fill="#0891b2"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.29;1" dur="10s" repeatCount="indefinite"/><line x1="240" y1="120" x2="240" y2="92" fill="none" stroke="#0891b2" stroke-width="1.5"/><text x="240" y="84" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2023</text><text x="240" y="70" fill="#0891b2" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Falcon</text><text x="240" y="56" fill="#94a3b8" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">opened via OCP; UEC forms</text></g>
    <circle cx="340" cy="120" r="5" fill="#d97706"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.39;0.41;1" dur="10s" repeatCount="indefinite"/><line x1="340" y1="120" x2="340" y2="148" fill="none" stroke="#d97706" stroke-width="1.5"/><text x="340" y="162" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2024</text><text x="340" y="176" fill="#d97706" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Meta RoCE</text><text x="340" y="190" fill="#94a3b8" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">SIGCOMM paper on RoCE at scale</text></g>
    <circle cx="430" cy="120" r="5" fill="#0891b2"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.51;0.53;1" dur="10s" repeatCount="indefinite"/><line x1="430" y1="120" x2="430" y2="92" fill="none" stroke="#0891b2" stroke-width="1.5"/><text x="430" y="84" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2024</text><text x="430" y="70" fill="#0891b2" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Spectrum-X</text><text x="430" y="56" fill="#94a3b8" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">adaptive-routing RoCE</text></g>
    <circle cx="510" cy="120" r="5" fill="#16a34a"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.65;1" dur="10s" repeatCount="indefinite"/><line x1="510" y1="120" x2="510" y2="148" fill="none" stroke="#16a34a" stroke-width="1.5"/><text x="510" y="162" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2025</text><text x="510" y="176" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">UEC 1.0 + UALink</text><text x="510" y="190" fill="#94a3b8" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">open AI transports</text></g>
    <circle cx="575" cy="120" r="5" fill="#dc2626"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="10s" repeatCount="indefinite"/><line x1="575" y1="120" x2="575" y2="92" fill="none" stroke="#dc2626" stroke-width="1.5"/><text x="575" y="84" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2026</text><text x="575" y="70" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1.6T Ethernet</text><text x="575" y="56" fill="#94a3b8" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">802.3dj due</text></g>
  </g>
  <text x="310" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="310" dy="0">A public timeline: SRD's paper, Falcon opened to OCP, the UEC forming and shipping 1.0, Meta's RoCE paper,</tspan><tspan x="310" dy="14">Spectrum-X, UALink for scale-up, and 800G/1.6T Ethernet due in 2026.</tspan></text>
</svg>
