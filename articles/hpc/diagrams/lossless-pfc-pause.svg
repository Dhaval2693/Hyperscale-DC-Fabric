<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="725" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A switch with eight priority queues; the RDMA queue fills, a pause frame travels upstream to the sender, the RDMA flow stops while other flows continue, then resumes.">
  <title>PFC pauses one lane, not the whole road</title>
  <rect x="0.5" y="0.5" width="579" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">PFC PAUSES ONE LANE, NOT THE WHOLE ROAD</text>
  <g transform="translate(0,30)">
    <g><rect x="26" y="95" width="90" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="71" y="121.15" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Upstream</text><text x="71" y="135.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">switch</text></g>
    <rect x="392" y="48" width="172" height="160" rx="6" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="478" y="66" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Switch</text>
    <text x="250" y="84" fill="#d97706" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">RDMA class</text>
    <path d="M116,100 H392" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="250" y="176" fill="#0891b2" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">other classes</text>
    <path d="M116,160 H392" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="500" y="90" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">RDMA queue</text>
    <rect x="430" y="100" width="40" height="96" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="474" y1="120" x2="500" y2="120" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <text x="506" y="123" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">XOFF</text>
    <line x1="474" y1="180" x2="500" y2="180" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <text x="506" y="183" fill="#16a34a" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">XON</text>
    <g transform="translate(432,194)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.1;1 0.1;1 1;1 1;1 0.1;1 0.1" keyTimes="0;0.0333;0.2667;0.4444;0.4889;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-92" width="36" height="92" rx="3" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-280 0;-280 0" keyTimes="0;0.2667;0.4222;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2667;0.2833;0.4056;0.4222;1" dur="9s" repeatCount="indefinite"/><g><rect x="360" y="90" width="56" height="20" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="388" y="103" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">PAUSE</text></g></g>
    <text x="230" y="128" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.4333;0.6889;0.7222;1" dur="9s" repeatCount="indefinite"/>pause RDMA only</text>
  </g>
  <text x="290" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">The RDMA queue fills to its XOFF line, so the switch sends a PAUSE frame upstream for that class only.</tspan><tspan x="290" dy="14">RDMA stops; the other classes keep flowing. When the queue drains to XON, traffic resumes.</tspan></text>
</svg>
