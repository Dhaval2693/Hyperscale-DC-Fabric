<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 370" width="725" height="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Two panels of counter bars. Left (healthy) has low ECN and pause bars and empty drop bars. Right (storm) has pause and retransmit bars filling to the top.">
  <title>The same counters tell a healthy story or a storm</title>
  <rect x="0.5" y="0.5" width="579" height="369" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE SAME COUNTERS TELL A HEALTHY STORY OR A STORM</text>
  <g transform="translate(0,30)">
    <text x="150" y="40" fill="#16a34a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">HEALTHY</text>
    <g transform="translate(70,240)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0444;0.1556;0.9444;0.9889;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-60" width="34" height="60" rx="3" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/></g></g>
    <text x="87" y="256" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">ECN</text>
    <g transform="translate(125,240)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0778;0.1889;0.9444;0.9889;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-40" width="34" height="40" rx="3" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/></g></g>
    <text x="142" y="256" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">pause</text>
    <g transform="translate(180,240)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.1111;0.2222;0.9444;0.9889;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-8" width="34" height="8" rx="3" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/></g></g>
    <text x="197" y="256" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">retx</text>
    <rect x="235" y="236" width="34" height="4" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="252" y="256" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">drops</text>
    <line x1="55" y1="240" x2="250" y2="240" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text x="430" y="40" fill="#dc2626" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">PFC STORM</text>
    <g transform="translate(350,240)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0444;0.1778;0.9444;0.9889;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-70" width="34" height="70" rx="3" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/></g></g>
    <text x="367" y="256" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">ECN</text>
    <g transform="translate(405,240)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0778;0.2111;0.9444;0.9889;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-150" width="34" height="150" rx="3" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/></g></g>
    <text x="422" y="256" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">pause</text>
    <g transform="translate(460,240)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.1111;0.2444;0.9444;0.9889;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-120" width="34" height="120" rx="3" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/></g></g>
    <text x="477" y="256" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">retx</text>
    <g transform="translate(515,240)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.1444;0.2778;0.9444;0.9889;1" dur="9s" repeatCount="indefinite"/><rect x="0" y="-60" width="34" height="60" rx="3" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/></g></g>
    <text x="532" y="256" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">drops</text>
    <line x1="335" y1="240" x2="530" y2="240" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text x="432" y="266" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">pauses pinned, retx and drops climbing</text>
  </g>
  <text x="290" y="338" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">Healthy: a few ECN marks, short bursty pauses, zero drops. A PFC storm: pause counters pinned high and</tspan><tspan x="290" dy="14">still climbing, retransmits rising, drops appearing. Learn the shape, not just the number.</tspan></text>
</svg>
