<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="700" height="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Eight per-rank time bars of similar length except one much longer bar, with a dashed line marking how long the others wait for it.">
  <title>One slow rank shows up as a longer bar</title>
  <rect x="0.5" y="0.5" width="559" height="359" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">ONE SLOW RANK SHOWS UP AS A LONGER BAR</text>
  <g transform="translate(0,30)">
    <g transform="translate(90,220)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.05;0.2;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-52" width="40" height="52" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="110" y="236" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">r0</text>
    <g transform="translate(144,220)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.05;0.2125;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-50" width="40" height="50" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="164" y="236" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">r1</text>
    <g transform="translate(198,220)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.05;0.225;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-54" width="40" height="54" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="218" y="236" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">r2</text>
    <g transform="translate(252,220)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.05;0.2375;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-51" width="40" height="51" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="272" y="236" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">r3</text>
    <g transform="translate(306,220)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.05;0.25;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-120" width="40" height="120" rx="3" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/></g></g>
    <text x="326" y="236" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">r4</text>
    <g transform="translate(360,220)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.05;0.2625;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-49" width="40" height="49" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="380" y="236" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">r5</text>
    <g transform="translate(414,220)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.05;0.275;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-53" width="40" height="53" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="434" y="236" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">r6</text>
    <g transform="translate(468,220)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.05;0.2875;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-50" width="40" height="50" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="488" y="236" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">r7</text>
    <line x1="75" y1="220" x2="540" y2="220" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text x="44" y="120" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">time</text>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.275;0.3;1" dur="8s" repeatCount="indefinite"/><line x1="90" y1="100" x2="540" y2="100" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/><text x="300" y="92" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">everyone waits for r4</text></g>
  </g>
  <text x="280" y="328" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">In a synchronous collective every rank waits for the slowest. Plot per-rank time and the straggler</tspan><tspan x="280" dy="14">is the long bar; the gap between it and the rest is pure idle time on expensive GPUs.</tspan></text>
</svg>
