<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="725" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A rising curve of RC queue pairs climbing steeply with node count, next to a flat low line for a datagram transport.">
  <title>RC connections explode; a datagram transport stays flat</title>
  <rect x="0.5" y="0.5" width="579" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">RC CONNECTIONS EXPLODE; A DATAGRAM TRANSPORT STAYS FLAT</text>
  <g transform="translate(0,30)">
    <line x1="70" y1="210" x2="540" y2="210" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="70" y1="210" x2="70" y2="30" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="305" y="236" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">nodes in the cluster</text>
    <text x="24" y="120" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">QP state</text>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0375;0.0625;1" dur="8s" repeatCount="indefinite"/><circle cx="110" cy="196" r="4" fill="#dc2626"/></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.125;1" dur="8s" repeatCount="indefinite"/><circle cx="170" cy="184" r="4" fill="#dc2626"/><line x1="110" y1="196" x2="170" y2="184" fill="none" stroke="#dc2626" stroke-width="2"/></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1625;0.1875;1" dur="8s" repeatCount="indefinite"/><circle cx="230" cy="162" r="4" fill="#dc2626"/><line x1="170" y1="184" x2="230" y2="162" fill="none" stroke="#dc2626" stroke-width="2"/></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.225;0.25;1" dur="8s" repeatCount="indefinite"/><circle cx="290" cy="130" r="4" fill="#dc2626"/><line x1="230" y1="162" x2="290" y2="130" fill="none" stroke="#dc2626" stroke-width="2"/></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2875;0.3125;1" dur="8s" repeatCount="indefinite"/><circle cx="350" cy="88" r="4" fill="#dc2626"/><line x1="290" y1="130" x2="350" y2="88" fill="none" stroke="#dc2626" stroke-width="2"/></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.375;1" dur="8s" repeatCount="indefinite"/><circle cx="410" cy="50" r="4" fill="#dc2626"/><line x1="350" y1="88" x2="410" y2="50" fill="none" stroke="#dc2626" stroke-width="2"/></g>
    <text x="430" y="46" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">RC: ~N^2 QPs</text>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.475;1" dur="8s" repeatCount="indefinite"/><line x1="110" y1="198" x2="470" y2="192" fill="none" stroke="#16a34a" stroke-width="2"/><text x="478" y="190" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">datagram: flat</text></g>
    <text x="305" y="20" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">one QP per peer vs one endpoint for all peers</text>
  </g>
  <text x="290" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">Reliable Connected keeps one queue pair per peer, so state grows with the square of the cluster and</tspan><tspan x="290" dy="14">overflows the NIC cache. A connectionless-style datagram transport keeps a small, flat footprint.</tspan></text>
</svg>
