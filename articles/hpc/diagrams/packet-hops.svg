<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 230" font-family="monospace">
  <text x="240" y="16" fill="#64748b" font-size="11" text-anchor="middle">What changes at each hop (RoCEv2 across an L3 fabric)</text>
  <rect x="20" y="40" width="80" height="40" rx="6" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="60" y="56" fill="#334155" font-size="10.5" text-anchor="middle">GPU A</text>
  <text x="60" y="70" fill="#64748b" font-size="9" text-anchor="middle">NIC</text>
  <rect x="140" y="40" width="80" height="40" rx="6" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="180" y="56" fill="#334155" font-size="10.5" text-anchor="middle">Router</text>
  <text x="180" y="70" fill="#64748b" font-size="9" text-anchor="middle">(L3)</text>
  <rect x="260" y="40" width="80" height="40" rx="6" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="300" y="56" fill="#334155" font-size="10.5" text-anchor="middle">Router</text>
  <text x="300" y="70" fill="#64748b" font-size="9" text-anchor="middle">(L3)</text>
  <rect x="380" y="40" width="80" height="40" rx="6" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="420" y="56" fill="#334155" font-size="10.5" text-anchor="middle">GPU B</text>
  <text x="420" y="70" fill="#64748b" font-size="9" text-anchor="middle">NIC</text>
  <path d="M100,60 L140,60" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M220,60 L260,60" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M340,60 L380,60" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <text x="20" y="112" fill="#334155" font-size="10">src/dst MAC</text>
  <text x="20" y="134" fill="#334155" font-size="10">TTL</text>
  <text x="20" y="156" fill="#334155" font-size="10">src/dst IP</text>
  <text x="20" y="178" fill="#334155" font-size="10">BTH (RDMA)</text>
  <text x="150" y="112" fill="#dc2626" font-size="10" text-anchor="middle">A&#8594;R1</text>
  <text x="150" y="134" fill="#dc2626" font-size="10" text-anchor="middle">64</text>
  <text x="150" y="156" fill="#0891b2" font-size="10" text-anchor="middle">A&#8594;B</text>
  <text x="150" y="178" fill="#7c3aed" font-size="10" text-anchor="middle">unchanged</text>
  <text x="262" y="112" fill="#dc2626" font-size="10" text-anchor="middle">R1&#8594;R2</text>
  <text x="262" y="134" fill="#dc2626" font-size="10" text-anchor="middle">63</text>
  <text x="262" y="156" fill="#0891b2" font-size="10" text-anchor="middle">A&#8594;B</text>
  <text x="262" y="178" fill="#7c3aed" font-size="10" text-anchor="middle">unchanged</text>
  <text x="374" y="112" fill="#dc2626" font-size="10" text-anchor="middle">R2&#8594;B</text>
  <text x="374" y="134" fill="#dc2626" font-size="10" text-anchor="middle">62</text>
  <text x="374" y="156" fill="#0891b2" font-size="10" text-anchor="middle">A&#8594;B</text>
  <text x="374" y="178" fill="#7c3aed" font-size="10" text-anchor="middle">unchanged</text>
  <text x="455" y="112" fill="#dc2626" font-size="9" text-anchor="middle">rewritten</text>
  <text x="455" y="134" fill="#dc2626" font-size="9" text-anchor="middle">decrements</text>
  <text x="455" y="156" fill="#0891b2" font-size="9" text-anchor="middle">end-to-end</text>
  <text x="455" y="178" fill="#7c3aed" font-size="9" text-anchor="middle">endpoints only</text>
  
  <text x="240" y="206" fill="#64748b" font-size="10.5" font-family="sans-serif" text-anchor="middle">
  <tspan x="240" dy="0">MAC addresses are local and rewritten at every L3 hop; TTL decrements. The IP addresses are</tspan>
  <tspan x="240" dy="14">the end-to-end identity and never change. The RDMA transport header is read only by the two NICs.</tspan>
  </text>
</svg>
