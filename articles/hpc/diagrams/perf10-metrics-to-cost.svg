<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 304" width="750" height="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Four boxes left to right connected by arrows: step time, throughput, MFU and scaling efficiency, then cost per result, each lighting up in sequence.">
  <title>From step time to the bill</title>
  <defs><marker id="perf10-metrics-to-cost-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="perf10-metrics-to-cost-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="perf10-metrics-to-cost-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="303" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">FROM STEP TIME TO THE BILL</text>
  <g transform="translate(0,30)">
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.075;1" dur="8s" repeatCount="indefinite"/><g><rect x="40" y="80" width="110" height="50" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="95" y="102.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">step time</text><text x="95" y="113.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">ms per iteration</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.125;0.15;1" dur="8s" repeatCount="indefinite"/><path d="M150 105 H190" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#perf10-metrics-to-cost-ah-warn)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.275;1" dur="8s" repeatCount="indefinite"/><g><rect x="190" y="80" width="110" height="50" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="245" y="102.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">throughput</text><text x="245" y="113.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">tokens / samples per s</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.325;0.35;1" dur="8s" repeatCount="indefinite"/><path d="M300 105 H340" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#perf10-metrics-to-cost-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.475;1" dur="8s" repeatCount="indefinite"/><g><rect x="350" y="80" width="110" height="50" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="405" y="102.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">MFU + scaling</text><text x="405" y="113.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">useful FLOPs / peak</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.525;0.55;1" dur="8s" repeatCount="indefinite"/><path d="M460 105 H500" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#perf10-metrics-to-cost-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.675;1" dur="8s" repeatCount="indefinite"/><g><rect x="510" y="80" width="110" height="50" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="565" y="102.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">cost / result</text><text x="565" y="113.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">GPU-hours you pay</text></g></g>
    <text x="300" y="40" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">lower the left number and the right number follows</text>
    <text x="300" y="175" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">goodput = throughput that actually counts toward finishing the job</text>
  </g>
  <text x="300" y="258" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">The metrics a performance team watches form a chain. Shorter step time raises throughput; higher</tspan><tspan x="300" dy="14">throughput at a given GPU count raises MFU and scaling efficiency; and that is what lowers the cost of</tspan><tspan x="300" dy="14">each useful result.</tspan></text>
</svg>
