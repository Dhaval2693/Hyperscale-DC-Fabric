<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 344" width="750" height="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A curve of transfer time against message size: flat on the left where latency dominates, then rising linearly on the right where bandwidth dominates.">
  <title>Small messages pay latency; big ones pay bandwidth</title>
  <defs><marker id="perf10-latency-bandwidth-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="343" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">SMALL MESSAGES PAY LATENCY; BIG ONES PAY BANDWIDTH</text>
  <g transform="translate(0,30)">
    <line x1="70" y1="200" x2="560" y2="200" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#perf10-latency-bandwidth-ah-muted)"/>
    <line x1="70" y1="200" x2="70" y2="40" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#perf10-latency-bandwidth-ah-muted)"/>
    <text x="315" y="228" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">message size -&gt;</text>
    <text x="30" y="120" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">time</text>
    <path d="M70 160 L250 160 L540 60" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <line x1="70" y1="160" x2="250" y2="160" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="70" y="150" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">alpha (fixed latency)</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0571;0.0857;0.5143;0.5429;1" dur="7s" repeatCount="indefinite"/><g><rect x="95" y="120" width="130" height="30" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="160" y="138" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">latency-bound</text></g><text x="160" y="180" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">small msgs</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5429;0.5714;1" dur="7s" repeatCount="indefinite"/><g><rect x="400" y="90" width="140" height="30" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="470" y="108" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">bandwidth-bound</text></g><text x="430" y="180" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">big msgs</text></g>
    <text x="315" y="30" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">T = alpha + size / bandwidth</text>
  </g>
  <text x="300" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Time to move a message is a fixed startup cost (alpha) plus size divided by bandwidth (beta per byte).</tspan><tspan x="300" dy="14">Tiny messages sit on the flat alpha floor and are latency-bound; large messages ride the sloped part and</tspan><tspan x="300" dy="14">are bandwidth-bound.</tspan></text>
</svg>
