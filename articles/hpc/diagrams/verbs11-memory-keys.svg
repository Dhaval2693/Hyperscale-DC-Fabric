<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="725" height="375" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A buffer being registered on the left host, producing an lkey and an rkey; the rkey is handed to the right host, whose NIC then uses it to reach the buffer.">
  <title>Register memory once, hand out a key to that buffer</title>
  <defs><marker id="verbs11-memory-keys-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="verbs11-memory-keys-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="verbs11-memory-keys-ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect x="0.5" y="0.5" width="579" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">REGISTER MEMORY ONCE, HAND OUT A KEY TO THAT BUFFER</text>
  <g transform="translate(0,30)">
    <text x="14" y="26" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">LOCAL HOST</text>
    <g><rect x="40" y="44" width="110" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="95" y="63.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">buffer</text><text x="95" y="75.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">in RAM/GPU</text></g>
    <g><rect x="40" y="110" width="110" height="40" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="95" y="127.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">register</text><text x="95" y="138.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">pin + protect</text></g>
    <line x1="95" y1="88" x2="95" y2="110" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#verbs11-memory-keys-ah-link)"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.175;1" dur="8s" repeatCount="indefinite"/><g><rect x="190" y="44" width="70" height="40" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="225" y="67.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">lkey</text></g><g><rect x="190" y="100" width="70" height="40" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="225" y="123.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">rkey</text></g></g>
    <line x1="150" y1="64" x2="190" y2="64" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#verbs11-memory-keys-ah-ok)"/>
    <line x1="150" y1="128" x2="190" y2="120" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#verbs11-memory-keys-ah-hot)"/>
    <text x="225" y="160" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">lkey stays home</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;210 0;210 0" keyTimes="0;0.25;0.525;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.2687;0.5062;0.525;1" dur="8s" repeatCount="indefinite"/><g><rect x="262" y="100" width="70" height="40" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="297" y="123.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">rkey</text></g></g>
    <text x="370" y="92" fill="#dc2626" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">rkey sent to peer</text>
    <text x="566" y="26" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">REMOTE HOST</text>
    <g><rect x="470" y="44" width="95" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="517.5" y="69.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">peer NIC</text></g>
    <g><rect x="470" y="110" width="95" height="40" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="517.5" y="133" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">has rkey</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.575;0.6;1" dur="8s" repeatCount="indefinite"/><path d="M470 66 C 300 66, 230 66, 155 66" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#verbs11-memory-keys-ah-hot)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path><text x="330" y="40" fill="#dc2626" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">reaches only that buffer</text></g>
  </g>
  <text x="290" y="268" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">Registration pins a buffer and returns two keys: a local lkey for your own NIC, and an rkey you pass</tspan><tspan x="290" dy="14">to the peer so its NIC may read or write just that buffer, nothing else.</tspan></text>
</svg>
