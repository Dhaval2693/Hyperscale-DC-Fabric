<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="700" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Arithmetic shows 70 billion parameters at two bytes each is 140 GB; it is split across four 80 GB GPUs connected by NVLink.">
  <title>The model is too big for one GPU, so it is split</title>
  <rect x="0.5" y="0.5" width="559" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE MODEL IS TOO BIG FOR ONE GPU, SO IT IS SPLIT</text>
  <g transform="translate(0,30)">
    <text x="280" y="30" fill="#334155" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">70,000,000,000 params  x  2 bytes  =  140 GB</text>
    <text x="280" y="50" fill="#dc2626" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">one H100 holds 80 GB  -&gt;  140 GB does not fit</text>
    <g><rect x="40" y="90" width="110" height="60" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="95" y="110.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">layers</text><text x="95" y="124.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1-20</text><text x="95" y="136.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">GPU 0</text></g>
    <path d="M150 120 H170" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <g><rect x="170" y="90" width="110" height="60" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="225" y="110.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">layers</text><text x="225" y="124.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">21-40</text><text x="225" y="136.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">GPU 1</text></g>
    <path d="M280 120 H300" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <g><rect x="300" y="90" width="110" height="60" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="355" y="110.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">layers</text><text x="355" y="124.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">41-60</text><text x="355" y="136.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">GPU 2</text></g>
    <path d="M410 120 H430" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <g><rect x="430" y="90" width="110" height="60" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="485" y="110.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">layers</text><text x="485" y="124.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">61-80</text><text x="485" y="136.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">GPU 3</text></g>
    <text x="280" y="182" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">NVLink carries a value from one GPU to the next in microseconds</text>
    <text x="280" y="210" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">frontier chatbot models are far larger, so they span many more GPUs</text>
  </g>
  <text x="280" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">140 GB of weights do not fit in one 80 GB H100, so the model is spread across GPUs joined by a</tspan><tspan x="280" dy="14">fast NVLink interconnect (here, a run of layers per GPU).</tspan></text>
</svg>
