<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 344" width="725" height="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Eight GPU bars filling at the same rate except one that fills much more slowly; the seven fast ones finish and then wait, highlighted, for the slow one.">
  <title>Everyone waits for the slowest GPU</title>
  <rect x="0.5" y="0.5" width="579" height="343" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">EVERYONE WAITS FOR THE SLOWEST GPU</text>
  <g transform="translate(0,30)">
    <text x="14" y="28" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">8 GPUs in one collective</text>
    <text x="84" y="60" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">G0</text>
    <rect x="60" y="66" width="48" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(64,182)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.275;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-112" width="40" height="112" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.325;1" dur="8s" repeatCount="indefinite"/><text x="84" y="205" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">idle</text></g>
    <text x="148" y="60" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">G1</text>
    <rect x="124" y="66" width="48" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(128,182)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.25;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-112" width="40" height="112" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.275;0.3;1" dur="8s" repeatCount="indefinite"/><text x="148" y="205" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">idle</text></g>
    <text x="212" y="60" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">G2</text>
    <rect x="188" y="66" width="48" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(192,182)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.2875;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-112" width="40" height="112" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3125;0.3375;1" dur="8s" repeatCount="indefinite"/><text x="212" y="205" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">idle</text></g>
    <text x="276" y="60" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">G3</text>
    <rect x="252" y="66" width="48" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(256,182)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.2625;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-112" width="40" height="112" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2875;0.3125;1" dur="8s" repeatCount="indefinite"/><text x="276" y="205" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">idle</text></g>
    <text x="340" y="60" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">G4</text>
    <rect x="316" y="66" width="48" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(320,182)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.275;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-112" width="40" height="112" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.325;1" dur="8s" repeatCount="indefinite"/><text x="340" y="205" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">idle</text></g>
    <text x="404" y="60" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">G5</text>
    <rect x="380" y="66" width="48" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(384,182)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.25;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-112" width="40" height="112" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.275;0.3;1" dur="8s" repeatCount="indefinite"/><text x="404" y="205" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">idle</text></g>
    <text x="468" y="60" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">G6</text>
    <rect x="444" y="66" width="48" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(448,182)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.2875;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-112" width="40" height="112" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3125;0.3375;1" dur="8s" repeatCount="indefinite"/><text x="468" y="205" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">idle</text></g>
    <text x="532" y="60" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">G7</text>
    <rect x="508" y="66" width="48" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(512,182)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.775;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-112" width="40" height="112" rx="3" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.325;0.35;1" dur="8s" repeatCount="indefinite"/><text x="300" y="230" fill="#dc2626" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">one slow link keeps the other seven idle until it is done</text></g>
  </g>
  <text x="290" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">A collective is a barrier: no GPU proceeds until all have exchanged their data. Seven finish on time</tspan><tspan x="290" dy="14">and sit idle while one slow link drags; the straggler's tail latency sets the step time for the whole</tspan><tspan x="290" dy="14">job.</tspan></text>
</svg>
