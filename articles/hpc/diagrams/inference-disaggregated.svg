<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="750" height="375" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A prompt enters a prefill pool, which sends a KV-cache block over an RDMA link to a decode pool, which streams answer tokens back to the user.">
  <title>Prefill here, decode there, KV cache over RDMA between</title>
  <rect x="0.5" y="0.5" width="599" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">PREFILL HERE, DECODE THERE, KV CACHE OVER RDMA BETWEEN</text>
  <g transform="translate(0,30)">
    <g><rect x="30" y="90" width="70" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="65" y="113" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">user</text></g>
    <g><rect x="150" y="80" width="110" height="60" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="205" y="106.15" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">prefill</text><text x="205" y="120.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pool</text></g>
    <g><rect x="400" y="80" width="110" height="60" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="106.15" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">decode</text><text x="455" y="120.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pool</text></g>
    <g><rect x="540" y="90" width="50" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="565" y="113" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">user</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;45 0;45 0" keyTimes="0;0.0333;0.1556;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0333;0.05;0.1389;0.1556;1" dur="9s" repeatCount="indefinite"/><g><rect x="102" y="98" width="44" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="124" y="112.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">prompt</text></g></g>
    <path d="M260 110 H400" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="330" y="72" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">KV cache over RDMA</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;130 0;130 0" keyTimes="0;0.2222;0.4222;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2222;0.2389;0.4056;0.4222;1" dur="9s" repeatCount="indefinite"/><g><rect x="266" y="98" width="40" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="286" y="112.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">KV</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;28 0;28 0" keyTimes="0;0.4889;0.6444;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4889;0.5056;0.6278;0.6444;1" dur="9s" repeatCount="indefinite"/><g><rect x="512" y="98" width="26" height="24" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="525" y="112.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;28 0;28 0" keyTimes="0;0.6222;0.7778;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6222;0.6389;0.7611;0.7778;1" dur="9s" repeatCount="indefinite"/><g><rect x="512" y="98" width="26" height="24" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="525" y="112.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;28 0;28 0" keyTimes="0;0.7556;0.9111;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7556;0.7722;0.8944;0.9111;1" dur="9s" repeatCount="indefinite"/><g><rect x="512" y="98" width="26" height="24" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="525" y="112.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <text x="300" y="180" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">prefill is compute-bound, decode is memory-bound — so give each its own pool</text>
  </g>
  <text x="300" y="268" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Prefill and decode run on separate GPU pools. The KV cache travels between them over the network by RDMA</tspan><tspan x="300" dy="14">— the series comes full circle.</tspan></text>
</svg>
