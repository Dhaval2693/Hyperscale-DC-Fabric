<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 394" width="700" height="492" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A curve of time against message size: flat on the left (latency floor), bending upward at a knee, then rising linearly on the right (bandwidth limited).">
  <title>Small messages pay latency; big ones pay bandwidth</title>
  <defs><marker id="meas13-latency-bandwidth-sweep-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="393" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">SMALL MESSAGES PAY LATENCY; BIG ONES PAY BANDWIDTH</text>
  <g transform="translate(0,30)">
    <line x1="90" y1="240" x2="520" y2="240" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#meas13-latency-bandwidth-sweep-ah-ink)"/>
    <line x1="90" y1="240" x2="90" y2="60" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#meas13-latency-bandwidth-sweep-ah-ink)"/>
    <text x="305" y="272" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">message size  (log scale)</text>
    <text x="44" y="150" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">time per</text>
    <text x="44" y="164" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">message</text>
    <path d="M90 200 L300 196" fill="none" stroke="#0891b2" stroke-width="2.5"/>
    <path d="M300 196 L500 90" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2778;0.3;1" dur="9s" repeatCount="indefinite"/><circle cx="300" cy="196" r="5" fill="#d97706"/><text x="300" y="182" fill="#d97706" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">knee</text></g>
    <text x="195" y="214" fill="#0891b2" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">latency-bound</text>
    <text x="430" y="150" fill="#7c3aed" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">bandwidth-bound</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;210 -4;210 -4" keyTimes="0;0.0444;0.3333;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0444;0.0611;0.3167;0.3333;1" dur="9s" repeatCount="indefinite"/><circle cx="90" cy="200" r="4" fill="#dc2626"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;200 -106;200 -106" keyTimes="0;0.3333;0.6667;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.35;0.65;0.6667;1" dur="9s" repeatCount="indefinite"/><circle cx="300" cy="196" r="4" fill="#dc2626"/></g>
  </g>
  <text x="280" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Sweep the message size and plot time per message. Small messages sit on a flat latency floor; past</tspan><tspan x="280" dy="14">the knee, time grows with size as bandwidth takes over. The curve tells you which regime a</tspan><tspan x="280" dy="14">workload lives in.</tspan></text>
</svg>
