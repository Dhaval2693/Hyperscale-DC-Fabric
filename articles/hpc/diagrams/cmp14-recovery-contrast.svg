<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="750" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top row: packets 1-5 with packet 3 dropped, and 4 and 5 thrown away and resent. Bottom row: packet 3 dropped and only packet 3 resent while 4 and 5 are kept.">
  <title>A drop rewinds a RoCEv2 flow; SRD resends just the one packet</title>
  <defs><marker id="cmp14-recovery-contrast-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="cmp14-recovery-contrast-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">A DROP REWINDS A ROCEV2 FLOW; SRD RESENDS JUST THE ONE PACKET</text>
  <g transform="translate(0,30)">
    <text x="14" y="28" fill="#0891b2" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">CLASSIC RoCEv2</text>
    <text x="14" y="42" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">go-back-N</text>
    <g><rect x="150" y="24" width="56" height="30" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="178" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 1</text></g>
    <g><rect x="222" y="24" width="56" height="30" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="250" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 2</text></g>
    <g><rect x="294" y="24" width="56" height="30" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="322" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 3</text></g>
    <g><rect x="366" y="24" width="56" height="30" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="394" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 4</text></g>
    <g><rect x="438" y="24" width="56" height="30" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="466" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 5</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1111;0.1333;1" dur="9s" repeatCount="indefinite"/><text x="294" y="70" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">3 lost -&gt; resend 3, 4, 5</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 0;0 0" keyTimes="0;0.2222;0.3333;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2222;0.2389;0.3167;0.3333;1" dur="9s" repeatCount="indefinite"/><path d="M322 86 V62" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-recovery-contrast-ah-warn)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 0;0 0" keyTimes="0;0.2667;0.3778;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2667;0.2833;0.3611;0.3778;1" dur="9s" repeatCount="indefinite"/><path d="M394 86 V62" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-recovery-contrast-ah-warn)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 0;0 0" keyTimes="0;0.3111;0.4222;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3111;0.3278;0.4056;0.4222;1" dur="9s" repeatCount="indefinite"/><path d="M466 86 V62" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-recovery-contrast-ah-warn)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <text x="14" y="150" fill="#7c3aed" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">EFA / SRD</text>
    <text x="14" y="164" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">selective resend</text>
    <g><rect x="150" y="146" width="56" height="30" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="178" y="164" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 1</text></g>
    <g><rect x="222" y="146" width="56" height="30" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="250" y="164" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 2</text></g>
    <g><rect x="294" y="146" width="56" height="30" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="322" y="164" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 3</text></g>
    <g><rect x="366" y="146" width="56" height="30" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="394" y="164" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 4</text></g>
    <g><rect x="438" y="146" width="56" height="30" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="466" y="164" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pkt 5</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1111;0.1333;1" dur="9s" repeatCount="indefinite"/><text x="294" y="196" fill="#7c3aed" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">only 3 lost -&gt; resend 3; keep 4, 5</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 0;0 0" keyTimes="0;0.2222;0.3556;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2222;0.2389;0.3389;0.3556;1" dur="9s" repeatCount="indefinite"/><path d="M322 210 V184" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-recovery-contrast-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <text x="300" y="236" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">fewer bytes resent means less time with the GPUs waiting</text>
  </g>
  <text x="300" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Classic RoCEv2 recovers with go-back-N: a lost packet makes the sender rewind and resend everything after</tspan><tspan x="300" dy="14">it. SRD tracks each packet and resends only the one that was lost.</tspan></text>
</svg>
