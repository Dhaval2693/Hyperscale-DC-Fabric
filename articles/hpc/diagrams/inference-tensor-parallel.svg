<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="700" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Eight GPUs in a ring around a central NVLink switch, exchanging partial results with an all-reduce on each layer.">
  <title>Split across 8 GPUs, synced over NVLink every layer</title>
  <rect x="0.5" y="0.5" width="559" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">SPLIT ACROSS 8 GPUS, SYNCED OVER NVLINK EVERY LAYER</text>
  <g transform="translate(0,30)">
