    <line x1="258.79" y1="90.79" x2="210.84" y2="78.06" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.175;0.4375;0.4625;1" dur="8s" repeatCount="indefinite"/><path d="M211 78 L256 88" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.525;0.55;0.9375;0.9625;1" dur="8s" repeatCount="indefinite"/><text x="280" y="222" fill="#dc2626" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">all-reduce: every layer, every token</text></g>
  </g>
  <text x="280" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">When the model is sharded across the GPUs in a server, every layer of every token needs an all-</tspan><tspan x="280" dy="14">reduce between them — so the fast scale-up link (NVLink) matters.</tspan></text>
</svg>
