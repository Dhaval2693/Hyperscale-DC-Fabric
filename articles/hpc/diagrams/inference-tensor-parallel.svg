    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.125;0.4375;0.4625;1" dur="8s" repeatCount="indefinite"/><path d="M349 146 L304 136" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><rect x="254" y="160" width="52" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="177" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G4</text></g>
