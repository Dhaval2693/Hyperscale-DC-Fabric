    <g><rect x="337.3" y="54.16" width="52" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="363.3" y="71.16" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G1</text></g>
    <line x1="301.21" y1="90.79" x2="349.16" y2="78.06" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.1;0.4375;0.4625;1" dur="8s" repeatCount="indefinite"/><path d="M349 78 L304 88" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
