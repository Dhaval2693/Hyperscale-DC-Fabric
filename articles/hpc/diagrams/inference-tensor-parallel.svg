    <g><rect x="254" y="36" width="52" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="53" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G0</text></g>
    <line x1="280" y1="82" x2="280" y2="64" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
