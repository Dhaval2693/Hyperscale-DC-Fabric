    <g><rect x="170.7" y="141.84" width="52" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="196.7" y="158.84" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G5</text></g>
    <line x1="258.79" y1="133.21" x2="210.84" y2="145.94" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.15;0.4375;0.4625;1" dur="8s" repeatCount="indefinite"/><path d="M211 146 L256 136" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><rect x="136.2" y="98" width="52" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="162.2" y="115" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G6</text></g>
