<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="700" height="375" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Two training steps. During compute the network trace is flat near zero; during the all-reduce burst it spikes to full, then drops back.">
  <title>The training step heartbeat</title>
  <defs><marker id="traffic-heartbeat-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE TRAINING STEP HEARTBEAT</text>
  <g transform="translate(0,30)">
    <text x="280" y="16" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">two training steps, side by side</text>
    <text x="16" y="48" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">GPUs</text>
    <text x="16" y="150" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">link use</text>
    <g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.375;0.3875;1" dur="8s" repeatCount="indefinite"/><g><rect x="90" y="34" width="160" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="170" y="44.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">compute</text><text x="170" y="57.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">(forward + backward)</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.3875;0.5;0.5125;1" dur="8s" repeatCount="indefinite"/><g><rect x="254" y="34" width="42" height="28" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="275" y="51" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sync</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5125;0.875;0.8875;1" dur="8s" repeatCount="indefinite"/><g><rect x="320" y="34" width="160" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="400" y="44.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">compute</text><text x="400" y="57.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">(forward + backward)</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.875;0.8875;1" dur="8s" repeatCount="indefinite"/><g><rect x="484" y="34" width="42" height="28" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="505" y="51" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sync</text></g></g>
    <line x1="84" y1="78" x2="540" y2="78" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#traffic-heartbeat-ah-link)"/>
    <text x="540" y="92" fill="#94a3b8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">time</text>
    <line x1="84" y1="180" x2="540" y2="180" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="80" y="112" fill="#94a3b8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">full</text>
    <text x="80" y="182" fill="#94a3b8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">idle</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.3875;0.5;0.5125;1" dur="8s" repeatCount="indefinite"/><rect x="254" y="112" width="42" height="68" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="275" y="150" fill="#dc2626" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">100%</text></g>
    <g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.375;0.3875;1" dur="8s" repeatCount="indefinite"/><rect x="90" y="172" width="160" height="8" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.875;0.8875;1" dur="8s" repeatCount="indefinite"/><rect x="484" y="112" width="42" height="68" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="505" y="150" fill="#dc2626" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">100%</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5125;0.875;0.8875;1" dur="8s" repeatCount="indefinite"/><rect x="320" y="172" width="160" height="8" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g>
  </g>
  <text x="280" y="268" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Each step the GPUs compute in silence, then all burst onto the network at once to sync gradients.</tspan><tspan x="280" dy="14">The network trace below is idle, then saturated, then idle again.</tspan></text>
</svg>
