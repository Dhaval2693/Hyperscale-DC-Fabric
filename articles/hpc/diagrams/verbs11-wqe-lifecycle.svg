<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="750" height="425" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A work request moving left to right: app to send queue as a WQE, a doorbell to the NIC, the NIC onto the wire, and a CQE returning to the completion queue the app polls.">
  <title>The life of one RDMA WRITE: work request to completion</title>
  <defs><marker id="verbs11-wqe-lifecycle-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="verbs11-wqe-lifecycle-ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="339" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE LIFE OF ONE RDMA WRITE: WORK REQUEST TO COMPLETION</text>
  <g transform="translate(0,30)">
    <g><rect x="20" y="110" width="80" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="60" y="135.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">app</text></g>
    <g><rect x="150" y="40" width="120" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="210" y="57.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">send queue</text><text x="210" y="68.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">one QP</text></g>
    <g><rect x="150" y="170" width="120" height="40" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="210" y="186.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">completion</text><text x="210" y="199.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">queue</text></g>
    <g><rect x="330" y="100" width="90" height="60" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="375" y="133.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">NIC</text></g>
    <g><rect x="470" y="100" width="110" height="60" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="525" y="127.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">the wire</text><text x="525" y="138.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">to peer</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;60 -62;60 -62" keyTimes="0;0.0333;0.1778;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0333;0.05;0.1611;0.1778;1" dur="9s" repeatCount="indefinite"/><g><rect x="100" y="120" width="44" height="24" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="122" y="134.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">WQE</text></g></g>
    <text x="135" y="30" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">1. post WQE</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.2222;0.3556;0.3778;1" dur="9s" repeatCount="indefinite"/><path d="M270 60 H330" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#verbs11-wqe-lifecycle-ah-hot)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path><text x="300" y="50" fill="#dc2626" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">2. doorbell</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;70 0;70 0" keyTimes="0;0.3333;0.5111;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.35;0.4944;0.5111;1" dur="9s" repeatCount="indefinite"/><g><rect x="400" y="118" width="44" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="422" y="132.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">data</text></g></g>
    <text x="455" y="92" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">3. on the wire</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5556;0.5778;0.7333;0.7556;1" dur="9s" repeatCount="indefinite"/><path d="M375 160 C 375 230, 300 230, 270 200" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#verbs11-wqe-lifecycle-ah-ok)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path><text x="330" y="244" fill="#16a34a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">4. CQE posted</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7556;0.7778;1" dur="9s" repeatCount="indefinite"/><path d="M150 190 H100 V158" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#verbs11-wqe-lifecycle-ah-ok)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path><text x="118" y="232" fill="#16a34a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">5. poll</text></g>
  </g>
  <text x="300" y="308" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">The app posts a work request, which becomes a WQE on the send queue. A doorbell tells the NIC, the NIC</tspan><tspan x="300" dy="14">puts it on the wire, and a CQE on the completion queue is how the app learns it finished.</tspan></text>
</svg>
