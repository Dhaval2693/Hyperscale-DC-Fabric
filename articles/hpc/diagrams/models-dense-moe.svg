<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="700" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Left: a dense model where a token passes through one solid block of weights. Right: an MoE model where a router sends the token to two of eight expert blocks, which light up while the others stay dim.">
  <title>Dense versus Mixture-of-Experts</title>
  <defs><marker id="models-dense-moe-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="models-dense-moe-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">DENSE VERSUS MIXTURE-OF-EXPERTS</text>
  <g transform="translate(0,30)">
    <line x1="280" y1="36" x2="280" y2="230" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="140" y="30" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Dense model</text>
    <text x="420" y="30" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Mixture-of-Experts</text>
    <g><rect x="40" y="110" width="44" height="32" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="62" y="129" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g>
    <g><rect x="120" y="70" width="120" height="110" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="180" y="116.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">All weights</text><text x="180" y="128.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">every param</text><text x="180" y="140" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">runs</text></g>
    <line x1="84" y1="126" x2="118" y2="126" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#models-dense-moe-ah-link)"/>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;80 0;80 0" keyTimes="0;0.05;0.25;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.0688;0.9812;1" dur="8s" repeatCount="indefinite"/><circle cx="100" cy="126" r="5" fill="#d97706"/></g>
    <text x="180" y="205" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">cost = full size</text>
    <g><rect x="312" y="110" width="40" height="32" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="332" y="129" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g>
    <g><rect x="366" y="104" width="54" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="393" y="129" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Router</text></g>
    <line x1="352" y1="126" x2="364" y2="126" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#models-dense-moe-ah-link)"/>
    <g><rect x="438" y="52" width="48" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="462" y="70" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">E1</text></g>
    <g><animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/><rect x="438" y="94" width="48" height="30" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="462" y="112" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">E2</text></g>
    <line x1="420" y1="126" x2="438" y2="109" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#models-dense-moe-ah-warn)"/>
    <g><rect x="438" y="136" width="48" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="462" y="154" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">E3</text></g>
    <g><rect x="438" y="178" width="48" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="462" y="196" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">E4</text></g>
    <g><rect x="500" y="52" width="48" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="524" y="70" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">E5</text></g>
    <g><animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/><rect x="500" y="94" width="48" height="30" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="524" y="112" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">E6</text></g>
    <line x1="420" y1="126" x2="500" y2="109" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#models-dense-moe-ah-warn)"/>
    <g><rect x="500" y="136" width="48" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="524" y="154" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">E7</text></g>
    <g><rect x="500" y="178" width="48" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="524" y="196" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">E8</text></g>
    <text x="468" y="222" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">cost = 2 of 8</text>
  </g>
  <text x="280" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">A dense model runs every weight for every token. An MoE model's router sends each token to just a</tspan><tspan x="280" dy="14">few experts — here 2 of 8 — so a huge model runs at a small model's cost per token.</tspan></text>
</svg>
