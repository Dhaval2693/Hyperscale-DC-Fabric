<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" font-family="monospace">
  <text x="220" y="18" fill="#64748b" font-size="11" text-anchor="middle">All-reduce flows grow with N&#178;/2</text>
  <line x1="40" y1="140" x2="400" y2="140" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(0,140)">
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 0.12; 1 1; 1 1" keyTimes="0;0.6;1" dur="2.4s"
      begin="0s" repeatCount="indefinite"/>
    <rect x="70" y="-40" width="34" height="40" rx="3"
      fill="#0891b222" stroke="#0891b2"/>
  </g>
</g>
  <text x="87" y="156" fill="#64748b" font-size="11" text-anchor="middle">2 GPU</text>
  <text x="87" y="92" fill="#334155" font-size="12" text-anchor="middle">1</text>
  <g transform="translate(0,140)">
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 0.12; 1 1; 1 1" keyTimes="0;0.6;1" dur="2.4s"
      begin="0.3s" repeatCount="indefinite"/>
    <rect x="180" y="-70" width="34" height="70" rx="3"
      fill="#0891b222" stroke="#0891b2"/>
  </g>
</g>
  <text x="197" y="156" fill="#64748b" font-size="11" text-anchor="middle">4 GPU</text>
  <text x="197" y="62" fill="#334155" font-size="12" text-anchor="middle">6</text>
  <g transform="translate(0,140)">
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 0.12; 1 1; 1 1" keyTimes="0;0.6;1" dur="2.4s"
      begin="0.6s" repeatCount="indefinite"/>
    <rect x="300" y="-100" width="34" height="100" rx="3"
      fill="#dc262622" stroke="#dc2626"/>
  </g>
</g>
  <text x="317" y="156" fill="#64748b" font-size="11" text-anchor="middle">8 GPU</text>
  <text x="317" y="32" fill="#334155" font-size="12" text-anchor="middle">28</text>
  <text x="220.0" y="180" fill="#64748b" font-size="10.5" font-family="sans-serif" text-anchor="middle">
  <tspan x="220.0" dy="0">Flows scale with N²/2: 2 GPUs need 1 exchange, 4 need 6, 8 need 28.</tspan>
  <tspan x="220.0" dy="14">"Just add GPUs" quietly multiplies the network’s job.</tspan>
  </text>
</svg>
