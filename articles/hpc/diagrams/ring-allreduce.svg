<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="700" height="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Four GPUs arranged in a ring. A token travels clockwise around the ring; a label marks lap one as reduce-scatter and lap two as all-gather.">
  <title>Ring all-reduce: two laps around the loop</title>
  <defs><marker id="ring-allreduce-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="379" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">RING ALL-REDUCE: TWO LAPS AROUND THE LOOP</text>
  <g transform="translate(0,30)">
    <g><circle cx="280" cy="64" r="26" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="67.85" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G0</text></g>
    <g><circle cx="366" cy="150" r="26" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="366" y="153.85" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G1</text></g>
    <g><circle cx="280" cy="236" r="26" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="239.85" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G2</text></g>
    <g><circle cx="194" cy="150" r="26" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="194" y="153.85" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G3</text></g>
    <path d="M298,80 A86,86 0 0 1 350,132" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#ring-allreduce-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M350,168 A86,86 0 0 1 298,220" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#ring-allreduce-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M262,220 A86,86 0 0 1 210,168" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#ring-allreduce-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M210,132 A86,86 0 0 1 262,80" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#ring-allreduce-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;86 86;86 86" keyTimes="0;0;0.2;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.1867;0.2;1" dur="9s" repeatCount="indefinite"/><g><rect x="267" y="55" width="26" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="280" y="66.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sum</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-86 86;-86 86" keyTimes="0;0.25;0.45;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.2633;0.4367;0.45;1" dur="9s" repeatCount="indefinite"/><g><rect x="353" y="141" width="26" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="366" y="152.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sum</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-86 -86;-86 -86" keyTimes="0;0.5;0.7;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5133;0.6867;0.7;1" dur="9s" repeatCount="indefinite"/><g><rect x="267" y="227" width="26" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="280" y="238.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sum</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;86 -86;86 -86" keyTimes="0;0.75;0.95;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.7633;0.9367;0.95;1" dur="9s" repeatCount="indefinite"/><g><rect x="181" y="141" width="26" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="194" y="152.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sum</text></g></g>
    <g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5222;1" dur="9s" repeatCount="indefinite"/><text x="280" y="146" fill="#dc2626" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">lap 1</text><text x="280" y="162" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">reduce-scatter</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5222;1" dur="9s" repeatCount="indefinite"/><text x="280" y="146" fill="#16a34a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">lap 2</text><text x="280" y="162" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">all-gather</text></g>
    <text x="280" y="288" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">each GPU sends ~2x the gradient, whatever N is</text>
  </g>
  <text x="280" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Lap 1 (reduce-scatter) adds chunks hop by hop until each GPU owns one finished total. Lap 2 (all-</tspan><tspan x="280" dy="14">gather) copies those totals around until every GPU has them all.</tspan></text>
</svg>
