<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="750" height="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top: a flow stuck on a failed path waiting for routing to reconverge. Bottom: a sprayed flow continuing on its other paths the instant one path fails.">
  <title>A dead path: reconverge the fabric, or just pick another packet by packet</title>
  <rect x="0.5" y="0.5" width="599" height="309" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">A DEAD PATH: RECONVERGE THE FABRIC, OR JUST PICK ANOTHER PACKET BY PACKET</text>
  <g transform="translate(0,30)">
    <text x="14" y="26" fill="#0891b2" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ECMP</text>
    <g><rect x="50" y="54" width="70" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="85" y="72" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">src</text></g>
    <g><rect x="480" y="54" width="70" height="30" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="515" y="72" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">dst</text></g>
    <line x1="180" y1="50" x2="430" y2="50" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M120 69 C180 69 180 50 260 50 H430 C460 50 460 66 480 66" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.125;1" dur="8s" repeatCount="indefinite"/><text x="305" y="42" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">X  path down</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3125;0.3375;1" dur="8s" repeatCount="indefinite"/><text x="300" y="104" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">flow stalls until routing reconverges</text></g>
    <text x="14" y="150" fill="#7c3aed" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">SRD</text>
    <g><rect x="50" y="176" width="70" height="30" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="85" y="194" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">src</text></g>
    <g><rect x="480" y="176" width="70" height="30" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="515" y="194" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">dst</text></g>
    <line x1="170" y1="160" x2="440" y2="160" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="170" y1="184" x2="440" y2="184" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="170" y1="208" x2="440" y2="208" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.125;1" dur="8s" repeatCount="indefinite"/><text x="305" y="150" fill="#dc2626" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">X  one path down</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;300 -31;300 -31" keyTimes="0;0.0375;0.3;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0562;0.2812;0.3;1" dur="8s" repeatCount="indefinite"/><rect x="136" y="184" width="26" height="14" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;300 17;300 17" keyTimes="0;0.0875;0.35;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1062;0.3312;0.35;1" dur="8s" repeatCount="indefinite"/><rect x="136" y="184" width="26" height="14" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/></g>
    <text x="300" y="224" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the next packet just uses a path that still works</text>
  </g>
  <text x="300" y="278" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">When a path fails, ECMP routing must detect it and reconverge before a pinned flow can move. SRD is</tspan><tspan x="300" dy="14">already spreading packets, so the next packet simply avoids the broken path.</tspan></text>
</svg>
