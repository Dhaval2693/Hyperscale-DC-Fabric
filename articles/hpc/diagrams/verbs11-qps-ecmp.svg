<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="750" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Left: a single queue pair sending all traffic down one of four uplinks. Right: four queue pairs each taking a different uplink, evenly loaded.">
  <title>More queue pairs spread one connection over more paths</title>
  <rect x="0.5" y="0.5" width="599" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">MORE QUEUE PAIRS SPREAD ONE CONNECTION OVER MORE PATHS</text>
  <g transform="translate(0,30)">
    <text x="14" y="26" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ONE QP</text>
    <g><rect x="40" y="60" width="70" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="75" y="83.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">QP</text></g>
    <g><rect x="200" y="40" width="60" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="56.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 1</text></g>
    <g><rect x="200" y="80" width="60" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="96.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 2</text></g>
    <g><rect x="200" y="120" width="60" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="136.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 3</text></g>
    <g><rect x="200" y="160" width="60" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="176.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 4</text></g>
    <path d="M110 80 H200" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0625;0.0875;1" dur="8s" repeatCount="indefinite"/><text x="150" y="128" fill="#dc2626" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">one path hammered</text></g>
    <text x="346" y="26" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">FOUR QPs</text>
    <g><rect x="360" y="40" width="56" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="388" y="56.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">QP1</text></g>
    <g><rect x="500" y="40" width="60" height="28" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="530" y="56.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 1</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.075;1" dur="8s" repeatCount="indefinite"/><path d="M416 54 H500" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><rect x="360" y="80" width="56" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="388" y="96.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">QP2</text></g>
    <g><rect x="500" y="80" width="60" height="28" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="530" y="96.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 2</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.125;1" dur="8s" repeatCount="indefinite"/><path d="M416 94 H500" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><rect x="360" y="120" width="56" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="388" y="136.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">QP3</text></g>
    <g><rect x="500" y="120" width="60" height="28" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="530" y="136.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 3</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.175;1" dur="8s" repeatCount="indefinite"/><path d="M416 134 H500" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <g><rect x="360" y="160" width="56" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="388" y="176.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">QP4</text></g>
    <g><rect x="500" y="160" width="60" height="28" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="530" y="176.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 4</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.225;1" dur="8s" repeatCount="indefinite"/><path d="M416 174 H500" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <text x="470" y="226" fill="#16a34a" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">each QP takes its own path</text>
  </g>
  <text x="300" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">One QP means one flow hashing onto a single ECMP path. Several QPs per connection vary the source port,</tspan><tspan x="300" dy="14">so the traffic spreads across the fabric's parallel paths instead of overloading one uplink.</tspan></text>
</svg>
