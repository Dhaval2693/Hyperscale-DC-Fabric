<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="700" height="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Two flows share one upstream link; a pause caused by the congested flow also halts the second, unrelated flow that happens to share the link.">
  <title>How a pause spreads to an innocent flow</title>
  <rect x="0.5" y="0.5" width="559" height="309" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">HOW A PAUSE SPREADS TO AN INNOCENT FLOW</text>
  <g transform="translate(0,30)">
    <g><rect x="20" y="40" width="90" height="44" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="65" y="59.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Flow A</text><text x="65" y="71.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">busy GPU</text></g>
    <g><rect x="20" y="150" width="90" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="65" y="169.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Flow B</text><text x="65" y="181.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">innocent</text></g>
    <g><rect x="220" y="95" width="100" height="48" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="270" y="115.15" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Shared</text><text x="270" y="129.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">link</text></g>
    <g><rect x="430" y="40" width="110" height="44" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="485" y="58.15" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Hot</text><text x="485" y="72.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">receiver</text></g>
    <g><rect x="430" y="150" width="110" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="485" y="175.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Elsewhere</text></g>
    <path d="M110,62 C170,62 170,110 220,114" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M110,172 C170,172 170,128 220,124" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M320,114 C370,110 370,62 430,62" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M320,124 C370,128 370,172 430,172" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/><rect x="150" y="100" width="50" height="38" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="175" y="122" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">PAUSE</text></g>
    <text x="280" y="210" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">one PAUSE stops the whole shared class</text>
  </g>
  <text x="280" y="278" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Flow A causes the congestion. But the PAUSE stops the whole class on the shared upstream link, so</tspan><tspan x="280" dy="14">Flow B, bound somewhere else entirely, is stalled too. This is congestion spreading.</tspan></text>
</svg>
