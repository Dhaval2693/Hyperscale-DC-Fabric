<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" width="775" height="488" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Two server boxes, each holding four GPUs linked by NVLink (tensor parallel). An arrow passes activations between servers (pipeline). A wide arrow links the two replicas for the gradient all-reduce (data).">
  <title>How a real job maps onto the network tiers</title>
  <defs><marker id="parallelism-map-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="parallelism-map-ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect x="0.5" y="0.5" width="619" height="389" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="310" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">HOW A REAL JOB MAPS ONTO THE NETWORK TIERS</text>
  <g transform="translate(0,30)">
    <rect x="26" y="56" width="234" height="66" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="143" y="49" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Server A — pipeline stage 1</text>
    <g><rect x="42" y="70" width="44" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="64" y="87.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <g><rect x="94" y="70" width="44" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="116" y="87.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <g><rect x="146" y="70" width="44" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="168" y="87.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <g><rect x="198" y="70" width="44" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="220" y="87.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <path d="M64,66 H236" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.9s" repeatCount="indefinite"/></path>
    <rect x="26" y="176" width="234" height="66" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="143" y="169" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Server B — pipeline stage 2</text>
    <g><rect x="42" y="190" width="44" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="64" y="207.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <g><rect x="94" y="190" width="44" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="116" y="207.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <g><rect x="146" y="190" width="44" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="168" y="207.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <g><rect x="198" y="190" width="44" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="220" y="207.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <path d="M64,186 H236" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.9s" repeatCount="indefinite"/></path>
    <text x="143" y="258" fill="#dc2626" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">NVLink inside box = tensor parallel</text>
    <path d="M46,122 V176" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#parallelism-map-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path>
    <text x="54" y="142" fill="#7c3aed" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">activations</text>
    <text x="54" y="154" fill="#7c3aed" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">(pipeline)</text>
    <rect x="346" y="56" width="234" height="186" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="463" y="50" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">replica 2 (another full copy)</text>
    <g><rect x="406" y="112" width="150" height="74" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="481" y="145.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">identical</text><text x="481" y="158.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">model copy</text></g>
    <path d="M262,142 H344" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#parallelism-map-ah-ok)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M344,154 H262" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#parallelism-map-ah-ok)"><animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.4s" repeatCount="indefinite"/></path>
    <text x="303" y="302" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">data parallel: gradient all-reduce across replicas</text>
  </g>
  <text x="310" y="358" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="310" dy="0">Tensor parallelism stays inside a server over NVLink; pipeline parallelism hands activations server to</tspan><tspan x="310" dy="14">server; data parallelism syncs gradients across the replicas.</tspan></text>
</svg>
