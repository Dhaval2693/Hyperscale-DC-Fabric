<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" width="725" height="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Four groups of switches wired all-to-all internally and joined by global links; a packet takes the direct A-to-B link, then detours A-to-C-to-B when it is busy.">
  <title>Dragonfly: direct global link, or detour when it is busy</title>
  <rect x="0.5" y="0.5" width="579" height="379" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">DRAGONFLY: DIRECT GLOBAL LINK, OR DETOUR WHEN IT IS BUSY</text>
  <g transform="translate(0,30)">
    <line x1="108" y1="68" x2="192" y2="68" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="108" y1="68" x2="150" y2="120" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="192" y1="68" x2="150" y2="120" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="108" cy="68" r="6" fill="#0891b2"/>
    <circle cx="192" cy="68" r="6" fill="#0891b2"/>
    <circle cx="150" cy="120" r="6" fill="#0891b2"/>
    <text x="150" y="54" fill="#0891b2" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">group A</text>
    <text x="150" y="92" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">all-to-all</text>
    <line x1="388" y1="68" x2="472" y2="68" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="388" y1="68" x2="430" y2="120" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="472" y1="68" x2="430" y2="120" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="388" cy="68" r="6" fill="#7c3aed"/>
    <circle cx="472" cy="68" r="6" fill="#7c3aed"/>
    <circle cx="430" cy="120" r="6" fill="#7c3aed"/>
    <text x="430" y="54" fill="#7c3aed" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">group B</text>
    <text x="430" y="92" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">all-to-all</text>
    <line x1="108" y1="208" x2="192" y2="208" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="108" y1="208" x2="150" y2="260" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="192" y1="208" x2="150" y2="260" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="108" cy="208" r="6" fill="#16a34a"/>
    <circle cx="192" cy="208" r="6" fill="#16a34a"/>
    <circle cx="150" cy="260" r="6" fill="#16a34a"/>
    <text x="150" y="194" fill="#16a34a" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">group C</text>
    <text x="150" y="232" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">all-to-all</text>
    <line x1="388" y1="208" x2="472" y2="208" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="388" y1="208" x2="430" y2="260" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <line x1="472" y1="208" x2="430" y2="260" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="388" cy="208" r="6" fill="#d97706"/>
    <circle cx="472" cy="208" r="6" fill="#d97706"/>
    <circle cx="430" cy="260" r="6" fill="#d97706"/>
    <text x="430" y="194" fill="#d97706" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">group D</text>
    <text x="430" y="232" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">all-to-all</text>
    <line x1="192" y1="68" x2="388" y2="68" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="150" y1="120" x2="150" y2="208" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="192" y1="252" x2="388" y2="252" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="430" y1="120" x2="430" y2="208" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="188" y1="112" x2="392" y2="208" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0333;0.0667;0.4444;0.4778;1" dur="9s" repeatCount="indefinite"/><path d="M192,68 L388,68" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.9s" repeatCount="indefinite"/></path></g>
    <text x="290" y="56" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">direct A -&gt; B</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4778;0.5111;0.9556;0.9889;1" dur="9s" repeatCount="indefinite"/><path d="M150,120 L150,208" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.9s" repeatCount="indefinite"/></path></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4778;0.5111;0.9556;0.9889;1" dur="9s" repeatCount="indefinite"/><path d="M192,252 C300,252 360,160 426,112" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.9s" repeatCount="indefinite"/></path></g>
    <text x="300" y="290" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">detour A -&gt; C -&gt; B uses a less-loaded link (one extra hop)</text>
  </g>
  <text x="290" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">Groups are all-to-all inside; a few global links join them. When A to B is congested, adaptive routing</tspan><tspan x="290" dy="14">detours the packet through group C.</tspan></text>
</svg>
