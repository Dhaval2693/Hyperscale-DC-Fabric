<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="700" height="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A large teacher model on the left, a small student model on the right, with answers flowing from teacher to student and the student shrinking in size but keeping much of the skill.">
  <title>Distillation: a small student learns from a big teacher</title>
  <defs><marker id="models-distillation-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="289" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">DISTILLATION: A SMALL STUDENT LEARNS FROM A BIG TEACHER</text>
  <g transform="translate(0,30)">
    <g><rect x="60" y="60" width="150" height="90" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="135" y="95.6" fill="#334155" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Teacher</text><text x="135" y="108.6" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">big, capable</text><text x="135" y="121.6" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">expensive to run</text></g>
    <g><rect x="360" y="85" width="110" height="60" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="415" y="106.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Student</text><text x="415" y="118.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">small, fast</text><text x="415" y="130" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">cheap to run</text></g>
    <text x="285" y="48" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">answers to imitate</text>
    <path d="M210 105 C270 105 300 115 358 115" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#models-distillation-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;150 10;150 10" keyTimes="0;0.0375;0.3125;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0562;0.2938;0.3125;1" dur="8s" repeatCount="indefinite"/><circle cx="212" cy="105" r="5" fill="#7c3aed"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;150 10;150 10" keyTimes="0;0.2375;0.5125;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2375;0.2563;0.4938;0.5125;1" dur="8s" repeatCount="indefinite"/><circle cx="212" cy="105" r="5" fill="#7c3aed"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;150 10;150 10" keyTimes="0;0.4375;0.7125;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4375;0.4562;0.6937;0.7125;1" dur="8s" repeatCount="indefinite"/><circle cx="212" cy="105" r="5" fill="#7c3aed"/></g>
    <text x="265" y="185" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">student keeps much of the teacher's skill at a fraction of the cost</text>
  </g>
  <text x="280" y="258" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">A large teacher model's outputs train a much smaller student, so the student punches above its</tspan><tspan x="280" dy="14">parameter count. Watch the knowledge flow from teacher to student.</tspan></text>
</svg>
