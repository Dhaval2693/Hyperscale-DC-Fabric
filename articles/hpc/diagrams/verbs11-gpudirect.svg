<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="750" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top path: GPU to host RAM to NIC, two hops. Bottom path: GPU straight to NIC over PCIe, one hop.">
  <title>GPUDirect lets the NIC skip the bounce through host memory</title>
  <rect x="0.5" y="0.5" width="599" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">GPUDIRECT LETS THE NIC SKIP THE BOUNCE THROUGH HOST MEMORY</text>
  <g transform="translate(0,30)">
    <text x="14" y="26" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">WITHOUT GPUDIRECT</text>
    <g><rect x="60" y="44" width="90" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="105" y="67.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <g><rect x="255" y="44" width="90" height="40" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="300" y="67" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">host RAM</text></g>
    <g><rect x="450" y="44" width="90" height="40" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="495" y="67.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">NIC</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;105 0;105 0" keyTimes="0;0.0375;0.25;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0562;0.2313;0.25;1" dur="8s" repeatCount="indefinite"/><g><rect x="150" y="52" width="36" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="168" y="66.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">copy</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;105 0;105 0" keyTimes="0;0.3;0.5125;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3187;0.4937;0.5125;1" dur="8s" repeatCount="indefinite"/><g><rect x="345" y="52" width="36" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="363" y="66.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">copy</text></g></g>
    <text x="300" y="108" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">two hops, a wasted copy through the CPU</text>
    <text x="14" y="150" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">WITH GPUDIRECT RDMA</text>
    <g><rect x="60" y="168" width="90" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="105" y="193.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU</text></g>
    <g><rect x="450" y="168" width="90" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="495" y="193.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">NIC</text></g>
    <path d="M150 190 H450" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;300 0;300 0" keyTimes="0;0.075;0.375;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.0938;0.3563;0.375;1" dur="8s" repeatCount="indefinite"/><g><rect x="150" y="178" width="40" height="24" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="170" y="192.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">data</text></g></g>
    <text x="300" y="232" fill="#16a34a" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">one hop over PCIe — same root complex required</text>
  </g>
  <text x="300" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Without GPUDirect RDMA the data copies into host RAM first, then out to the NIC. With it, the NIC reads</tspan><tspan x="300" dy="14">GPU memory directly over PCIe — if both sit under the same PCIe root complex.</tspan></text>
</svg>
