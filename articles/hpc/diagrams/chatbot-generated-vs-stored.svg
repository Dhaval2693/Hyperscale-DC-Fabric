<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="700" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Left: a web server sends a stored file unchanged. Right: a model shows probability bars over candidate next tokens and picks one.">
  <title>Looked up (web page) vs computed (chatbot)</title>
  <defs><marker id="chatbot-generated-vs-stored-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">LOOKED UP (WEB PAGE) VS COMPUTED (CHATBOT)</text>
  <g transform="translate(0,30)">
    <line x1="280" y1="36" x2="280" y2="220" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="140" y="32" fill="#64748b" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">web page: looked up</text>
    <g><rect x="60" y="56" width="90" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="105" y="81.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Server</text></g>
    <g><rect x="60" y="130" width="160" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="140" y="147.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">stored file</text><text x="140" y="159.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">same bytes every time</text></g>
    <path d="M105 100 V130" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#chatbot-generated-vs-stored-ah-accent)"/>
    <text x="140" y="196" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">find file, send it</text>
    <text x="420" y="32" fill="#64748b" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">chatbot: computed</text>
    <g transform="translate(320,180)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.15;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-91" width="30" height="91" rx="3" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/></g></g>
    <text x="335" y="194" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">To</text>
    <g transform="translate(362,180)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0688;0.1812;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-69" width="30" height="69" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="377" y="194" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">A</text>
    <g transform="translate(404,180)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.1;0.2125;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-38" width="30" height="38" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="419" y="194" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Think</text>
    <g transform="translate(446,180)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.1313;0.2437;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-24" width="30" height="24" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="461" y="194" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Jet</text>
    <g transform="translate(488,180)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.1625;0.275;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-13" width="30" height="13" rx="3" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/></g></g>
    <text x="503" y="194" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">...</text>
    <text x="335" y="196" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start"></text>
    <text x="420" y="214" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">pick (sample) one next token, then repeat</text>
    <text x="335" y="56" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">P(next token)</text>
  </g>
  <text x="280" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">A web server returns a file that already exists. A model computes a probability for every possible</tspan><tspan x="280" dy="14">next token and samples one — nothing was stored.</tspan></text>
</svg>
