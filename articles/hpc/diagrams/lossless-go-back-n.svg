<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="700" height="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Five packets leave a sender; the third is dropped at a switch, and the sender resends the third, fourth and fifth packets from the start.">
  <title>One drop, a whole batch resent</title>
  <rect x="0.5" y="0.5" width="559" height="279" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">ONE DROP, A WHOLE BATCH RESENT</text>
  <g transform="translate(0,30)">
    <g><rect x="18" y="84" width="86" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="61" y="107.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Sender</text></g>
    <g><rect x="456" y="84" width="86" height="40" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="499" y="107.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Receiver</text></g>
    <rect x="224" y="72" width="112" height="72" rx="6" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="280" y="88" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Switch</text>
    <text x="280" y="102" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">full queue</text>
    <path d="M104,116 H224" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M336,116 H456" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;352 0;352 0" keyTimes="0;0.0333;0.3222;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0333;0.05;0.3056;0.3222;1" dur="9s" repeatCount="indefinite"/><g><rect x="104" y="104" width="24" height="24" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="116" y="119.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;352 0;352 0" keyTimes="0;0.0722;0.3611;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0722;0.0889;0.3444;0.3611;1" dur="9s" repeatCount="indefinite"/><g><rect x="104" y="104" width="24" height="24" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="116" y="119.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">2</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;120 0;120 0" keyTimes="0;0.1111;0.2222;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1111;0.1278;0.2056;0.2222;1" dur="9s" repeatCount="indefinite"/><g><rect x="104" y="104" width="24" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="116" y="119.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">3</text></g></g>
    <text x="280" y="164" fill="#dc2626" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">drop!</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;352 0;352 0" keyTimes="0;0.15;0.4389;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1667;0.4222;0.4389;1" dur="9s" repeatCount="indefinite"/><g><rect x="104" y="104" width="24" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="116" y="119.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">4</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;352 0;352 0" keyTimes="0;0.1889;0.4778;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1889;0.2056;0.4611;0.4778;1" dur="9s" repeatCount="indefinite"/><g><rect x="104" y="104" width="24" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="116" y="119.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">5</text></g></g>
    <text x="280" y="40" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">then: go back to 3, resend 3-4-5</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;438 0;438 0" keyTimes="0;0.6;0.8667;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.6167;0.85;0.8667;1" dur="9s" repeatCount="indefinite"/><g><rect x="104" y="52" width="24" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="116" y="67.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">3</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;438 0;438 0" keyTimes="0;0.6333;0.9;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6333;0.65;0.8833;0.9;1" dur="9s" repeatCount="indefinite"/><g><rect x="104" y="52" width="24" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="116" y="67.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">4</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;438 0;438 0" keyTimes="0;0.6667;0.9333;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6833;0.9167;0.9333;1" dur="9s" repeatCount="indefinite"/><g><rect x="104" y="52" width="24" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="116" y="67.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">5</text></g></g>
  </g>
  <text x="280" y="248" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Packet 3 is dropped. A go-back-N NIC cannot accept 4 and 5 out of order, so the sender rewinds and</tspan><tspan x="280" dy="14">resends 3, 4 and 5.</tspan></text>
</svg>
