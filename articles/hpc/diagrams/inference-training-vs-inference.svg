    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;110 0;110 0" keyTimes="0;0.4875;0.7375;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4875;0.5062;0.7188;0.7375;1" dur="8s" repeatCount="indefinite"/><g><rect x="150" y="128" width="24" height="24" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="162" y="142.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">req</text></g></g>
