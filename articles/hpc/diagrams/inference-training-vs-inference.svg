<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="700" height="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top: eight GPUs locked in step as one job. Bottom: many small requests arriving at a serving pool at different times and leaving when done.">
  <title>Training is one job; inference is a flood</title>
  <rect x="0.5" y="0.5" width="559" height="289" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">TRAINING IS ONE JOB; INFERENCE IS A FLOOD</text>
  <g transform="translate(0,30)">
    <text x="14" y="30" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">TRAINING</text>
    <text x="14" y="44" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">one job, in lockstep</text>
    <g><rect x="150" y="24" width="40" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="170" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G0</text></g>
    <g><rect x="200" y="24" width="40" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="220" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G1</text></g>
