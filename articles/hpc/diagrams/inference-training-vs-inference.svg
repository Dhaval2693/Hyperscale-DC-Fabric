    <g><rect x="300" y="24" width="40" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="320" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G3</text></g>
    <g><rect x="350" y="24" width="40" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="370" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G4</text></g>
    <g><rect x="400" y="24" width="40" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="420" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G5</text></g>
    <g><rect x="450" y="24" width="40" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="470" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G6</text></g>
    <g><rect x="500" y="24" width="40" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="520" y="42" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">G7</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0625;0.0875;0.9;0.925;1" dur="8s" repeatCount="indefinite"/><text x="355" y="70" fill="#0891b2" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">all step together, then sync</text></g>
    <path d="M150 82 H540" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="14" y="128" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">INFERENCE</text>
    <text x="14" y="142" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">many small requests</text>
    <g><rect x="250" y="120" width="90" height="40" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="295" y="136.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">serving</text><text x="295" y="149.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pool</text></g>
