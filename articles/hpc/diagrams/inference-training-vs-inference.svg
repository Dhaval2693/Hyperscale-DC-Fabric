  <text x="280" y="258" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Training locks thousands of GPUs into one synchronized job for weeks. Inference is many small</tspan><tspan x="280" dy="14">independent requests, arriving and finishing on their own.</tspan></text>
