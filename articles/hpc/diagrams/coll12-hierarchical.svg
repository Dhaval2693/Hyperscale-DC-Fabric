  <text x="300" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">NCCL reduces within each server over NVLink first, exchanges the partial sums between servers over the</tspan><tspan x="300" dy="14">RDMA network, then shares the result back down NVLink. The slow network link carries far less data this</tspan><tspan x="300" dy="14">way.</tspan></text>
