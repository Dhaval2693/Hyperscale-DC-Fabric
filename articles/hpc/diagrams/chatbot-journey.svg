<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="750" height="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A laptop sends a request across the internet to an edge/load balancer, then an API gateway, then a scheduler, then a group of GPUs; tokens stream back one by one.">
  <title>One question, from your keyboard to a GPU and back</title>
  <rect x="0.5" y="0.5" width="599" height="379" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">ONE QUESTION, FROM YOUR KEYBOARD TO A GPU AND BACK</text>
  <g transform="translate(0,30)">
    <g><rect x="20" y="60" width="86" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="63" y="79.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Your app</text><text x="63" y="91.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">laptop</text></g>
    <g><rect x="130" y="60" width="86" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="173" y="79.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Edge + LB</text><text x="173" y="91.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">near you</text></g>
    <g><rect x="240" y="60" width="92" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="286" y="79.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">API gateway</text><text x="286" y="91.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">auth, limits</text></g>
    <g><rect x="356" y="60" width="92" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="402" y="79.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Scheduler</text><text x="402" y="91.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">pick + queue</text></g>
    <g><rect x="470" y="48" width="110" height="100" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="525" y="95.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU group</text><text x="525" y="107.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">model in memory</text></g>
    <path d="M106 82 H130" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M216 82 H240" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M332 82 H356" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M448 82 H470" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="118" y="50" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">internet</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;430 0;430 0" keyTimes="0;0.04;0.4;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.055;0.385;0.4;1" dur="10s" repeatCount="indefinite"/><g><rect x="24" y="112" width="70" height="20" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="59" y="124.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">request</text></g></g>
    <text x="60" y="150" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">a few KB</text>
    <path d="M470 170 H120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="300" y="162" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">tokens stream back, one at a time</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-360 0;-360 0" keyTimes="0;0.44;0.64;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.455;0.625;0.64;1" dur="10s" repeatCount="indefinite"/><g><rect x="452" y="182" width="30" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="467" y="194.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-360 0;-360 0" keyTimes="0;0.55;0.75;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.565;0.735;0.75;1" dur="10s" repeatCount="indefinite"/><g><rect x="452" y="182" width="30" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="467" y="194.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-360 0;-360 0" keyTimes="0;0.66;0.86;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.675;0.845;0.86;1" dur="10s" repeatCount="indefinite"/><g><rect x="452" y="182" width="30" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="467" y="194.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-360 0;-360 0" keyTimes="0;0.77;0.97;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.77;0.785;0.955;0.97;1" dur="10s" repeatCount="indefinite"/><g><rect x="452" y="182" width="30" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="467" y="194.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <text x="300" y="232" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the answer is built here, token by token — it was not stored anywhere</text>
  </g>
  <text x="300" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Watch the amber request travel in to a GPU group; then watch violet tokens stream back out one at a time</tspan><tspan x="300" dy="14">over the same open connection.</tspan></text>
</svg>
