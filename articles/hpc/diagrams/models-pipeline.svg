<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="800" height="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A left-to-right pipeline: raw text data, pretraining, a base model, post-training, an assistant, an optional reasoning-RL stage, and release. A marker moves through each stage in turn.">
  <title>The shared recipe behind almost every model</title>
  <defs><marker id="models-pipeline-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="models-pipeline-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="639" height="289" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE SHARED RECIPE BEHIND ALMOST EVERY MODEL</text>
  <g transform="translate(0,30)">
    <g><rect x="16" y="70" width="92" height="46" rx="6" fill="#ebedf0" stroke="#64748b" stroke-width="1.5"/><text x="62" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Text data</text><text x="62" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">web, books, code</text></g>
    <g><rect x="118" y="70" width="92" height="46" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="164" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Pretrain</text><text x="164" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">next-token</text></g>
    <g><rect x="220" y="70" width="92" height="46" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="266" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Base model</text><text x="266" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">continues text</text></g>
    <g><rect x="322" y="70" width="92" height="46" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="368" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Post-train</text><text x="368" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">tune + feedback</text></g>
    <g><rect x="424" y="70" width="92" height="46" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="470" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Assistant</text><text x="470" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">helpful, safe</text></g>
    <g><rect x="424" y="18" width="92" height="40" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="470" y="35.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Reasoning RL</text><text x="470" y="46.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">optional</text></g>
    <g><rect x="540" y="70" width="84" height="46" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="582" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Release</text><text x="582" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">ship it</text></g>
    <line x1="108" y1="93" x2="118" y2="93" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#models-pipeline-ah-link)"/>
    <line x1="210" y1="93" x2="220" y2="93" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#models-pipeline-ah-link)"/>
    <line x1="312" y1="93" x2="322" y2="93" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#models-pipeline-ah-link)"/>
    <line x1="414" y1="93" x2="424" y2="93" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#models-pipeline-ah-link)"/>
    <line x1="516" y1="93" x2="540" y2="93" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#models-pipeline-ah-link)"/>
    <line x1="470" y1="70" x2="470" y2="58" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#models-pipeline-ah-warn)"/>
    <g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.1556;0.1778;1" dur="9s" repeatCount="indefinite"/><circle cx="62" cy="93" r="6" fill="#d97706"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;102 0;102 0" keyTimes="0;0.1556;0.2889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1556;0.1722;0.2722;0.2889;1" dur="9s" repeatCount="indefinite"/><circle cx="62" cy="93" r="6" fill="#d97706"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;102 0;102 0" keyTimes="0;0.3111;0.4444;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3111;0.3278;0.4278;0.4444;1" dur="9s" repeatCount="indefinite"/><circle cx="164" cy="93" r="6" fill="#d97706"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;102 0;102 0" keyTimes="0;0.4667;0.6;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4667;0.4833;0.5833;0.6;1" dur="9s" repeatCount="indefinite"/><circle cx="266" cy="93" r="6" fill="#d97706"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;102 0;102 0" keyTimes="0;0.6222;0.7556;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6222;0.6389;0.7389;0.7556;1" dur="9s" repeatCount="indefinite"/><circle cx="368" cy="93" r="6" fill="#d97706"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;112 0;112 0" keyTimes="0;0.7778;0.9111;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7778;0.7944;0.8944;0.9111;1" dur="9s" repeatCount="indefinite"/><circle cx="470" cy="93" r="6" fill="#d97706"/></g>
  </g>
  <text x="320" y="258" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="320" dy="0">Data is pretrained into a base model, post-trained into an assistant, then optionally given a reasoning stage</tspan><tspan x="320" dy="14">before release. Watch the amber token of work flow through each stage.</tspan></text>
</svg>
