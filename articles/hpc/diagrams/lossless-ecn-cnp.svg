<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 334" width="750" height="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A switch queue with a lower ECN threshold and a higher PFC threshold; a marked packet reaches the receiver, which sends a notification back, and the sender reduces rate.">
  <title>ECN asks nicely before PFC slams the door</title>
  <rect x="0.5" y="0.5" width="599" height="333" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">ECN ASKS NICELY BEFORE PFC SLAMS THE DOOR</text>
  <g transform="translate(0,30)">
    <g><rect x="26" y="95" width="86" height="48" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="69" y="122.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Sender</text></g>
    <g><rect x="490" y="95" width="86" height="48" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="533" y="122.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Receiver</text></g>
    <rect x="250" y="62" width="100" height="116" rx="6" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="300" y="78" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Switch</text>
    <line x1="258" y1="100" x2="342" y2="100" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="300" y="95" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">PFC line</text>
    <line x1="258" y1="128" x2="342" y2="128" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="300" y="170" fill="#d97706" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">ECN line</text>
    <path d="M112,112 H250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M350,112 H490" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;400 0;400 0" keyTimes="0;0.0444;0.3556;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0444;0.0611;0.3389;0.3556;1" dur="9s" repeatCount="indefinite"/><g><rect x="112" y="101" width="26" height="22" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="125" y="115" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">CE</text></g></g>
    <text x="300" y="206" fill="#d97706" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1556;0.1889;0.3778;0.4111;1" dur="9s" repeatCount="indefinite"/>mark, don't drop</text>
    <path d="M490,150 H112" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-376 0;-376 0" keyTimes="0;0.3778;0.6667;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3778;0.3944;0.65;0.6667;1" dur="9s" repeatCount="indefinite"/><g><rect x="474" y="139" width="40" height="22" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="494" y="153" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">CNP</text></g></g>
    <text x="300" y="228" fill="#16a34a" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7;0.9556;0.9889;1" dur="9s" repeatCount="indefinite"/>sender slows down</text>
  </g>
  <text x="300" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">At the lower ECN line the switch marks a packet instead of dropping it. The receiver returns a CNP, the</tspan><tspan x="300" dy="14">sender slows, and the queue never reaches the higher PFC line. ECN is the gentle signal; PFC is the</tspan><tspan x="300" dy="14">backstop.</tspan></text>
</svg>
