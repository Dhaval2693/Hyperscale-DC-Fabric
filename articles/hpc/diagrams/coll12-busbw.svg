<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 324" width="700" height="405" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A flow from size-over-time giving algbw, through the factor two times n-minus-one over n, to busbw, with an eight-rank worked example underneath.">
  <title>From algbw to busbw: what nccl-tests really measures</title>
  <defs><marker id="coll12-busbw-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="coll12-busbw-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="323" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">FROM ALGBW TO BUSBW: WHAT NCCL-TESTS REALLY MEASURES</text>
  <g transform="translate(0,30)">
    <g><rect x="30" y="40" width="130" height="50" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="95" y="68.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">algbw = S / t</text></g>
    <g><rect x="210" y="40" width="150" height="50" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="285" y="68.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">x 2(n-1)/n</text></g>
    <g><rect x="410" y="40" width="130" height="50" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="475" y="68.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">busbw</text></g>
    <path d="M160 65 H210" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#coll12-busbw-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M360 65 H410" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#coll12-busbw-ah-warn)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;50 0;50 0" keyTimes="0;0.0625;0.275;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0625;0.0813;0.2563;0.275;1" dur="8s" repeatCount="indefinite"/><g><rect x="162" y="53" width="46" height="24" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="185" y="67.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle"></text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;50 0;50 0" keyTimes="0;0.325;0.55;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.325;0.3438;0.5312;0.55;1" dur="8s" repeatCount="indefinite"/><g><rect x="362" y="53" width="46" height="24" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="385" y="67.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle"></text></g></g>
    <text x="280" y="135" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">8 ranks: factor = 2 x 7 / 8 = 1.75</text>
    <text x="280" y="160" fill="#dc2626" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">algbw 100 GB/s  -&gt;  busbw 175 GB/s</text>
    <text x="280" y="195" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">busbw is the number you compare to line rate</text>
  </g>
  <text x="280" y="278" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Algorithm bandwidth is just size over time. Bus bandwidth scales it by 2(n-1)/n for all-reduce so</tspan><tspan x="280" dy="14">it reflects the hardware bottleneck and can be compared across any number of ranks. Worked for 8</tspan><tspan x="280" dy="14">ranks.</tspan></text>
</svg>
