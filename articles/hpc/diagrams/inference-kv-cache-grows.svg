  <text x="280" y="268" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Each new token adds a key/value slot that later tokens reuse instead of recomputing. The cache</tspan><tspan x="280" dy="14">grows per token and multiplies across concurrent users.</tspan></text>
