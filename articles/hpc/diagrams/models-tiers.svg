<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 314" width="700" height="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Three tiers — small, medium, large — shown as bars of growing capability, with arrows indicating cost and latency rise with size while speed falls.">
  <title>Why one model becomes a shelf of tiers</title>
  <defs><marker id="models-tiers-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="313" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">WHY ONE MODEL BECOMES A SHELF OF TIERS</text>
  <g transform="translate(0,30)">
    <g transform="translate(70,170)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.0375;0.1625;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-46.2" width="100" height="46.2" rx="3" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/></g></g>
    <text x="120" y="186" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Small</text>
    <text x="120" y="115.8" fill="#64748b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">capability</text>
    <g transform="translate(230,170)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.1;0.225;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-77" width="100" height="77" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="280" y="186" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Medium</text>
    <text x="280" y="85" fill="#64748b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">capability</text>
    <g transform="translate(390,170)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.04;1 0.04;1 1;1 1;1 0.04;1 0.04" keyTimes="0;0.1625;0.2875;0.9375;0.9875;1" dur="8s" repeatCount="indefinite"/><rect x="0" y="-110" width="100" height="110" rx="3" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/></g></g>
    <text x="440" y="186" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Large</text>
    <text x="440" y="52" fill="#64748b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">capability</text>
    <line x1="60" y1="170" x2="500" y2="170" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="70" y1="40" x2="440" y2="40" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#models-tiers-ah-muted)"/>
    <text x="70" y="32" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">more capable, slower, costlier  →</text>
  </g>
  <text x="280" y="268" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Bigger tiers are more capable but slower and costlier per token; smaller tiers are fast and cheap.</tspan><tspan x="280" dy="14">You match the tier to the job, not always the biggest. Bars show relative capability growing with</tspan><tspan x="280" dy="14">size.</tspan></text>
</svg>
