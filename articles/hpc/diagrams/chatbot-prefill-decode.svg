<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="700" height="375" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A prompt of several tokens is read at once in a prefill phase; then a decode phase emits output tokens one by one, each sent back over the open connection.">
  <title>Prefill reads it all; decode streams one token at a time</title>
  <defs><marker id="chatbot-prefill-decode-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="chatbot-prefill-decode-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">PREFILL READS IT ALL; DECODE STREAMS ONE TOKEN AT A TIME</text>
  <g transform="translate(0,30)">
    <text x="120" y="34" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">prefill: whole prompt at once</text>
    <g><animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/><g><rect x="40" y="54" width="40" height="24" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="60" y="68.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g><g><rect x="86" y="54" width="40" height="24" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="106" y="68.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g><g><rect x="132" y="54" width="40" height="24" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="152" y="68.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g><g><rect x="178" y="54" width="40" height="24" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="198" y="68.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <path d="M60 90 V110" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><rect x="40" y="110" width="186" height="26" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="133" y="126" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">model state built</text></g>
    <path d="M226 123 H270" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#chatbot-prefill-decode-ah-link)"/>
    <text x="410" y="34" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">decode: one token per pass</text>
    <g><rect x="280" y="110" width="90" height="26" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="325" y="126" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">predict +1</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -60;0 -60" keyTimes="0;0.0667;0.2111;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0667;0.0833;0.1944;0.2111;1" dur="9s" repeatCount="indefinite"/><g><rect x="390" y="108" width="40" height="24" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="410" y="122.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -60;0 -60" keyTimes="0;0.2444;0.3889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2444;0.2611;0.3722;0.3889;1" dur="9s" repeatCount="indefinite"/><g><rect x="390" y="108" width="40" height="24" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="410" y="122.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -60;0 -60" keyTimes="0;0.4222;0.5667;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4222;0.4389;0.55;0.5667;1" dur="9s" repeatCount="indefinite"/><g><rect x="390" y="108" width="40" height="24" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="410" y="122.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -60;0 -60" keyTimes="0;0.6;0.7444;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.6167;0.7278;0.7444;1" dur="9s" repeatCount="indefinite"/><g><rect x="390" y="108" width="40" height="24" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="410" y="122.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <path d="M370 123 H390" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#chatbot-prefill-decode-ah-accent2)"/>
    <text x="430" y="70" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">streamed to you</text>
    <text x="280" y="176" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the pause then the stream: prefill works, then tokens flow one at a time</text>
  </g>
  <text x="280" y="268" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Prefill processes your whole prompt in one parallel pass; then decode produces one token per pass,</tspan><tspan x="280" dy="14">each streamed to you the instant it is made.</tspan></text>
</svg>
