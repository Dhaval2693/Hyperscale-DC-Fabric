<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" font-family="monospace">
  <text x="270" y="16" fill="#64748b" font-size="11" text-anchor="middle">Same transfer, two data paths: who touches the bytes?</text>
  <text x="12" y="42" fill="#334155" font-size="11">TCP</text>
  <rect x="60" y="30" width="64" height="30" rx="5" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="92" y="49" fill="#334155" font-size="10.5" text-anchor="middle">App mem</text>
  <rect x="150" y="30" width="64" height="30" rx="5" fill="#dc262622" stroke="#dc2626" stroke-width="1.5"/>
  <text x="182" y="49" fill="#334155" font-size="10.5" text-anchor="middle">Kernel</text>
  <rect x="248" y="30" width="64" height="30" rx="5" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="280" y="49" fill="#334155" font-size="10.5" text-anchor="middle">NIC</text>
  <text x="182" y="74" fill="#64748b" font-size="9" text-anchor="middle">copy + TCP</text>
  <path d="M124,45 L150,45" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M214,45 L248,45" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <text x="340" y="49" fill="#334155" font-size="10.5">to wire &#8594;</text>
  <path d="M312,45 L336,45" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <text x="12" y="122" fill="#334155" font-size="11">RDMA</text>
  <rect x="60" y="110" width="64" height="30" rx="5" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="92" y="129" fill="#334155" font-size="10.5" text-anchor="middle">App mem</text>
  <rect x="150" y="110" width="64" height="30" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="182" y="125" fill="#94a3b8" font-size="10.5" text-anchor="middle">Kernel</text>
  <text x="182" y="136" fill="#94a3b8" font-size="8.5" text-anchor="middle">bypassed</text>
  <rect x="248" y="110" width="64" height="30" rx="5" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="280" y="129" fill="#334155" font-size="10.5" text-anchor="middle">NIC</text>
  <text x="340" y="129" fill="#334155" font-size="10.5">to wire &#8594;</text>
  <path d="M92,110 C92,86 280,86 280,110" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.0s" repeatCount="indefinite"/></path>
  <text x="186" y="80" fill="#7c3aed" font-size="9" text-anchor="middle">NIC reads memory directly</text>
  <path d="M312,125 L336,125" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  
  <text x="270" y="172" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">
  <tspan x="270" dy="0">TCP copies the data into a kernel buffer and runs the TCP stack on every message.</tspan>
  <tspan x="270" dy="14">RDMA registers the memory once; the NIC moves it directly — the kernel never touches the payload.</tspan>
  </text>
</svg>
