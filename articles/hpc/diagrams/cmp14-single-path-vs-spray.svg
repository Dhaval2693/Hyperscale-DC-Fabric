<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="750" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top: two flows both hashed onto the same middle path, colliding. Bottom: one flow's packets fanned out across four parallel paths to the receiver.">
  <title>One flow, one path vs one flow sprayed over many</title>
  <rect x="0.5" y="0.5" width="599" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">ONE FLOW, ONE PATH VS ONE FLOW SPRAYED OVER MANY</text>
  <g transform="translate(0,30)">
    <text x="14" y="28" fill="#0891b2" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ECMP (per-flow)</text>
    <g><rect x="60" y="54" width="70" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="95" y="72" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">src A</text></g>
    <g><rect x="60" y="92" width="70" height="30" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="95" y="110" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">src B</text></g>
    <g><rect x="470" y="72" width="80" height="34" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="510" y="92" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">dst</text></g>
    <line x1="180" y1="40" x2="430" y2="40" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="180" y1="88" x2="430" y2="88" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="180" y1="136" x2="430" y2="136" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M130 70 C200 70 200 88 260 88 H430 C460 88 460 86 470 86" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M130 106 C200 106 200 88 260 88 H430" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1875;0.2125;1" dur="8s" repeatCount="indefinite"/><text x="305" y="80" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">collision</text></g>
    <circle cx="300" cy="88" r="6" fill="#dc2626"/>
    <text x="14" y="176" fill="#7c3aed" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">SRD (multipath spray)</text>
    <g><rect x="60" y="196" width="70" height="30" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="95" y="214" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">src</text></g>
    <g><rect x="470" y="196" width="80" height="30" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="510" y="214" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">dst</text></g>
    <line x1="170" y1="182" x2="440" y2="182" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="170" y1="200" x2="440" y2="200" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="170" y1="218" x2="440" y2="218" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="170" y1="236" x2="440" y2="236" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;300 -29;300 -29" keyTimes="0;0.0375;0.3;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0562;0.2812;0.3;1" dur="8s" repeatCount="indefinite"/><rect x="136" y="205" width="26" height="14" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;300 -11;300 -11" keyTimes="0;0.075;0.3375;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.0938;0.3187;0.3375;1" dur="8s" repeatCount="indefinite"/><rect x="136" y="205" width="26" height="14" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;300 7;300 7" keyTimes="0;0.1125;0.375;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1125;0.1312;0.3563;0.375;1" dur="8s" repeatCount="indefinite"/><rect x="136" y="205" width="26" height="14" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;300 25;300 25" keyTimes="0;0.15;0.4125;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1687;0.3937;0.4125;1" dur="8s" repeatCount="indefinite"/><rect x="136" y="205" width="26" height="14" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/></g>
  </g>
  <text x="300" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">ECMP hashes a whole flow onto a single path, so two big flows can collide on one link. SRD spreads the</tspan><tspan x="300" dy="14">packets of a single flow across many paths and reassembles order at the receiver.</tspan></text>
</svg>
