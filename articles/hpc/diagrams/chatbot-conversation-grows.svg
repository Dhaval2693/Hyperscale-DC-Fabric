<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="700" height="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Three turns stacked; each request carries all previous messages plus the new one, growing taller each time, sent to a stateless model.">
  <title>Every turn re-sends the whole conversation</title>
  <defs><marker id="chatbot-conversation-grows-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="309" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">EVERY TURN RE-SENDS THE WHOLE CONVERSATION</text>
  <g transform="translate(0,30)">
    <g><rect x="430" y="85" width="110" height="56" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="485" y="110.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Model</text><text x="485" y="122.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">no memory</text></g>
    <text x="70" y="34" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">turn 1</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0222;0.0556;0.3333;0.3667;1" dur="9s" repeatCount="indefinite"/><g><rect x="30" y="44" width="80" height="20" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="70" y="57" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Q1</text></g><path d="M110 54 H424" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#chatbot-conversation-grows-ah-accent)"/></g>
    <text x="70" y="86" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">turn 2</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3667;0.6667;0.7;1" dur="9s" repeatCount="indefinite"/><g><rect x="30" y="96" width="80" height="20" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="70" y="109" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Q1</text></g><g><rect x="118" y="96" width="80" height="20" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="158" y="109" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">A1</text></g><g><rect x="206" y="96" width="80" height="20" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="246" y="109" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Q2</text></g><path d="M286 106 H424" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#chatbot-conversation-grows-ah-accent)"/></g>
    <text x="70" y="138" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">turn 3</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6667;0.7;0.9778;1" dur="9s" repeatCount="indefinite"/><g><rect x="30" y="148" width="70" height="20" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="65" y="161" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Q1</text></g><g><rect x="106" y="148" width="70" height="20" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="141" y="161" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">A1</text></g><g><rect x="182" y="148" width="70" height="20" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="217" y="161" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Q2</text></g><g><rect x="258" y="148" width="70" height="20" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="293" y="161" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">A2</text></g><g><rect x="334" y="148" width="70" height="20" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="369" y="161" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Q3</text></g><path d="M404 158 H424" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#chatbot-conversation-grows-ah-accent)"/></g>
    <text x="230" y="206" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">faded = resent from earlier turns   bright = your new message</text>
  </g>
  <text x="280" y="278" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">The model keeps no memory between requests, so the app re-sends the entire transcript each turn —</tspan><tspan x="280" dy="14">and the request grows with every exchange.</tspan></text>
</svg>
