<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="700" height="375" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Four horizontal progress bars. Three fill quickly and then wait; the fourth fills slowly, and a 'step done' marker only appears once it finishes.">
  <title>One slow GPU sets the pace for all</title>
  <rect x="0.5" y="0.5" width="559" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">ONE SLOW GPU SETS THE PACE FOR ALL</text>
  <g transform="translate(0,30)">
    <text x="20" y="55" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">GPU 0</text>
    <rect x="130" y="40" width="320" height="22" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(130,40)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;0.02 1;1 1;1 1;0.02 1;0.02 1" keyTimes="0;0.0286;0.3143;0.9286;0.9857;1" dur="7s" repeatCount="indefinite"/><rect x="0" y="0" width="320" height="22" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="20" y="97" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">GPU 1</text>
    <rect x="130" y="82" width="320" height="22" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(130,82)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;0.02 1;1 1;1 1;0.02 1;0.02 1" keyTimes="0;0.0286;0.3571;0.9286;0.9857;1" dur="7s" repeatCount="indefinite"/><rect x="0" y="0" width="320" height="22" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="20" y="139" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">GPU 2</text>
    <rect x="130" y="124" width="320" height="22" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(130,124)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;0.02 1;1 1;1 1;0.02 1;0.02 1" keyTimes="0;0.0286;0.3286;0.9286;0.9857;1" dur="7s" repeatCount="indefinite"/><rect x="0" y="0" width="320" height="22" rx="3" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g></g>
    <text x="20" y="181" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">GPU 3 (slow)</text>
    <rect x="130" y="166" width="320" height="22" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g transform="translate(130,166)"><g><animateTransform attributeName="transform" type="scale" additive="sum" values="0.02 1;0.02 1;1 1;1 1;0.02 1;0.02 1" keyTimes="0;0.0286;0.7429;0.9286;0.9857;1" dur="7s" repeatCount="indefinite"/><rect x="0" y="0" width="320" height="22" rx="3" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3714;0.4;0.7429;0.7714;1" dur="7s" repeatCount="indefinite"/><text x="290" y="206" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">fast GPUs idle, waiting on the straggler</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7571;0.7857;1" dur="7s" repeatCount="indefinite"/><text x="290" y="206" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">step completes — at the slow GPU's pace</text></g>
  </g>
  <text x="280" y="268" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Three GPUs finish their work and go idle (grey), but the step cannot complete until the slow</tspan><tspan x="280" dy="14">fourth GPU (red) catches up.</tspan></text>
</svg>
