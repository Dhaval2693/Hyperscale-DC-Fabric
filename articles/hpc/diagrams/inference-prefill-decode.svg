<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" width="725" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top: a whole prompt entering one wide prefill block in a single pass. Bottom: a decode block that reads all the weights from memory to emit one token, repeated.">
  <title>Prefill reads it all at once; decode drips one token at a time</title>
  <defs><marker id="inference-prefill-decode-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="inference-prefill-decode-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect x="0.5" y="0.5" width="579" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">PREFILL READS IT ALL AT ONCE; DECODE DRIPS ONE TOKEN AT A TIME</text>
  <g transform="translate(0,30)">
    <text x="14" y="28" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">PREFILL</text>
    <text x="14" y="42" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">compute-bound</text>
    <g><rect x="140" y="20" width="32" height="26" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="156" y="35.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g>
    <g><rect x="180" y="20" width="32" height="26" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="196" y="35.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g>
    <g><rect x="220" y="20" width="32" height="26" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="236" y="35.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g>
    <g><rect x="260" y="20" width="32" height="26" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="276" y="35.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g>
    <g><rect x="300" y="20" width="32" height="26" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="316" y="35.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g>
    <g><rect x="340" y="20" width="32" height="26" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="356" y="35.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g>
    <g><rect x="400" y="20" width="150" height="26" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="475" y="36" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">one wide pass</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 0;0 0" keyTimes="0;0.0333;0.1333;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0333;0.05;0.1167;0.1333;1" dur="9s" repeatCount="indefinite"/><path d="M392 33 H398" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#inference-prefill-decode-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path></g>
    <path d="M375 33 H398" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#inference-prefill-decode-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="290" y="62" fill="#0891b2" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">whole prompt in parallel</text>
    <text x="14" y="128" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">DECODE</text>
    <text x="14" y="142" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">memory-bandwidth-bound</text>
    <g><rect x="120" y="118" width="110" height="44" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="175" y="136.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">HBM</text><text x="175" y="149.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">(140 GB)</text></g>
    <g><rect x="300" y="118" width="110" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="355" y="136.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">decode</text><text x="355" y="149.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">step</text></g>
    <path d="M230 140 H300" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="265" y="112" fill="#d97706" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">stream all weights</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;120 0;120 0" keyTimes="0;0.1111;0.2889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1111;0.1278;0.2722;0.2889;1" dur="9s" repeatCount="indefinite"/><g><rect x="412" y="126" width="28" height="28" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="426" y="142.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;120 0;120 0" keyTimes="0;0.4222;0.6;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4222;0.4389;0.5833;0.6;1" dur="9s" repeatCount="indefinite"/><g><rect x="412" y="126" width="28" height="28" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="426" y="142.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;120 0;120 0" keyTimes="0;0.7333;0.9111;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7333;0.75;0.8944;0.9111;1" dur="9s" repeatCount="indefinite"/><g><rect x="412" y="126" width="28" height="28" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="426" y="142.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tok</text></g></g>
    <text x="500" y="112" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">one token</text>
    <text x="500" y="126" fill="#16a34a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">per pass</text>
    <text x="290" y="200" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">~140 GB / 3.35 TB/s per token -&gt; about 24 tokens/s for one request</text>
  </g>
  <text x="290" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">Prefill processes the whole prompt in a single parallel pass. Decode then produces one token per pass,</tspan><tspan x="290" dy="14">re-reading every weight from GPU memory each time.</tspan></text>
</svg>
