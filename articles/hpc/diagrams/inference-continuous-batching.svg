<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="700" height="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Four GPU batch slots; as one request finishes and leaves a slot, a queued request slides in to take its place.">
  <title>Continuous batching keeps the slots full</title>
  <rect x="0.5" y="0.5" width="559" height="309" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">CONTINUOUS BATCHING KEEPS THE SLOTS FULL</text>
  <g transform="translate(0,30)">
    <text x="14" y="28" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">QUEUE</text>
    <text x="14" y="118" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">GPU batch</text>
    <text x="14" y="132" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">4 slots</text>
    <g><rect x="140" y="110" width="80" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="180" y="135" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">slot</text></g>
    <g><rect x="250" y="110" width="80" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="290" y="135" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">slot</text></g>
    <g><rect x="360" y="110" width="80" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="400" y="135" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">slot</text></g>
    <g><rect x="470" y="110" width="80" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="510" y="135" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">slot</text></g>
    <g><rect x="146" y="116" width="68" height="32" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="180" y="134.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">req</text></g>
    <g><rect x="256" y="116" width="68" height="32" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="290" y="134.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">req</text></g>
    <g><rect x="366" y="116" width="68" height="32" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="400" y="134.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">req</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 90;0 90" keyTimes="0;0.1111;0.2889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1111;0.1278;0.2722;0.2889;1" dur="9s" repeatCount="indefinite"/><g><rect x="476" y="20" width="68" height="32" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="510" y="38.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">req</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2889;0.3111;1" dur="9s" repeatCount="indefinite"/><g><rect x="476" y="116" width="68" height="32" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="510" y="134.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">req</text></g></g>
    <text x="355" y="200" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">a freed slot is refilled at once — no waiting for the batch</text>
  </g>
  <text x="280" y="278" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Instead of waiting for a whole batch to finish, a slot that frees up is handed to the next waiting</tspan><tspan x="280" dy="14">request immediately, so the GPU rarely idles.</tspan></text>
</svg>
