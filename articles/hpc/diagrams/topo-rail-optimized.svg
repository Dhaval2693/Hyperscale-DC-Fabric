  <text x="290" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">GPU i in every server plugs into rail switch i. Same-numbered GPUs — the ones that talk most in all-</tspan><tspan x="290" dy="14">reduce — reach each other in a single switch hop.</tspan></text>
