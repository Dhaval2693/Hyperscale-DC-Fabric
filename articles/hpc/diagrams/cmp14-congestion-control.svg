<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="750" height="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top: a long loop from sender to switch mark to receiver to CNP back to sender. Bottom: a short sender-to-receiver-and-back timing loop at the sender.">
  <title>DCQCN signals through the network; SRD reacts at the sender</title>
  <defs><marker id="cmp14-congestion-control-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="cmp14-congestion-control-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="cmp14-congestion-control-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="cmp14-congestion-control-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="309" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">DCQCN SIGNALS THROUGH THE NETWORK; SRD REACTS AT THE SENDER</text>
  <g transform="translate(0,30)">
    <text x="14" y="26" fill="#0891b2" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">DCQCN</text>
    <g><rect x="40" y="44" width="80" height="34" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="80" y="64" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sender</text></g>
    <g><rect x="250" y="44" width="90" height="34" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="295" y="57.85" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">switch</text><text x="295" y="69.55" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">(ECN mark)</text></g>
    <g><rect x="470" y="44" width="80" height="34" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="510" y="64" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">receiver</text></g>
    <path d="M120 61 H250" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-congestion-control-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M340 61 H470" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-congestion-control-ah-warn)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-430 0;-430 0" keyTimes="0;0.1111;0.3889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1111;0.1278;0.3722;0.3889;1" dur="9s" repeatCount="indefinite"/><g><rect x="478" y="86" width="56" height="22" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="506" y="99.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">CNP</text></g></g>
    <path d="M470 97 H48" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-congestion-control-ah-hot)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="300" y="124" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">slow-down takes a full lap of the network</text>
    <text x="14" y="160" fill="#7c3aed" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">SRD</text>
    <g><rect x="140" y="178" width="90" height="34" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="185" y="191.85" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sender</text><text x="185" y="203.55" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">(rate ctrl)</text></g>
    <g><rect x="380" y="178" width="90" height="34" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="425" y="198" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">receiver</text></g>
    <path d="M230 190 H380" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-congestion-control-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M380 202 H230" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#cmp14-congestion-control-ah-accent2)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1111;0.1333;1" dur="9s" repeatCount="indefinite"/><text x="305" y="170" fill="#7c3aed" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">measures its own RTT</text></g>
    <text x="305" y="224" fill="#94a3b8" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">reacts without waiting for a notification to come back</text>
  </g>
  <text x="300" y="278" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">DCQCN marks a packet at the congested switch, the receiver echoes a notification back, and only then does</tspan><tspan x="300" dy="14">the sender slow down. SRD's sender watches round-trip timing itself and adjusts its own rate.</tspan></text>
</svg>
