<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="700" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A source switch and a destination switch joined by three parallel links. Two large flows both animate along the middle link, which is marked saturated; the top and bottom links carry nothing.">
  <title>Why ECMP collides training's elephant flows</title>
  <defs><marker id="ecmp-collision-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">WHY ECMP COLLIDES TRAINING'S ELEPHANT FLOWS</text>
  <g transform="translate(0,30)">
    <g><rect x="30" y="95" width="90" height="50" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="75" y="116.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">leaf</text><text x="75" y="129.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">switch</text></g>
    <g><rect x="440" y="95" width="90" height="50" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="485" y="116.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">leaf</text><text x="485" y="129.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">switch</text></g>
    <g><rect x="252" y="34" width="56" height="28" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="50.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">spine</text></g>
    <line x1="120" y1="120" x2="252" y2="48" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="308" y1="48" x2="440" y2="120" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><rect x="252" y="106" width="56" height="28" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="122.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">spine</text></g>
    <line x1="120" y1="120" x2="252" y2="120" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="308" y1="120" x2="440" y2="120" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><rect x="252" y="178" width="56" height="28" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="194.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">spine</text></g>
    <line x1="120" y1="120" x2="252" y2="192" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="308" y1="192" x2="440" y2="120" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="190" y="70" fill="#94a3b8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 1 — idle</text>
    <text x="190" y="182" fill="#94a3b8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 3 — idle</text>
    <text x="380" y="100" fill="#dc2626" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">path 2 — saturated</text>
    <path d="M120,120 L252,120" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 7" marker-end="url(#ecmp-collision-ah-hot)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></path>
    <path d="M308,120 L440,120" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 7" marker-end="url(#ecmp-collision-ah-hot)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;126 0;126 0" keyTimes="0;0.0429;0.4286;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0429;0.06;0.4114;0.4286;1" dur="7s" repeatCount="indefinite"/><g><rect x="130" y="108" width="44" height="20" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="152" y="120.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">flow A</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;126 0;126 0" keyTimes="0;0.2286;0.6143;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2286;0.2457;0.5971;0.6143;1" dur="7s" repeatCount="indefinite"/><g><rect x="130" y="108" width="44" height="20" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="152" y="120.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">flow B</text></g></g>
    <text x="280" y="228" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">two 400 Gb/s elephants, one link; the others stay empty</text>
  </g>
  <text x="280" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">With only a few near-identical flows, the hash can pile two elephants onto one link (red,</tspan><tspan x="280" dy="14">saturated) while a parallel link (grey) sits idle.</tspan></text>
</svg>
