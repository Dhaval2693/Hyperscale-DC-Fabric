<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" width="700" height="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Four source GPUs sending large flows up to a switch that spreads them over four uplinks; three flows pile onto one uplink while the others sit empty.">
  <title>Few big flows, same hash, one uplink overloaded</title>
  <rect x="0.5" y="0.5" width="559" height="343" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">FEW BIG FLOWS, SAME HASH, ONE UPLINK OVERLOADED</text>
  <g transform="translate(0,30)">
    <text x="14" y="30" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">4 synchronized flows</text>
    <g><rect x="30" y="40" width="56" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="58" y="57.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU 0</text></g>
    <g><rect x="30" y="100" width="56" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="58" y="117.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU 1</text></g>
    <g><rect x="30" y="160" width="56" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="58" y="177.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU 2</text></g>
    <g><rect x="30" y="220" width="56" height="30" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="58" y="237.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">GPU 3</text></g>
    <g><rect x="170" y="110" width="70" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="205" y="138" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">switch</text></g>
    <g><rect x="470" y="46" width="76" height="26" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="508" y="61.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">uplink A</text></g>
    <g><rect x="470" y="86" width="76" height="26" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="508" y="101.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">uplink B</text></g>
    <g><rect x="470" y="126" width="76" height="26" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="508" y="141.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">uplink C</text></g>
    <g><rect x="470" y="186" width="76" height="26" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="508" y="201.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">uplink D</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;84 0;84 0" keyTimes="0;0.0375;0.275;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0562;0.2563;0.275;1" dur="8s" repeatCount="indefinite"/><g><rect x="90" y="43" width="24" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="102" y="57.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle"></text></g></g>
    <path d="M240 135 L470 60" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;84 0;84 0" keyTimes="0;0.075;0.3125;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.075;0.0938;0.2938;0.3125;1" dur="8s" repeatCount="indefinite"/><g><rect x="90" y="103" width="24" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="102" y="117.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle"></text></g></g>
    <path d="M240 135 L470 60" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;84 0;84 0" keyTimes="0;0.1125;0.35;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1125;0.1312;0.3313;0.35;1" dur="8s" repeatCount="indefinite"/><g><rect x="90" y="163" width="24" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="102" y="177.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle"></text></g></g>
    <path d="M240 135 L470 60" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;84 0;84 0" keyTimes="0;0.15;0.3875;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.1687;0.3688;0.3875;1" dur="8s" repeatCount="indefinite"/><g><rect x="90" y="223" width="24" height="24" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="102" y="237.4" fill="#334155" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle"></text></g></g>
    <path d="M240 135 L470 200" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="345" y="100" fill="#dc2626" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">3 flows -&gt; one uplink</text>
    <text x="400" y="225" fill="#16a34a" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">uplink D idle</text>
  </g>
  <text x="280" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">A collective makes a handful of enormous flows with nearly identical 5-tuples. ECMP hashes several</tspan><tspan x="280" dy="14">onto the same uplink, which congests, while its neighbours carry nothing. Low entropy, not bad</tspan><tspan x="280" dy="14">luck.</tspan></text>
</svg>
