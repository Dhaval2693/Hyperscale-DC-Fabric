<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" font-family="monospace">
  <text x="230" y="16" fill="#64748b" font-size="11" text-anchor="middle">Parameter server (incast) vs. ring all-reduce</text>
  <text x="110" y="38" fill="#64748b" font-size="11" text-anchor="middle">parameter server</text>
  <circle cx="110" cy="110" r="20" fill="#dc262633" stroke="#dc2626" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="110" y="114" fill="#334155" font-size="11" text-anchor="middle">PS</text>
  <circle cx="40" cy="60" r="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <circle cx="180" cy="60" r="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <circle cx="40" cy="160" r="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <circle cx="180" cy="160" r="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <path d="M52,68 L94,100" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M168,68 L126,100" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M52,152 L94,120" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M168,152 L126,120" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <line x1="230" y1="40" x2="230" y2="170" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="38" fill="#64748b" font-size="11" text-anchor="middle">ring all-reduce</text>
  <circle cx="360" cy="55" r="14" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="415" cy="110" r="14" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="360" cy="165" r="14" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="305" cy="110" r="14" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M372,62 Q405,75 410,98" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M412,123 Q400,155 372,160" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M348,160 Q312,152 308,123" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <path d="M308,98 Q318,68 348,62" stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <text x="230.0" y="205" fill="#64748b" font-size="10.5" font-family="sans-serif" text-anchor="middle">
  <tspan x="230.0" dy="0">Left: every worker’s gradient converges on one server — its links saturate (incast).</tspan>
  <tspan x="230.0" dy="14">Right: each GPU sends only to its neighbor, spreading load evenly across the fabric.</tspan>
  </text>
</svg>
