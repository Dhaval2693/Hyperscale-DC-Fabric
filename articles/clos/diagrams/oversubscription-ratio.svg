<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430">
<style>
  .bg   { fill:#0f172a; }
  .card { fill:#1e293b; stroke:#334155; stroke-width:1; }
  .sw   { fill:#06b6d4; fill-opacity:.12; stroke:#06b6d4; stroke-width:1.5; }
  .ttl  { fill:#f1f5f9; font-family:system-ui,sans-serif; font-size:15px; font-weight:700; text-anchor:middle; }
  .sub  { fill:#94a3b8; font-family:system-ui,sans-serif; font-size:11px; text-anchor:middle; }
  .lbl  { fill:#94a3b8; font-family:system-ui,sans-serif; font-size:10px; font-weight:600; }
  .val  { font-family:system-ui,sans-serif; font-weight:800; text-anchor:middle; }
  .vlab { fill:#f1f5f9; font-family:system-ui,sans-serif; font-size:11px; font-weight:600; text-anchor:middle; }
  .vsub { fill:#94a3b8; font-family:system-ui,sans-serif; font-size:10px; text-anchor:middle; }

  /* Uplink port blink — active (purple) */
  @keyframes upblink {
    0%,100% { fill:#6366f1; opacity:.9; }
    50%     { fill:#6366f1; opacity:.3; }
  }
  /* Downlink ports: cloud mode — ~35% light up */
  @keyframes dn1 { 0%,45%,100%{fill:#10b981;opacity:.9;} 46%,90%{fill:#1e293b;opacity:.3;} }
  @keyframes dn2 { 0%,30%,100%{fill:#10b981;opacity:.9;} 31%,75%{fill:#1e293b;opacity:.3;} }
  @keyframes dn3 { 0%,20%,100%{fill:#1e293b;opacity:.3;} 21%,55%{fill:#10b981;opacity:.9;} 56%,100%{fill:#1e293b;opacity:.3;} }
  @keyframes dn4 { 0%,60%{fill:#1e293b;opacity:.3;} 61%,95%{fill:#10b981;opacity:.9;} 96%,100%{fill:#1e293b;opacity:.3;} }
  @keyframes dn5 { 0%,35%{fill:#1e293b;opacity:.3;} 36%,70%{fill:#10b981;opacity:.9;} 71%,100%{fill:#1e293b;opacity:.3;} }

  /* Bar fill animation */
  @keyframes dbar { 0%{width:38px;}25%{width:90px;}50%{width:55px;}75%{width:120px;}100%{width:38px;} }
  @keyframes ubar { 0%{width:19px;}25%{width:45px;}50%{width:28px;}75%{width:60px;}100%{width:19px;} }

  .up-port  { animation: upblink 1.4s infinite; }
  .dn-p1    { animation: dn1 2.3s infinite; }
  .dn-p2    { animation: dn2 3.1s infinite; }
  .dn-p3    { animation: dn3 2.7s infinite; }
  .dn-p4    { animation: dn4 3.5s infinite; }
  .dn-p5    { animation: dn5 2.9s infinite; }
  .bar-dn   { animation: dbar 3s ease-in-out infinite; fill:#10b981; height:10px; }
  .bar-up   { animation: ubar 3s ease-in-out infinite; fill:#6366f1; height:10px; }
</style>

<rect width="860" height="430" rx="10" class="bg"/>

<!-- Title -->
<text x="430" y="30" class="ttl">Oversubscription Ratio</text>
<text x="430" y="46" class="sub">A 48-port switch: 32 downlinks × 25G = 800 Gbps, 16 uplinks × 25G = 400 Gbps — a 2:1 oversubscription</text>

<!-- Switch body -->
<rect x="230" y="60" width="400" height="290" rx="10" class="card"/>
<rect x="248" y="72" width="364" height="266" rx="7" class="sw"/>
<text x="430" y="92" class="ttl" style="font-size:12px;fill:#06b6d4">LEAF SWITCH  —  48 port, 25G</text>

<!-- UPLINKS section label -->
<text x="430" y="110" class="lbl" style="text-anchor:middle;fill:#6366f1">▲ UPLINKS (×16) → Spine</text>

<!-- Uplink port grid: 2 rows × 8 cols starting at x=270 y=115 spacing 20 -->
<!-- Row 1 -->
<rect x="270" y="117" width="16" height="14" rx="2" class="up-port"/>
<rect x="293" y="117" width="16" height="14" rx="2" class="up-port" style="animation-delay:.18s"/>
<rect x="316" y="117" width="16" height="14" rx="2" class="up-port" style="animation-delay:.35s"/>
<rect x="339" y="117" width="16" height="14" rx="2" class="up-port" style="animation-delay:.52s"/>
<rect x="362" y="117" width="16" height="14" rx="2" class="up-port" style="animation-delay:.7s"/>
<rect x="385" y="117" width="16" height="14" rx="2" class="up-port" style="animation-delay:.88s"/>
<rect x="408" y="117" width="16" height="14" rx="2" class="up-port" style="animation-delay:1.05s"/>
<rect x="431" y="117" width="16" height="14" rx="2" class="up-port" style="animation-delay:1.22s"/>
<!-- Row 2 -->
<rect x="270" y="135" width="16" height="14" rx="2" class="up-port" style="animation-delay:.27s"/>
<rect x="293" y="135" width="16" height="14" rx="2" class="up-port" style="animation-delay:.44s"/>
<rect x="316" y="135" width="16" height="14" rx="2" class="up-port" style="animation-delay:.61s"/>
<rect x="339" y="135" width="16" height="14" rx="2" class="up-port" style="animation-delay:.78s"/>
<rect x="362" y="135" width="16" height="14" rx="2" class="up-port" style="animation-delay:.96s"/>
<rect x="385" y="135" width="16" height="14" rx="2" class="up-port" style="animation-delay:1.13s"/>
<rect x="408" y="135" width="16" height="14" rx="2" class="up-port" style="animation-delay:1.3s"/>
<rect x="431" y="135" width="16" height="14" rx="2" class="up-port" style="animation-delay:1.47s"/>

<!-- FORWARDING ENGINE -->
<rect x="270" y="158" width="320" height="28" rx="5" fill="#06b6d430" stroke="#06b6d4" stroke-width="1"/>
<text x="430" y="176" class="ttl" style="font-size:11px;fill:#06b6d4">FORWARDING ENGINE</text>

<!-- DOWNLINKS section label -->
<text x="430" y="200" class="lbl" style="text-anchor:middle;fill:#10b981">▼ DOWNLINKS (×32) → Servers</text>

<!-- Downlink port grid: 4 rows × 8 cols -->
<!-- Using animation classes cycling through dn1..dn5 to create ~35% active pattern -->
<!-- Row 1 -->
<rect x="270" y="205" width="16" height="14" rx="2" class="dn-p1"/>
<rect x="293" y="205" width="16" height="14" rx="2" class="dn-p3"/>
<rect x="316" y="205" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="339" y="205" width="16" height="14" rx="2" class="dn-p2"/>
<rect x="362" y="205" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="385" y="205" width="16" height="14" rx="2" class="dn-p4"/>
<rect x="408" y="205" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="431" y="205" width="16" height="14" rx="2" class="dn-p1" style="animation-delay:.5s"/>
<!-- Row 2 -->
<rect x="270" y="223" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="293" y="223" width="16" height="14" rx="2" class="dn-p5"/>
<rect x="316" y="223" width="16" height="14" rx="2" class="dn-p2" style="animation-delay:.8s"/>
<rect x="339" y="223" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="362" y="223" width="16" height="14" rx="2" class="dn-p3" style="animation-delay:.4s"/>
<rect x="385" y="223" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="408" y="223" width="16" height="14" rx="2" class="dn-p1" style="animation-delay:1.1s"/>
<rect x="431" y="223" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<!-- Row 3 -->
<rect x="270" y="241" width="16" height="14" rx="2" class="dn-p4" style="animation-delay:.6s"/>
<rect x="293" y="241" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="316" y="241" width="16" height="14" rx="2" class="dn-p5" style="animation-delay:.2s"/>
<rect x="339" y="241" width="16" height="14" rx="2" class="dn-p2" style="animation-delay:1.3s"/>
<rect x="362" y="241" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="385" y="241" width="16" height="14" rx="2" class="dn-p3" style="animation-delay:.9s"/>
<rect x="408" y="241" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="431" y="241" width="16" height="14" rx="2" class="dn-p1" style="animation-delay:.7s"/>
<!-- Row 4 -->
<rect x="270" y="259" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="293" y="259" width="16" height="14" rx="2" class="dn-p5" style="animation-delay:1.0s"/>
<rect x="316" y="259" width="16" height="14" rx="2" class="dn-p2" style="animation-delay:.3s"/>
<rect x="339" y="259" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="362" y="259" width="16" height="14" rx="2" class="dn-p4" style="animation-delay:.15s"/>
<rect x="385" y="259" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>
<rect x="408" y="259" width="16" height="14" rx="2" class="dn-p3" style="animation-delay:1.2s"/>
<rect x="431" y="259" width="16" height="14" rx="2" fill="#1e293b" opacity=".3"/>

<!-- Bandwidth bars -->
<text x="430" y="295" class="lbl" style="text-anchor:middle;fill:#94a3b8">Live utilization</text>
<!-- Downlink bar -->
<text x="270" y="312" class="lbl" style="fill:#10b981">Downlink</text>
<rect x="270" y="315" width="320" height="10" rx="3" fill="#334155"/>
<rect x="270" y="315" rx="3" class="bar-dn"/>
<text x="596" y="324" class="lbl" style="fill:#94a3b8;font-size:9px">800 Gbps max</text>
<!-- Uplink bar -->
<text x="270" y="338" class="lbl" style="fill:#6366f1">Uplink</text>
<rect x="270" y="341" width="320" height="10" rx="3" fill="#334155"/>
<rect x="270" y="341" rx="3" class="bar-up"/>
<text x="596" y="350" class="lbl" style="fill:#94a3b8;font-size:9px">400 Gbps max</text>

<!-- Ratio callout cards -->
<rect x="30"  y="148" width="170" height="76" rx="8" class="card"/>
<text x="115" y="170" class="val" style="font-size:22px;fill:#10b981">800 Gbps</text>
<text x="115" y="188" class="vlab">Downlink capacity</text>
<text x="115" y="202" class="vsub">32 ports × 25G</text>
<text x="115" y="215" class="vsub" style="fill:#94a3b880">Statistical multiplexing</text>

<rect x="660" y="148" width="170" height="76" rx="8" class="card"/>
<text x="745" y="170" class="val" style="font-size:22px;fill:#6366f1">400 Gbps</text>
<text x="745" y="188" class="vlab">Uplink capacity</text>
<text x="745" y="202" class="vsub">16 ports × 25G</text>
<text x="745" y="215" class="vsub" style="fill:#94a3b880">To spine switches</text>

<rect x="340" y="368" width="180" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="430" y="387" class="val" style="font-size:24px;fill:#f59e0b">2 : 1</text>
<text x="430" y="404" class="vlab" style="fill:#f59e0b">Oversubscription Ratio</text>

<!-- Info box -->
<rect x="15" y="382" width="315" height="36" rx="6" class="card"/>
<text x="172" y="397" class="sub" style="text-anchor:middle;font-size:10px;fill:#f1f5f9">Web/cloud works fine — not all servers</text>
<text x="172" y="411" class="sub" style="text-anchor:middle;font-size:10px;fill:#94a3b8">transmit at full rate simultaneously</text>

<rect x="530" y="382" width="315" height="36" rx="6" class="card"/>
<text x="687" y="397" class="sub" style="text-anchor:middle;font-size:10px;fill:#ef4444">AI all-reduce breaks this — every GPU</text>
<text x="687" y="411" class="sub" style="text-anchor:middle;font-size:10px;fill:#94a3b8">transmits at the same time → congestion</text>
</svg>
