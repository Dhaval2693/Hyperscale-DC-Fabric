<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="700" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Three labelled circles - private data, untrusted content, external communication - overlapping; the shared centre is marked as the danger zone.">
  <title>The lethal trifecta</title>
  <rect x="0.5" y="0.5" width="559" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE LETHAL TRIFECTA</text>
  <g transform="translate(0,30)">
    <circle cx="222" cy="100" r="62" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/>
    <circle cx="338" cy="100" r="62" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="280" cy="162" r="62" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/>
    <text x="182" y="84" fill="#334155" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">private</text>
    <text x="182" y="100" fill="#334155" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">data</text>
    <text x="378" y="84" fill="#334155" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">untrusted</text>
    <text x="378" y="100" fill="#334155" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">content</text>
    <text x="280" y="182" fill="#334155" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">external</text>
    <text x="280" y="196" fill="#334155" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">comms</text>
    <g><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/><circle cx="280" cy="120" r="14" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/></g>
    <text x="475" y="136" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">all three</text>
    <text x="475" y="152" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">= theft</text>
    <text x="280" y="232" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">any two legs are survivable; break one to break the attack</text>
  </g>
  <text x="280" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">An agent is dangerous only when all three meet in one session; remove any one leg and a successful</tspan><tspan x="280" dy="14">injection has no way to steal data.</tspan></text>
</svg>
