<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="700" height="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A central model box labelled next-token predictor sits inside a larger harness box; around it are prompt builder, tool runner, permissions and user interface, all part of the harness.">
  <title>The model, and the harness around it</title>
  <rect x="0.5" y="0.5" width="559" height="379" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE MODEL, AND THE HARNESS AROUND IT</text>
  <g transform="translate(0,30)">
    <rect x="30" y="50" width="500" height="210" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="52" y="44" fill="#7c3aed" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">the harness  (also: agent scaffold, runtime)</text>
    <g><rect x="210" y="128" width="140" height="60" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="280" y="155.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">the model</text><text x="280" y="167.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">next-token predictor</text></g>
    <g><rect x="70" y="78" width="130" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="135" y="97.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">prompt builder</text><text x="135" y="109.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">gathers context</text></g>
    <g><rect x="360" y="78" width="130" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="425" y="97.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tool runner</text><text x="425" y="109.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">does what it asks</text></g>
    <g><rect x="70" y="196" width="130" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="135" y="215.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">permissions</text><text x="135" y="227.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">what it may touch</text></g>
    <g><rect x="360" y="196" width="130" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="425" y="215.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">user interface</text><text x="425" y="227.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">shows results</text></g>
    <path d="M210 150 H200" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M135 122 V128 Q135 150 160 150 H210" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M350 150 H360 Q425 150 425 122" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M210 172 Q150 172 135 196" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M350 172 Q410 172 425 196" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="280" y="282" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">same model, very different tools, because harnesses differ</text>
  </g>
  <text x="280" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">The model only predicts text. The harness builds the prompt, calls the model, runs the tools it</tspan><tspan x="280" dy="14">asks for, checks permissions, and shows you the result.</tspan></text>
</svg>
