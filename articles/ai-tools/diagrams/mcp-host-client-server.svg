<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="750" height="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A host box contains two client boxes; each client connects to its own server; each server lists tools, resources and prompts.">
  <title>One host, one client per server</title>
  <rect x="0.5" y="0.5" width="599" height="379" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">ONE HOST, ONE CLIENT PER SERVER</text>
  <g transform="translate(0,30)">
    <g><rect x="30" y="60" width="190" height="180" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="125" y="153.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Host  (the AI app)</text></g>
    <g><rect x="50" y="110" width="150" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="125" y="135" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">client 1</text></g>
    <g><rect x="50" y="176" width="150" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="125" y="201" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">client 2</text></g>
    <g><rect x="360" y="92" width="210" height="90" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="465" y="122.75" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">device server</text><text x="465" y="134.45" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">tool: get_bgp_neighbors</text><text x="465" y="146.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">resource: config</text><text x="465" y="157.85" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">prompt: triage</text></g>
    <g><rect x="360" y="206" width="210" height="60" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="465" y="227.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ticket server</text><text x="465" y="239.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">tool: find_ticket</text><text x="465" y="251" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">resource: ticket text</text></g>
    <path d="M200 132 H360" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M200 198 H360" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/></path>
    <text x="280" y="120" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">1 connection</text>
    <text x="280" y="186" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">1 connection</text>
    <text x="300" y="282" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">tools act  -  resources are read  -  prompts are templates</text>
  </g>
  <text x="300" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">The host (the AI app) spins up a dedicated client for each server. Every server offers up to three</tspan><tspan x="300" dy="14">primitives: tools, resources and prompts.</tspan></text>
</svg>
