<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="700" height="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A four-stage ring: decide a step, run a tool, read the result, add it to the context, with an arrow back to decide; a marker circles the ring until a done step exits.">
  <title>The agent loop: think, act, observe, repeat</title>
  <defs><marker id="agent-loop-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="agent-loop-ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="379" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE AGENT LOOP: THINK, ACT, OBSERVE, REPEAT</text>
  <g transform="translate(0,30)">
    <g><rect x="170" y="60" width="160" height="44" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="250" y="79.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">model decides</text><text x="250" y="91.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">what to do next</text></g>
    <g><rect x="360" y="128" width="150" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="435" y="147.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">harness runs it</text><text x="435" y="159.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">read file, run cmd</text></g>
    <g><rect x="185" y="196" width="160" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="265" y="215.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read the result</text><text x="265" y="227.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">output, error</text></g>
    <g><rect x="20" y="128" width="150" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="95" y="147.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">add to context</text><text x="95" y="159.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the working memory</text></g>
    <path d="M330 86 Q400 92 420 128" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#agent-loop-ah-link)"/>
    <path d="M400 172 Q360 210 345 214" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#agent-loop-ah-link)"/>
    <path d="M185 220 Q110 212 95 172" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#agent-loop-ah-link)"/>
    <path d="M95 128 Q150 92 170 86" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#agent-loop-ah-link)"/>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0222;0.05;0.2556;0.2833;1" dur="9s" repeatCount="indefinite"/><g><rect x="395" y="108" width="44" height="16" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="417" y="118.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">step</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2667;0.2944;0.5;0.5278;1" dur="9s" repeatCount="indefinite"/><g><rect x="330" y="205" width="44" height="16" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="352" y="215.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">step</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5111;0.5389;0.7444;0.7722;1" dur="9s" repeatCount="indefinite"/><g><rect x="110" y="195" width="44" height="16" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="132" y="205.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">step</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7556;0.7833;0.9778;1" dur="9s" repeatCount="indefinite"/><g><rect x="120" y="108" width="44" height="16" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="142" y="118.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">step</text></g></g>
    <g><rect x="360" y="250" width="150" height="36" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="435" y="265.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">done -&gt; answer</text><text x="435" y="277.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">loop exits</text></g>
    <path d="M300 240 Q360 250 360 250" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#agent-loop-ah-ok)"/>
    <text x="250" y="150" fill="#64748b" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">repeat</text>
  </g>
  <text x="280" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Watch the amber token travel the loop: the model decides a step, the harness runs it, the result</tspan><tspan x="280" dy="14">goes back into the context, and the model decides again.</tspan></text>
</svg>
