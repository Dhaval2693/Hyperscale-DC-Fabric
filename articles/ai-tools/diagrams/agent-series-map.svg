<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 386" width="750" height="482" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="An agent box in the centre surrounded by four labelled groups: what it knows (article 01), how it acts (02), how it follows your process (03), and using it well (04).">
  <title>The building blocks, and where the series covers them</title>
