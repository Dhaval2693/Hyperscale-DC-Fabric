  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE BUILDING BLOCKS, AND WHERE THE SERIES COVERS THEM</text>
  <g transform="translate(0,30)">
    <g><rect x="230" y="134" width="140" height="52" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="300" y="157.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">the agent</text><text x="300" y="169.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">model + harness</text></g>
    <g><rect x="60" y="44" width="180" height="56" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="150" y="63.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">what it knows</text><text x="150" y="75.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">context, rules, memory,</text><text x="150" y="87" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">knowledge  (article 01)</text></g>
    <g><rect x="360" y="44" width="180" height="56" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="450" y="63.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">how it acts</text><text x="450" y="75.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">tools, MCP,</text><text x="450" y="87" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">remote servers  (article 02)</text></g>
    <g><rect x="60" y="220" width="180" height="56" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="150" y="239.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">how it follows you</text><text x="150" y="251.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">skills, subagents, hooks,</text><text x="150" y="263" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">specs  (article 03)</text></g>
    <g><rect x="360" y="220" width="180" height="56" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="450" y="239.6" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">using it well</text><text x="450" y="251.3" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">safety, cost,</text><text x="450" y="263" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">learning  (article 04)</text></g>
