  <text x="300" y="368" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">The agent sits at the centre; each ring of capability is the subject of one later article in this series.</tspan></text>
