<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="750" height="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A chart with where it runs on the x-axis (your machine to the cloud) and autonomy on the y-axis; five labelled groups sit from chat apps low-left to cloud agents and agent platforms high and to the right.">
  <title>Families of AI tools, by where they run and how far they go</title>
  <defs><marker id="agent-families-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="399" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">FAMILIES OF AI TOOLS, BY WHERE THEY RUN AND HOW FAR THEY GO</text>
  <g transform="translate(0,30)">
    <path d="M70 270 H560" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#agent-families-ah-link)"/>
    <path d="M70 270 V40" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#agent-families-ah-link)"/>
    <text x="315" y="294" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">where it runs:  your machine  -&gt;  vendor cloud</text>
    <text x="44" y="150" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">autonomy</text>
    <g><rect x="92" y="214" width="118" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="151" y="233.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">chat apps</text><text x="151" y="245.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">ChatGPT, Claude.ai</text></g>
    <g><rect x="214" y="158" width="128" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="278" y="177.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">IDE assistants</text><text x="278" y="189.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">Copilot, Cursor, Kiro</text></g>
    <g><rect x="236" y="96" width="128" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="300" y="115.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">CLI agents</text><text x="300" y="127.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">Claude Code, Codex CLI</text></g>
    <g><rect x="392" y="150" width="140" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="462" y="169.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">cloud / background</text><text x="462" y="181.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">Copilot coding agent</text></g>
    <g><rect x="410" y="52" width="150" height="44" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="485" y="71.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">agent platforms</text><text x="485" y="83.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">SDKs, AgentCore</text></g>
    <text x="315" y="20" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">all share the same building blocks</text>
  </g>
  <text x="300" y="368" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">The same building blocks, packaged differently. Left to right: on your machine to the vendor's cloud.</tspan><tspan x="300" dy="14">Bottom to top: a little on its own to a lot.</tspan></text>
</svg>
