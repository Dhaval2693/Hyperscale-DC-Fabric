<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="750" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="An agent timeline runs read, lint, then push; a PreToolUse hook before each step lets read and lint through but blocks the push with a stop marker.">
  <title>A hook is a checkpoint that always fires</title>
  <defs><marker id="ssw-hooks-timeline-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">A HOOK IS A CHECKPOINT THAT ALWAYS FIRES</text>
  <g transform="translate(0,30)">
    <line x1="40" y1="120" x2="560" y2="120" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="300" y="30" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the agent's timeline  -&gt;</text>
    <g><rect x="76" y="56" width="68" height="22" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="110" y="69.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">hook</text></g>
    <path d="M110 78 V102" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ssw-hooks-timeline-ah-link)"/>
    <g><rect x="74" y="104" width="72" height="32" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="110" y="123" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read</text></g>
    <circle cx="110" cy="120" r="4" fill="#0891b2"/>
    <g><rect x="226" y="56" width="68" height="22" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="260" y="69.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">hook</text></g>
    <path d="M260 78 V102" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ssw-hooks-timeline-ah-link)"/>
    <g><rect x="224" y="104" width="72" height="32" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="260" y="123" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">lint</text></g>
    <circle cx="260" cy="120" r="4" fill="#0891b2"/>
    <g><rect x="396" y="56" width="68" height="22" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="430" y="69.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">hook</text></g>
    <path d="M430 78 V102" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ssw-hooks-timeline-ah-link)"/>
    <g><rect x="394" y="104" width="72" height="32" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="430" y="123" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">push config</text></g>
    <g><animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/><path d="M420 150 l20 16 M440 150 l-20 16" fill="none" stroke="#dc2626" stroke-width="2"/><text x="430" y="194" fill="#dc2626" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">BLOCKED</text></g>
    <text x="300" y="230" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the model may forget a rule; the hook cannot be talked out of it</text>
  </g>
  <text x="300" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Before each tool runs, a PreToolUse hook inspects the action. The push on a freeze day is blocked every</tspan><tspan x="300" dy="14">time, no matter what the model intended.</tspan></text>
</svg>
