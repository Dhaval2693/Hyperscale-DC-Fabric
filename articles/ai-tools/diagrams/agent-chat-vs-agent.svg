<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="750" height="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Left: a person shuttles amber text between a repo, a model, and a terminal by hand. Right: an agent box sits between the model and the same tools and moves the text itself, with the person only approving.">
  <title>Chat window vs agent: who does the fetching</title>
  <defs><marker id="agent-chat-vs-agent-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="379" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">CHAT WINDOW VS AGENT: WHO DOES THE FETCHING</text>
  <g transform="translate(0,30)">
    <line x1="300" y1="40" x2="300" y2="268" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="150" y="32" fill="#64748b" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">chat window</text>
    <g><rect x="40" y="60" width="90" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="85" y="77.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Maya</text><text x="85" y="89.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">copy/paste</text></g>
    <g><rect x="170" y="56" width="90" height="48" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="215" y="77.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Model</text><text x="215" y="89.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">in a tab</text></g>
    <g><rect x="40" y="150" width="90" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="85" y="167.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">repo</text><text x="85" y="179.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">configs</text></g>
    <g><rect x="170" y="150" width="90" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="215" y="167.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ticket</text><text x="215" y="179.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">alerts</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -56;0 -56" keyTimes="0;0.0333;0.2889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0333;0.05;0.2722;0.2889;1" dur="9s" repeatCount="indefinite"/><g><rect x="52" y="150" width="66" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="85" y="161.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">paste</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 56;0 56" keyTimes="0;0.3333;0.5889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.35;0.5722;0.5889;1" dur="9s" repeatCount="indefinite"/><g><rect x="182" y="104" width="66" height="18" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="215" y="115.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">answer</text></g></g>
    <text x="150" y="232" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">she is the courier between model and world</text>
    <text x="150" y="252" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">and the model forgets it all next week</text>
    <text x="450" y="32" fill="#64748b" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">agent</text>
    <g><rect x="340" y="56" width="90" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="385" y="73.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Maya</text><text x="385" y="85.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">approves</text></g>
    <g><rect x="470" y="56" width="100" height="40" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="520" y="73.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Model</text><text x="520" y="85.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">decides</text></g>
    <g><rect x="405" y="118" width="100" height="36" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="133.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">agent</text><text x="455" y="145.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">runs the loop</text></g>
    <g><rect x="340" y="184" width="90" height="36" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="385" y="205.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">repo</text></g>
    <g><rect x="470" y="184" width="100" height="36" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="520" y="205.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ticket / CLI</text></g>
    <path d="M455 96 V118" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#agent-chat-vs-agent-ah-link)"/>
    <path d="M520 96 V118" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#agent-chat-vs-agent-ah-link)"/>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 30;0 30" keyTimes="0;0.0444;0.1667;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0444;0.0611;0.15;0.1667;1" dur="9s" repeatCount="indefinite"/><g><rect x="420" y="150" width="70" height="16" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="160.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -30;0 -30" keyTimes="0;0.1778;0.3;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1778;0.1944;0.2833;0.3;1" dur="9s" repeatCount="indefinite"/><g><rect x="420" y="150" width="70" height="16" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="160.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">result</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 30;0 30" keyTimes="0;0.3556;0.4778;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3556;0.3722;0.4611;0.4778;1" dur="9s" repeatCount="indefinite"/><g><rect x="420" y="150" width="70" height="16" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="160.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -30;0 -30" keyTimes="0;0.4889;0.6111;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4889;0.5056;0.5944;0.6111;1" dur="9s" repeatCount="indefinite"/><g><rect x="420" y="150" width="70" height="16" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="160.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">result</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 30;0 30" keyTimes="0;0.6667;0.7889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6833;0.7722;0.7889;1" dur="9s" repeatCount="indefinite"/><g><rect x="420" y="150" width="70" height="16" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="160.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -30;0 -30" keyTimes="0;0.8;0.9222;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.8167;0.9056;0.9222;1" dur="9s" repeatCount="indefinite"/><g><rect x="420" y="150" width="70" height="16" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="455" y="160.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">result</text></g></g>
    <text x="455" y="252" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the agent fetches and acts; she only says yes</text>
  </g>
  <text x="300" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">On the left, Maya copies the configs in and the answer out by hand. On the right, the agent reads the</tspan><tspan x="300" dy="14">files and runs the command itself and she only approves.</tspan></text>
</svg>
