<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="750" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A multi-line prompt is saved into a precheck file, which becomes a slash command; typing /precheck expands the saved prompt back into the conversation.">
  <title>A long prompt, saved as one command</title>
  <defs><marker id="ssw-slash-command-ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ssw-slash-command-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">A LONG PROMPT, SAVED AS ONE COMMAND</text>
  <g transform="translate(0,30)">
    <text x="120" y="30" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">what you keep typing</text>
    <g><rect x="28" y="46" width="184" height="24" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="61" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">check the freeze calendar</text></g>
    <g><rect x="28" y="76" width="184" height="24" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="91" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">lint the config</text></g>
    <g><rect x="28" y="106" width="184" height="24" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="121" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">run pre-checks</text></g>
    <g><rect x="28" y="136" width="184" height="24" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="151" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">write the summary</text></g>
    <path d="M212 106 H250" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ssw-slash-command-ah-link)"/>
    <g><animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/><g><rect x="250" y="86" width="96" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="298" y="109" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">precheck.md</text></g></g>
    <text x="298" y="150" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">saved once</text>
    <g><rect x="392" y="60" width="70" height="26" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="427" y="76.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">/precheck</text></g>
    <text x="500" y="50" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">you type it</text>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.1;0.925;0.975;1" dur="8s" repeatCount="indefinite"/><g><rect x="474" y="70" width="110" height="22" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="529" y="83.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">instruction</text></g><g><rect x="474" y="100" width="110" height="22" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="529" y="113.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">instruction</text></g><g><rect x="474" y="130" width="110" height="22" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="529" y="143.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">instruction</text></g><g><rect x="474" y="160" width="110" height="22" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="529" y="173.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">instruction</text></g></g>
    <path d="M462 73 H474" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ssw-slash-command-ah-accent2)"/>
    <text x="300" y="222" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the command carries exactly the text you wrote</text>
  </g>
  <text x="300" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">The paragraph you keep retyping is saved once as a file; from then on you invoke it by name. Watch the</tspan><tspan x="300" dy="14">saved prompt expand back out when you call it.</tspan></text>
</svg>
