<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="750" height="475" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Top pipeline: a document splits into chunks, each becomes an embedding, stored in a vector database. Bottom pipeline: a question becomes a query vector, the nearest chunks are retrieved and placed into the prompt.">
  <title>Retrieval: fetch only the pages that matter</title>
  <defs><marker id="ctx-rag-pipeline-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="379" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">RETRIEVAL: FETCH ONLY THE PAGES THAT MATTER</text>
  <g transform="translate(0,30)">
    <text x="300" y="24" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">index once (ahead of time)</text>
    <g><rect x="28" y="44" width="90" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="73" y="63.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">manual</text><text x="73" y="75.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2,000 pages</text></g>
    <g><rect x="150" y="44" width="90" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="195" y="63.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">chunks</text><text x="195" y="75.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">passages</text></g>
    <g><rect x="272" y="44" width="100" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="322" y="63.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">embeddings</text><text x="322" y="75.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">vectors</text></g>
    <g><rect x="404" y="44" width="120" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="464" y="63.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">vector database</text><text x="464" y="75.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">index</text></g>
    <path d="M118 66 H150" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M240 66 H272" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M372 66 H404" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <text x="300" y="170" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">per question</text>
    <g><rect x="28" y="190" width="110" height="44" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="83" y="208.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">&quot;why flap</text><text x="83" y="221.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">every 60s?&quot;</text></g>
    <g><rect x="170" y="190" width="100" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="220" y="209.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">query vector</text><text x="220" y="221.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">same embedder</text></g>
    <g><rect x="302" y="190" width="110" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="357" y="209.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">nearest chunks</text><text x="357" y="221.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">top matches</text></g>
    <g><rect x="444" y="190" width="120" height="44" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="504" y="215.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">prompt + sources</text></g>
    <path d="M138 212 H170" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M270 212 H302" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M412 212 H444" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M464 88 C 420 130, 380 150, 357 188" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ctx-rag-pipeline-ah-link)"/>
    <text x="300" y="270" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the model reads the retrieved chunks on the desk; it never &quot;knew&quot; them</text>
  </g>
  <text x="300" y="348" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Top row runs once when documents are loaded: split into chunks, embed each, store the vectors. Bottom row</tspan><tspan x="300" dy="14">runs per question: embed the query, find the nearest chunks, paste them onto the desk.</tspan></text>
</svg>
