<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="750" height="425" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A main agent spawns two subagents, each with its own context window reading many configs; each returns only a short summary to the main agent.">
  <title>A helper keeps the bulk out of the main context</title>
  <rect x="0.5" y="0.5" width="599" height="339" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">A HELPER KEEPS THE BULK OUT OF THE MAIN CONTEXT</text>
  <g transform="translate(0,30)">
    <g><rect x="240" y="30" width="120" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="300" y="49.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">main agent</text><text x="300" y="61.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">your conversation</text></g>
    <g><rect x="70" y="150" width="140" height="70" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="140" y="182.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">subagent</text><text x="140" y="194.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">own context window</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 76;0 76" keyTimes="0;0.0444;0.3111;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0444;0.0611;0.2944;0.3111;1" dur="9s" repeatCount="indefinite"/><g><rect x="95" y="86" width="90" height="20" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="140" y="98.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">task</text></g></g>
    <text x="140" y="128" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">audit leaves 1-20</text>
    <text x="140" y="240" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">40 configs read here</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -76;0 -76" keyTimes="0;0.5556;0.8222;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5556;0.5722;0.8056;0.8222;1" dur="9s" repeatCount="indefinite"/><g><rect x="95" y="150" width="90" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="140" y="162.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">summary</text></g></g>
    <g><rect x="390" y="150" width="140" height="70" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="460" y="182.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">subagent</text><text x="460" y="194.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">own context window</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 76;0 76" keyTimes="0;0.0889;0.3556;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0889;0.1056;0.3389;0.3556;1" dur="9s" repeatCount="indefinite"/><g><rect x="415" y="86" width="90" height="20" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="460" y="98.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">task</text></g></g>
    <text x="460" y="128" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">audit leaves 21-40</text>
    <text x="460" y="240" fill="#94a3b8" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">40 configs read here</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;0 -76;0 -76" keyTimes="0;0.6222;0.8889;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6222;0.6389;0.8722;0.8889;1" dur="9s" repeatCount="indefinite"/><g><rect x="415" y="150" width="90" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="460" y="162.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">summary</text></g></g>
    <path d="M300 74 V150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
  <text x="300" y="308" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">The main agent hands each helper a self-contained task. The large file reads stay in the helper's own</tspan><tspan x="300" dy="14">context; only a short result comes back.</tspan></text>
</svg>
