<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="750" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="An agent in a dashed sandbox box with a throwaway filesystem and read-only credential; one gated path leads out to production, which is outside the box.">
  <title>Contain the blast radius</title>
  <defs><marker id="t04-sandbox-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="t04-sandbox-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">CONTAIN THE BLAST RADIUS</text>
  <g transform="translate(0,30)">
    <rect x="30" y="50" width="320" height="170" rx="6" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="190" y="70" fill="#0891b2" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">sandbox: container or VM</text>
    <g><rect x="70" y="92" width="110" height="48" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="125" y="113.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Agent</text><text x="125" y="125.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">misstep stays here</text></g>
    <g><rect x="210" y="92" width="110" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="265" y="109.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">scratch FS</text><text x="265" y="121.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">throwaway</text></g>
    <g><rect x="210" y="150" width="110" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="265" y="167.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read-only cred</text><text x="265" y="179.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">least privilege</text></g>
    <path d="M180 116 H210" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#t04-sandbox-ah-link)"/>
    <path d="M180 128 L210 168" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#t04-sandbox-ah-link)"/>
    <g><rect x="470" y="110" width="110" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="525" y="135.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Production</text><text x="525" y="147.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">outside the box</text></g>
    <g><rect x="378" y="118" width="70" height="40" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="413" y="135.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">approval</text><text x="413" y="146.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">gate</text></g>
    <path d="M350 138 H378" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#t04-sandbox-ah-link)"/>
    <path d="M448 138 H470" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#t04-sandbox-ah-warn)"/>
    <text x="300" y="234" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">no outbound network and no prod keys inside = a misstep cannot escape</text>
  </g>
  <text x="300" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">The agent runs inside a sandbox with scoped credentials; only an approved path reaches the outside, and</tspan><tspan x="300" dy="14">production sits beyond the boundary.</tspan></text>
</svg>
