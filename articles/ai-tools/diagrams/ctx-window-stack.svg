<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="700" height="550" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Seven layers stack from the bottom up inside a box: system prompt, tool descriptions, rules files, memory, retrieved documents, conversation so far, and your message on top; a dashed line marks the token limit above them.">
  <title>What gets assembled onto the desk, in order</title>
  <rect x="0.5" y="0.5" width="559" height="439" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">WHAT GETS ASSEMBLED ONTO THE DESK, IN ORDER</text>
  <g transform="translate(0,30)">
    <text x="280" y="24" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the context window (one block of tokens)</text>
    <rect x="150" y="34" width="260" height="290" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="50" x2="410" y2="50" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="468" y="53" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">token limit</text>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.03;0.07;1" dur="10s" repeatCount="indefinite"/><g><rect x="166" y="292" width="228" height="28" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="280" y="309.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">system prompt</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.13;0.17;1" dur="10s" repeatCount="indefinite"/><g><rect x="166" y="260" width="228" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="277.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tool descriptions</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.23;0.27;1" dur="10s" repeatCount="indefinite"/><g><rect x="166" y="228" width="228" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="245.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">rules files</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.33;0.37;1" dur="10s" repeatCount="indefinite"/><g><rect x="166" y="196" width="228" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="213.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">memory</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.43;0.47;1" dur="10s" repeatCount="indefinite"/><g><rect x="166" y="164" width="228" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="181.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">retrieved documents</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.53;0.57;1" dur="10s" repeatCount="indefinite"/><g><rect x="166" y="132" width="228" height="28" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="280" y="149.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">conversation so far</text></g></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="10s" repeatCount="indefinite"/><g><rect x="166" y="100" width="228" height="28" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="280" y="117.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">your message</text></g></g>
    <text x="280" y="346" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">each turn the model reads the whole stack and nothing else</text>
  </g>
  <text x="280" y="408" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">The harness lays its own instructions down first and your message last; watch each layer appear in</tspan><tspan x="280" dy="14">turn. The whole stack has to fit under the token limit line.</tspan></text>
</svg>
