<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="750" height="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A pipeline: requirements feeds design, design feeds a task list, and each task feeds the implement step one at a time.">
  <title>Write the plan first, then build against it</title>
  <defs><marker id="ssw-spec-pipeline-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="289" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">WRITE THE PLAN FIRST, THEN BUILD AGAINST IT</text>
  <g transform="translate(0,30)">
    <g><rect x="24" y="70" width="128" height="54" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="88" y="94.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">requirements</text><text x="88" y="106.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">what it must do</text></g>
    <path d="M152 97 H168" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#ssw-spec-pipeline-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path>
    <g><rect x="168" y="70" width="128" height="54" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="232" y="94.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">design</text><text x="232" y="106.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">how to build it</text></g>
    <path d="M296 97 H312" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#ssw-spec-pipeline-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path>
    <g><rect x="312" y="70" width="128" height="54" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="376" y="94.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tasks</text><text x="376" y="106.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">discrete steps</text></g>
    <path d="M440 97 H456" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#ssw-spec-pipeline-ah-accent)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path>
    <g><rect x="456" y="70" width="128" height="54" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="520" y="94.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">implement</text><text x="520" y="106.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">one task at a time</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;432 0;432 0" keyTimes="0;0.0444;0.6667;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0444;0.0611;0.65;0.6667;1" dur="9s" repeatCount="indefinite"/><g><rect x="28" y="134" width="110" height="20" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="83" y="146.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">the feature</text></g></g>
    <text x="300" y="190" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">a wrong assumption caught here costs a sentence, not a rewrite</text>
  </g>
  <text x="300" y="258" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">A spec turns a fuzzy request into requirements, a design and a task list, then the agent implements one</tspan><tspan x="300" dy="14">task at a time. Watch the work flow left to right.</tspan></text>
</svg>
