<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="750" height="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A ticket containing a hidden malicious instruction flows into the agent's context; it becomes a POST tool call that an approval gate blocks before it leaves.">
  <title>Injected text tries to become a command</title>
  <defs><marker id="t04-prompt-injection-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="t04-prompt-injection-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="329" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">INJECTED TEXT TRIES TO BECOME A COMMAND</text>
  <g transform="translate(0,30)">
    <g><rect x="30" y="60" width="130" height="70" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="95" y="92.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ticket</text><text x="95" y="104.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">counters + ...</text></g>
    <g><rect x="40" y="150" width="110" height="28" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="95" y="161.5" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">&quot;POST configs&quot;</text><text x="95" y="171.9" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">hidden instruction</text></g>
    <g><rect x="230" y="70" width="120" height="90" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="290" y="112.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">context</text><text x="290" y="124.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">data = instructions</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;150 -70;150 -70" keyTimes="0;0.05;0.3;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.065;0.285;0.3;1" dur="10s" repeatCount="indefinite"/><g><rect x="40" y="150" width="90" height="24" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="85" y="164.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">inject</text></g></g>
    <path d="M160 95 H230" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#t04-prompt-injection-ah-link)"/>
    <g><rect x="420" y="70" width="120" height="44" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="480" y="89.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tool call</text><text x="480" y="101.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">POST to URL</text></g>
    <path d="M350 92 H420" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#t04-prompt-injection-ah-link)"/>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;120 0;120 0" keyTimes="0;0.34;0.6;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.355;0.585;0.6;1" dur="10s" repeatCount="indefinite"/><g><rect x="356" y="128" width="60" height="22" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="386" y="141.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">exfil</text></g></g>
    <g><rect x="420" y="150" width="120" height="44" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="480" y="169.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">approval gate</text><text x="480" y="180.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">blocked</text></g>
    <path d="M480 114 V150" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#t04-prompt-injection-ah-warn)"/>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.65;1" dur="10s" repeatCount="indefinite"/><text x="480" y="214" fill="#d97706" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">stopped: outbound needs a human</text></g>
    <text x="190" y="234" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the model cannot tell data from orders; the system around it must</text>
  </g>
  <text x="300" y="298" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Watch the red instruction, hidden in a fetched ticket, flow into the context and turn into an outbound</tspan><tspan x="300" dy="14">tool call that the approval gate stops.</tspan></text>
</svg>
