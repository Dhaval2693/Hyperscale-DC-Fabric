<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="750" height="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A model box and a harness box. The model emits a tool-call request that travels to the harness; the harness runs the tool and a result travels back; the cycle repeats.">
  <title>The model asks; the harness acts</title>
  <defs><marker id="tool-call-loop-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="359" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">THE MODEL ASKS; THE HARNESS ACTS</text>
  <g transform="translate(0,30)">
    <g><rect x="40" y="100" width="130" height="70" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="105" y="132.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Model</text><text x="105" y="144.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">emits text only</text></g>
    <g><rect x="430" y="100" width="130" height="70" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="495" y="132.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Harness</text><text x="495" y="144.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">runs the tool</text></g>
    <g><rect x="430" y="198" width="130" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="495" y="223" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">device / file / API</text></g>
    <path d="M495 170 V198" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tool-call-loop-ah-link)"/>
    <path d="M170 118 H430" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="300" y="108" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">1. tool-call request</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;250 0;250 0" keyTimes="0;0.0444;0.4;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0444;0.0611;0.3833;0.4;1" dur="9s" repeatCount="indefinite"/><g><rect x="176" y="108" width="74" height="20" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="213" y="120.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">call</text></g></g>
    <path d="M430 152 H170" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="300" y="170" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">2. result as text</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-250 0;-250 0" keyTimes="0;0.4667;0.8222;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4667;0.4833;0.8056;0.8222;1" dur="9s" repeatCount="indefinite"/><g><rect x="356" y="142" width="74" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="393" y="154.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">result</text></g></g>
    <text x="300" y="206" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">3. model reads the result and continues</text>
    <text x="300" y="248" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">define tools  -&gt;  model picks one  -&gt;  harness executes  -&gt;  loop</text>
  </g>
  <text x="300" y="328" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">Watch the amber request leave the model for the harness, then the violet result return. The model only</tspan><tspan x="300" dy="14">ever emits a request — it never touches the world.</tspan></text>
</svg>
