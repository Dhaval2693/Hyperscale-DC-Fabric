<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="700" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A tall stack of many conversation turns on the left is compressed by an arrow into a single short summary note on the right, with free space opening up beside it.">
  <title>Compaction squeezes an old conversation into a summary</title>
  <defs><marker id="ctx-compaction-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">COMPACTION SQUEEZES AN OLD CONVERSATION INTO A SUMMARY</text>
  <g transform="translate(0,30)">
    <line x1="30" y1="42" x2="250" y2="42" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="140" y="32" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">window limit</text>
    <text x="140" y="60" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">before: desk nearly full</text>
    <g><animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/><rect x="50" y="72" width="180" height="16" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><rect x="50" y="92" width="180" height="16" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><rect x="50" y="112" width="180" height="16" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><rect x="50" y="132" width="180" height="16" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><rect x="50" y="152" width="180" height="16" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><rect x="50" y="172" width="180" height="16" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><rect x="50" y="192" width="180" height="16" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/></g>
    <path d="M240 150 H300" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ctx-compaction-ah-link)"/>
    <text x="270" y="140" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">compact</text>
    <line x1="310" y1="42" x2="530" y2="42" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="420" y="60" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">after: summary + room</text>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2222;0.2778;1" dur="9s" repeatCount="indefinite"/><g><rect x="330" y="72" width="180" height="34" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="420" y="92" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">summary of earlier turns</text></g><g><rect x="330" y="114" width="180" height="60" rx="6" fill="none" stroke="#16a34a" stroke-width="1.5"/><text x="420" y="147" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">free space</text></g></g>
    <text x="280" y="214" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">detail is dropped in the squeeze — that is the cost</text>
  </g>
  <text x="280" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">When the desk nears its limit, the harness replaces the long early transcript with a short summary</tspan><tspan x="280" dy="14">— room is freed, but some detail is always lost.</tspan></text>
</svg>
