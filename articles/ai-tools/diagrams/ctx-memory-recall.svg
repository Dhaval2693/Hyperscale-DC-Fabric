<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="725" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Session one on the left saves a note to a memory store in the middle; an arrow shows the context cleared between sessions; session two on the right pulls the note back out of the store.">
  <title>Memory survives the desk being swept clean</title>
  <defs><marker id="ctx-memory-recall-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="579" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">MEMORY SURVIVES THE DESK BEING SWEPT CLEAN</text>
  <g transform="translate(0,30)">
    <g><rect x="230" y="92" width="120" height="56" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="290" y="117.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">memory store</text><text x="290" y="129.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">on disk</text></g>
    <text x="90" y="30" fill="#64748b" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">session 1</text>
    <g><rect x="30" y="50" width="120" height="44" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="90" y="68.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">&quot;no Friday</text><text x="90" y="81.5" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">deploys&quot;</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;110 48;110 48" keyTimes="0;0.0444;0.3333;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0444;0.0611;0.3167;0.3333;1" dur="9s" repeatCount="indefinite"/><g><rect x="60" y="60" width="70" height="20" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="95" y="72.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">save</text></g></g>
    <path d="M150 72 C 190 80, 200 110, 228 115" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ctx-memory-recall-ah-link)"/>
    <text x="290" y="196" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">context window wiped between sessions</text>
    <line x1="230" y1="176" x2="350" y2="176" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="490" y="30" fill="#64748b" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">session 2</text>
    <g><rect x="430" y="50" width="120" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="490" y="75" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">fresh desk</text></g>
    <path d="M352 115 C 400 110, 410 80, 448 72" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ctx-memory-recall-ah-link)"/>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-110 -48;-110 -48" keyTimes="0;0.5556;0.8444;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5556;0.5722;0.8278;0.8444;1" dur="9s" repeatCount="indefinite"/><g><rect x="452" y="110" width="70" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="487" y="122.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">recall</text></g></g>
  </g>
  <text x="290" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="290" dy="0">In session one the tool writes a note to a store; the context window is wiped between sessions; in</tspan><tspan x="290" dy="14">session two the note is injected back onto the fresh desk.</tspan></text>
</svg>
