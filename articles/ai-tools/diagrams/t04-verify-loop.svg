<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="700" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A cycle: the agent proposes a change, tests run, a human reads the diff, then approves; an arrow loops back for the next change.">
  <title>Trust nothing until it is checked</title>
  <defs><marker id="t04-verify-loop-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="0.5" y="0.5" width="559" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">TRUST NOTHING UNTIL IT IS CHECKED</text>
  <g transform="translate(0,30)">
    <g><rect x="70" y="70" width="120" height="46" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="130" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">change</text><text x="130" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">agent proposes</text></g>
    <g><rect x="230" y="70" width="120" height="46" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="290" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">tests + lint</text><text x="290" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">run them yourself</text></g>
    <g><rect x="390" y="70" width="120" height="46" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="450" y="90.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read the diff</text><text x="450" y="102.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">line by line</text></g>
    <g><rect x="390" y="160" width="120" height="46" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="450" y="180.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">approve</text><text x="450" y="192.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">small, reversible</text></g>
    <path d="M190 93 H230" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#t04-verify-loop-ah-link)"/>
    <path d="M350 93 H390" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#t04-verify-loop-ah-link)"/>
    <path d="M450 116 V160" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#t04-verify-loop-ah-link)"/>
    <path d="M390 183 H160 Q70 183 70 130 V116" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#t04-verify-loop-ah-link)"/>
    <text x="225" y="205" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">next change</text>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;320 0;320 0" keyTimes="0;0.0556;0.4444;1" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0556;0.0722;0.4278;0.4444;1" dur="9s" repeatCount="indefinite"/><circle cx="130" cy="93" r="5" fill="#d97706"/></g>
    <text x="280" y="234" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">the agent accelerates the work; it does not grade its own homework</text>
  </g>
  <text x="280" y="288" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">The agent proposes a change; tests, a diff review and your approval each have to pass before it</tspan><tspan x="280" dy="14">lands, because fluent output is not evidence it is correct.</tspan></text>
</svg>
