<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="750" height="425" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Four skills each shown as a one-line description in the context; a request matches the change-precheck skill, whose full instructions expand while the others stay small.">
  <title>Only the matching skill's body loads</title>
  <defs><marker id="ssw-progressive-disclosure-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="ssw-progressive-disclosure-ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="339" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">ONLY THE MATCHING SKILL'S BODY LOADS</text>
  <g transform="translate(0,30)">
    <text x="118" y="30" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">always in context</text>
    <g><rect x="28" y="44" width="180" height="24" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="118" y="59" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">format-report</text></g>
    <g><rect x="28" y="74" width="180" height="24" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="118" y="89" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">change-precheck</text></g>
    <g><rect x="28" y="104" width="180" height="24" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="118" y="119" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">audit-acl</text></g>
    <g><rect x="28" y="134" width="180" height="24" rx="6" fill="#f1f3f6" stroke="#94a3b8" stroke-width="1.5"/><text x="118" y="149" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">oncall-handoff</text></g>
    <g><rect x="250" y="54" width="92" height="40" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="296" y="71.8" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">request</text><text x="296" y="82.2" fill="#64748b" font-size="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">about to push</text></g>
    <path d="M250 74 H212" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#ssw-progressive-disclosure-ah-warn)"/>
    <text x="296" y="112" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="296" dy="0">matches</tspan><tspan x="296" dy="11.7">change-precheck</tspan></text>
    <text x="486" y="30" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">loaded on match</text>
    <path d="M342 74 H378" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#ssw-progressive-disclosure-ah-accent)"/>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0556;0.1;0.9333;0.9778;1" dur="9s" repeatCount="indefinite"/><rect x="380" y="44" width="196" height="150" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="478" y="64" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">change-precheck</text><text x="392" y="90" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">1. check freeze calendar</text><text x="392" y="112" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">2. lint the config</text><text x="392" y="134" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">3. run device pre-checks</text><text x="392" y="156" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">4. write the summary</text></g>
    <text x="300" y="238" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">a hundred skills cost a hundred lines, not a hundred procedures</text>
  </g>
  <text x="300" y="308" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">At startup the agent holds just a one-line description of every skill. When your request matches one,</tspan><tspan x="300" dy="14">that skill's full body loads; the others stay as one line.</tspan></text>
</svg>
