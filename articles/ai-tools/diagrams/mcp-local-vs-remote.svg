<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="750" height="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Left: host and local server on one machine, joined by stdin/stdout pipes. Right: host on your machine connects over HTTPS with a bearer token to a remote server.">
  <title>Local (stdio) vs remote (Streamable HTTP)</title>
  <rect x="0.5" y="0.5" width="599" height="369" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">LOCAL (STDIO) VS REMOTE (STREAMABLE HTTP)</text>
  <g transform="translate(0,30)">
    <line x1="300" y1="48" x2="300" y2="258" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="150" y="34" fill="#0891b2" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">local: stdio</text>
    <g><rect x="40" y="70" width="100" height="50" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="90" y="98.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Host</text></g>
    <g><rect x="190" y="70" width="100" height="50" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="240" y="92.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Server</text><text x="240" y="104.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">child process</text></g>
    <path d="M140 86 H190" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M190 104 H140" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.1s" repeatCount="indefinite"/></path>
    <text x="165" y="140" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">stdin / stdout pipes</text>
    <g><rect x="40" y="170" width="250" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="165" y="193" fill="#334155" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">your machine</text></g>
    <text x="450" y="34" fill="#0891b2" font-size="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">remote: Streamable HTTP</text>
    <g><rect x="320" y="70" width="96" height="50" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="368" y="98.3" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Host</text></g>
    <g><rect x="500" y="70" width="96" height="50" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="548" y="92.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Server</text><text x="548" y="104.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">on the network</text></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;150 0;150 0" keyTimes="0;0.05;0.425;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.0688;0.4062;0.425;1" dur="8s" repeatCount="indefinite"/><g><rect x="324" y="128" width="84" height="20" rx="6" fill="#faeddf" stroke="#d97706" stroke-width="1.5"/><text x="366" y="140.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">POST + token</text></g></g>
    <g><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 0;-150 0;-150 0" keyTimes="0;0.5;0.875;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5188;0.8562;0.875;1" dur="8s" repeatCount="indefinite"/><g><rect x="512" y="128" width="72" height="20" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="548" y="140.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">SSE stream</text></g></g>
    <path d="M416 95 H500" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="458" y="162" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">HTTPS across the network</text>
    <text x="458" y="182" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">OAuth 2.1: sign in once, client holds a token</text>
    <g><rect x="320" y="206" width="276" height="36" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="458" y="226.7" fill="#334155" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">your machine  |  the network  |  vendor's server</text></g>
  </g>
  <text x="300" y="338" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">A local server is a child process reached over stdio pipes on your machine. A remote server is reached</tspan><tspan x="300" dy="14">over HTTPS across the network, with an OAuth token.</tspan></text>
</svg>
