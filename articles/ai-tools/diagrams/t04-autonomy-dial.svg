<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="750" height="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A left-to-right track with four stops: suggest, approve each, allow-listed, autonomous; a marker steps from one to the next while a risk bar grows.">
  <title>Autonomy is a dial, not a switch</title>
  <defs><marker id="t04-autonomy-dial-ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="289" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">AUTONOMY IS A DIAL, NOT A SWITCH</text>
  <g transform="translate(0,30)">
    <path d="M60 90 H495" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <g><rect x="8" y="70" width="104" height="40" rx="6" fill="#e1f3e7" stroke="#16a34a" stroke-width="1.5"/><text x="60" y="87.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">suggest</text><text x="60" y="99.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">you run it</text></g>
    <g><rect x="153" y="70" width="104" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="205" y="87.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">approve each</text><text x="205" y="99.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">it asks every step</text></g>
    <g><rect x="298" y="70" width="104" height="40" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="350" y="87.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">allow-listed</text><text x="350" y="99.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">safe ones pre-ok'd</text></g>
    <g><rect x="443" y="70" width="104" height="40" rx="6" fill="#fae3e3" stroke="#dc2626" stroke-width="1.5"/><text x="495" y="87.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">autonomous</text><text x="495" y="99.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">review after</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0444;0.0722;0.2667;0.2944;1" dur="9s" repeatCount="indefinite"/><circle cx="60" cy="90" r="6" fill="#d97706"/><text x="60" y="134" fill="#d97706" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">here</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2667;0.2944;0.4889;0.5167;1" dur="9s" repeatCount="indefinite"/><circle cx="205" cy="90" r="6" fill="#d97706"/><text x="205" y="134" fill="#d97706" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">here</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4889;0.5167;0.7111;0.7389;1" dur="9s" repeatCount="indefinite"/><circle cx="350" cy="90" r="6" fill="#d97706"/><text x="350" y="134" fill="#d97706" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">here</text></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7111;0.7389;1" dur="9s" repeatCount="indefinite"/><circle cx="495" cy="90" r="6" fill="#d97706"/><text x="495" y="134" fill="#d97706" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">here</text></g>
    <text x="60" y="170" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="start">lower risk, slower</text>
    <text x="540" y="170" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="end">higher risk, faster</text>
    <path d="M60 182 H540" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#t04-autonomy-dial-ah-hot)"/>
  </g>
  <text x="300" y="258" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="300" dy="0">As the setting moves right the agent asks less and does more on its own, and the risk of an unwanted</tspan><tspan x="300" dy="14">action rises with it.</tspan></text>
</svg>
