<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" width="700" height="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Three stacked rule sources on the left — global in the home directory, project in the repo, folder-level in a subdirectory — flow into a prompt box on the right labelled most-specific wins.">
  <title>Rules at three scope levels merge into the prompt</title>
  <rect x="0.5" y="0.5" width="559" height="349" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="20" fill="#64748b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="1">RULES AT THREE SCOPE LEVELS MERGE INTO THE PROMPT</text>
  <g transform="translate(0,30)">
    <g><rect x="30" y="36" width="160" height="48" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="110" y="57.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">global</text><text x="110" y="69.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">~/ home dir, every project</text></g>
    <g><rect x="30" y="96" width="160" height="48" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="110" y="117.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">project</text><text x="110" y="129.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">repo root, this repo</text></g>
    <g><rect x="30" y="156" width="160" height="48" rx="6" fill="#dff1f5" stroke="#0891b2" stroke-width="1.5"/><text x="110" y="177.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">folder</text><text x="110" y="189.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">subdirectory, one subtree</text></g>
    <path d="M190 60 C 270 60, 310 120, 384 120" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M190 120 C 270 120, 310 120, 384 120" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M190 180 C 270 180, 310 120, 384 120" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/></path>
    <g><rect x="384" y="90" width="150" height="60" rx="6" fill="#eee5fd" stroke="#7c3aed" stroke-width="1.5"/><text x="459" y="117.45" fill="#334155" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">prompt</text><text x="459" y="129.15" fill="#64748b" font-size="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">most specific wins</text></g>
    <text x="280" y="224" fill="#dc2626" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">your chat message overrides every rules file</text>
    <text x="280" y="246" fill="#64748b" font-size="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">same idea across tools: AGENTS.md, CLAUDE.md, .kiro/steering, .cursor/rules</text>
  </g>
  <text x="280" y="318" fill="#64748b" font-size="10.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="280" dy="0">Global, project and folder rules all flow onto the desk; where they conflict, the most specific</tspan><tspan x="280" dy="14">one wins, and your direct chat message overrides them all.</tspan></text>
</svg>
